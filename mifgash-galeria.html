<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>גלריית הרכזים · כוחות-העל שלנו · מפגש רכזי הבוגרים #1 · הופה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#E8348A; --pink-deep:#C2185B; --pink-soft:#FCE7F2;
  --yellow:#FFF200; --yellow-deep:#FFD500;
  --ink:#141414; --gray:#666;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Rubik',Arial,sans-serif;background:#111;overflow:hidden;-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1920px;height:1080px;position:relative;flex:0 0 auto;background:#fff;box-shadow:0 0 60px rgba(0,0,0,.55);overflow:hidden}

.slide{position:absolute;inset:0;display:none;background:#fff;color:var(--ink)}
.slide.on{display:flex;animation:fadein .7s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.bar{position:absolute;top:0;right:0;left:0;height:16px;background:linear-gradient(90deg,var(--pink),var(--yellow));z-index:3}
.logo{position:absolute;bottom:40px;left:56px;height:62px;opacity:.92;z-index:3}
.site{position:absolute;bottom:52px;right:64px;font-size:26px;font-weight:800;color:var(--pink-deep);z-index:3;text-decoration:none}

/* שער */
.cover{flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--pink);color:#fff}
.cover .kicker{background:var(--yellow);color:var(--ink);padding:10px 34px;border-radius:99px;font-weight:800;font-size:30px}
.cover h1{font-size:150px;font-weight:900;line-height:1.1;margin-top:44px}
.cover h1 i{font-style:normal;color:var(--yellow)}
.cover p{font-size:42px;font-weight:600;margin-top:36px;color:#ffd9ea;line-height:1.5}
.cover .strip{display:flex;gap:14px;margin-top:60px}
.cover .strip img{height:150px;border-radius:14px;box-shadow:0 10px 26px rgba(0,0,0,.3)}

/* שקף רכז/ת */
.person{flex-direction:row}
.p-img{flex:0 0 620px;height:100%;display:flex;align-items:center;justify-content:center;background:var(--pink-soft);position:relative}
.p-img img{height:1010px;max-width:100%;object-fit:contain;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.p-txt{flex:1;display:flex;flex-direction:column;justify-content:center;padding:80px 110px 120px 90px}
.p-num{font-size:30px;font-weight:800;color:var(--gray);letter-spacing:1px}
.p-name{font-size:104px;font-weight:900;line-height:1.08;color:var(--ink);margin-top:14px}
.p-school{display:inline-block;align-self:flex-start;background:var(--yellow);color:var(--ink);padding:10px 30px;border-radius:99px;font-size:36px;font-weight:800;margin-top:26px}
.p-power-label{font-size:34px;font-weight:800;color:var(--pink-deep);margin-top:64px}
.p-power{font-size:74px;font-weight:900;line-height:1.22;color:var(--pink);margin-top:14px}
.p-power.long{font-size:52px;font-weight:800}
.p-future{font-size:33px;font-weight:500;color:var(--gray);line-height:1.5;margin-top:56px;border-right:8px solid var(--yellow-deep);padding-right:28px}
.p-future b{color:var(--ink);font-weight:800}

/* סיום */
.outro{flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--ink);color:#fff}
.outro h1{font-size:120px;font-weight:900;line-height:1.15}
.outro h1 i{font-style:normal;color:var(--yellow)}
.outro p{font-size:44px;color:#bbb;margin-top:40px;font-weight:500}

/* פס התקדמות אוטומטי */
#progress{position:absolute;bottom:0;right:0;left:0;height:10px;background:rgba(0,0,0,.08);z-index:5}
#progress span{display:block;height:100%;width:0;background:var(--pink)}
#progress span.run{animation:grow linear forwards}
@keyframes grow{from{width:0}to{width:100%}}

footer.hud{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:10px;align-items:center;color:#999;font-size:15px;font-weight:700;background:rgba(0,0,0,.55);padding:8px 16px;border-radius:99px;opacity:.25;transition:opacity .3s}
footer.hud:hover{opacity:1}
footer.hud button{font:inherit;font-weight:800;background:#333;color:#fff;border:none;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:15px}
footer.hud button.play{background:var(--pink)}
#counter{min-width:64px;text-align:center;color:#fff}
</style>
</head>
<body>
<div id="viewport"><div id="stage">

<!-- שער -->
<section class="slide cover on">
  <span class="kicker">מפגש רכזי ורכזות הבוגרים · #1 · 24.8.2026</span>
  <h1>הכוחות שלנו<br><i>19 רכזים, 19 כוחות-על</i></h1>
  <p>הפוסטרים שיצרתם ברישום — הערכים, כוח-העל ותמונת העתיד של כל אחד ואחת</p>
  <div class="strip" id="strip"></div>
</section>

<!-- שקפי הרכזים נבנים בסקריפט -->

<!-- סיום -->
<section class="slide outro">
  <div class="bar"></div>
  <h1>ביחד — <i>קהילה אחת</i><br>לכל בוגרי הופה</h1>
  <p>מצאו בפוסטרים ערך אחד של מישהו אחר שהוא גם שלכם ✍️ כתבו בצ'אט: השם שלי · הערך · של מי</p>
  <img class="logo" src="hopa-logo.png" alt="הופה">
  <a class="site" href="https://hopa.org.il" target="_blank" style="color:var(--yellow)">hopa.org.il</a>
</section>

<div id="progress"><span id="pbar"></span></div>
</div></div>

<footer class="hud">
  <button id="prevB">▶ הקודם</button>
  <span id="counter">1 / 21</span>
  <button id="nextB">הבא ◀</button>
  <button id="playB" class="play">⏸ השהיה</button>
  <button id="fsB">מסך מלא ⛶</button>
</footer>

<script>
var RAKAZIM=[
 {n:"מוניק איפרח ממן",s:"עמל רמת דוד",power:"לקרוא מחשבות",future:"כל בוגר ידע שיש לו כתובת להמשך הדרך, מי שילווה אותו ויכווין אותו לכשיצטרך."},
 {n:"אביחי חריר",s:"עתיד שמיים קריית מוצקין",power:"מוסיף עוד כמה שעות ליממה",future:"שהבוגרים ידעו מה הם קיבלו וידאגו להפיץ את זה בעולם"},
 {n:"זהור אלעוברה",s:"עמל טכנולוגי רהט",power:"לעזור לכל אדם להתמודד עם הקשיים והאתגרים שלו, וליצור עולם שבו אנשים חיים בשלום, בשלווה ובנחת",future:"בוגר/ת עצמאי/ת, בעל/ת חוסן וביטחון עצמי, שמגשים/ה את שאיפותיו/ה ומשתלב/ת בהצלחה בחברה."},
 {n:"טליה ברנע",s:"תיכון שיח' דנון עמקה",power:"כוח האנטי-פומו: להיות במקום הנכון בזמן הנכון",future:"הבוגרים.ות ממשיכים להרגיש שייכות, חלק מקהילה, תמיכה וקרקע."},
 {n:"מור",s:"עמל רמת דוד",power:"להפוך מחשבה למציאות 🪄",future:"שהבוגרים יצאו לדרך חדשה בביטחון, עם אמונה בעצמם, כלים להצליח וחלומות גדולים שהם מעזים להגשים."},
 {n:"לי ארנן",s:"התיכון החברתי תל אביב-יפו",power:"לדבר את כל השפות (ואם אפשר — גם של בעלי החיים!)",future:"מאמינה ביכולת שלה, יודעת שיש לה למי לפנות, גאה בעצמה ובמסגרת ממנה באה."},
 {n:"טלי יונה",s:"אורט צור ברק",power:"להיות ציפור דרור",future:"בוגר עצמאי, פרואקטיבי, ערכי ותורם לחברה"},
 {n:"מריה דיאב",s:"אורט כרמל חיפה",power:"לראות שלושה צעדים קדימה",future:"שכל אחד יגיע למקום שהוא באמת רוצה להיות בו — מתפרנסים בכבוד, שמחים בחיים ומתכננים את השלב הבא."},
 {n:"סאמר מיעארי",s:"טכנולוגי אלאמאני סחנין",power:"לגרום לאנשים לחיות בשלום, בשלווה ובביטחון",future:"כל בוגר ידע שיש מקום חם ואוהב שאליו יוכל לחזור, להתייעץ ולקבל עזרה."},
 {n:"היאם אזברגה",s:"דרור נווה מדבר",power:"הומור",future:"בוגר מבקש. שואל. מעז."},
 {n:"ריקי מסס",s:"יוצר עמל טכנולוגי אשדוד",power:"לא להתעייף לעולם",future:"בוגרים עצמאיים ומקצועיים, הפוסעים בעולם עם ארגז כלים עשיר, חוסן פנימי ותשוקה להצליח."},
 {n:"עלי עותמאן",s:"עתיד אבדאע ביר אלמכסור",power:"לתת להם את כל הכלים — כדי שלא רק יחלמו על העתיד",future:"בוגר בעל מקצוע, עצמאי ובטוח בעצמו, המשתלב בעולם העבודה ומוביל את עתידו."},
 {n:"טוהר מרסדס כהן",s:"אורט מרום עכו",power:"לעוף באוויר כמו ציפור",future:"קהילת בוגרים ותחושת שייכות. בוגר עצמאי עם יכולות ומיומנויות."},
 {n:"ראניה חגו",s:"טכנולוגי לקייה",power:"כוח הכבוד: יחס חם והערכה לכל אחד בבית הספר",future:"בוגר עצמאי, בעל ערכים וביטחון עצמי, שמרגיש שרואים אותו ומסוגל להגשים את עצמו."},
 {n:"לבנה גיל בן חמו",s:"עתיד יוצר מגשימים כרמיאל",power:"להיות חופשי",future:"שכל בוגר יקבל כלים וידע להשתמש בהם למימושו והצלחתו"},
 {n:"יעקב גרונספלד",s:"אורט בית הערבה",power:"לא לישון",future:"כל בוגר יודע שיש לו כתובת ועוגן."},
 {n:"מוחמד גזאל",s:"טכנולוגי אלאמאני סחנין · מנהל",power:"לשכפל את עצמי",future:"שכל הבוגרים ישתלבו בחברה ויצליחו בעתיד"},
 {n:"מלשה חנין",s:"אורט כרמל חיפה",power:"להגיע בהרף עין לאן שאני רוצה",future:"הבוגר משתלב בהצלחה בלימודים או בתעסוקה, מממש את יכולותיו ומתקדם לעתיד עצמאי ומשמעותי."},
 {n:"מוניר עבדאלהאדי",s:"מנאראת טורעאן",power:"להבין מיד, בלי מילים, מה כל אדם באמת מרגיש ומה יגרום לו להרגיש בטוח ומסוגל",future:"בוגר שממצה את מלוא הפוטנציאל, משתלב בכבוד בחברה ובתעסוקה, וחי חיים מלאי משמעות וגאווה."}
];

// בניית שקפי הרכזים בין השער לסיום
var outro=document.querySelector('.outro');
RAKAZIM.forEach(function(r,i){
  var num=(i<10?'0':'')+i;
  var sec=document.createElement('section');
  sec.className='slide person';
  sec.innerHTML=
    '<div class="bar"></div>'+
    '<div class="p-img"><img src="posters/'+num+'.jpg" alt="'+r.n+'"></div>'+
    '<div class="p-txt">'+
      '<div class="p-num">'+(i+1)+' / '+RAKAZIM.length+' · גלריית הרכזים</div>'+
      '<div class="p-name">'+r.n+'</div>'+
      '<span class="p-school">'+r.s+'</span>'+
      '<div class="p-power-label">⚡ כוח-העל שלי</div>'+
      '<div class="p-power'+(r.power.length>42?' long':'')+'">'+r.power+'</div>'+
      '<div class="p-future"><b>תמונת העתיד:</b> '+r.future+'</div>'+
    '</div>'+
    '<img class="logo" src="hopa-logo.png" alt="הופה">'+
    '<a class="site" href="https://hopa.org.il" target="_blank">hopa.org.il</a>';
  outro.parentNode.insertBefore(sec,outro);
});

// פס תמונות קטן בשער
var strip=document.getElementById('strip');
[1,4,7,10,13,16,18].forEach(function(i){
  var num=(i<10?'0':'')+i;
  strip.innerHTML+='<img src="posters/'+num+'.jpg" alt="">';
});

var slides=[].slice.call(document.querySelectorAll('.slide')),cur=0;
var COVER_MS=8000,PERSON_MS=10000,OUTRO_MS=14000;
var playing=true,timer=null,pbar=document.getElementById('pbar');

function durFor(i){
  if(i===0)return COVER_MS;
  if(i===slides.length-1)return OUTRO_MS;
  return PERSON_MS;
}
function show(i,fromAuto){
  cur=(i+slides.length)%slides.length;
  slides.forEach(function(s,j){s.classList.toggle('on',j===cur)});
  document.getElementById('counter').textContent=(cur+1)+' / '+slides.length;
  restartProgress();
}
function restartProgress(){
  clearTimeout(timer);
  pbar.classList.remove('run');
  void pbar.offsetWidth; // reset animation
  if(playing){
    var d=durFor(cur);
    pbar.style.animationDuration=d+'ms';
    pbar.classList.add('run');
    timer=setTimeout(function(){show(cur+1,true)},d);
  }else{
    pbar.style.width='0';
  }
}
function setPlaying(p){
  playing=p;
  document.getElementById('playB').textContent=p?'⏸ השהיה':'▶ המשך';
  document.getElementById('playB').classList.toggle('play',p);
  restartProgress();
}
function fit(){
  var s=Math.min(window.innerWidth/1920,window.innerHeight/1080);
  document.getElementById('stage').style.transform='scale('+s+')';
}
document.getElementById('stage').style.transformOrigin='center center';
window.addEventListener('resize',fit);fit();

document.getElementById('nextB').addEventListener('click',function(){show(cur+1)});
document.getElementById('prevB').addEventListener('click',function(){show(cur-1)});
document.getElementById('playB').addEventListener('click',function(){setPlaying(!playing)});
document.getElementById('fsB').addEventListener('click',function(){
  if(document.fullscreenElement)document.exitFullscreen();
  else document.documentElement.requestFullscreen();
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'||e.key==='PageDown'||e.key==='Enter'){e.preventDefault();show(cur+1)}
  else if(e.key==='ArrowRight'||e.key==='PageUp'||e.key==='Backspace'){e.preventDefault();show(cur-1)}
  else if(e.key===' '){e.preventDefault();setPlaying(!playing)}
  else if(e.key==='Home')show(0);
  else if(e.key==='End')show(slides.length-1);
});
document.getElementById('stage').addEventListener('click',function(e){
  if(e.target.closest('a'))return;
  setPlaying(!playing);
});
show(0);
</script>
</body>
</html>
