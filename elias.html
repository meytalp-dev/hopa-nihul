<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>קלפי המשחק · שולחנות הרעיונות · הופה</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--pink:#E8348A;--pink-dark:#c02673;--yellow:#FFF200;--ink:#1f1f26;--muted:#7d7d8a;--line:#d5d0da}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{font-family:'Rubik',system-ui,Arial,sans-serif;background:#e9e5ec;color:var(--ink)}
  .bar{background:#111;color:#fff;padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10}
  .bar h1{margin:0;font-size:17px;font-weight:800}
  .bar small{opacity:.6;font-size:12.5px}
  .bar .sp{margin-inline-start:auto}
  .bar select,.bar button{border:none;border-radius:10px;padding:9px 15px;font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit}
  .bar select{background:#222;color:#fff;border:1.5px solid #444}
  .bar button{background:var(--yellow);color:#111}
  .bar button.g{background:#333;color:#fff;border:1.5px solid #555}
  .bar button.g.on{background:var(--pink);border-color:var(--pink)}

  .sheet{width:210mm;min-height:297mm;background:#fff;margin:14px auto;padding:10mm;box-shadow:0 6px 30px rgba(0,0,0,.15);
    display:flex;flex-direction:column;gap:8mm}

  /* קלף אתגר — 2 בעמוד */
  .ch{flex:1;border:3px solid var(--pink);border-radius:7mm;padding:12mm 12mm;display:flex;flex-direction:column;
      position:relative;overflow:hidden;min-height:128mm}
  .ch:before{content:"";position:absolute;top:0;inset-inline-start:0;width:14mm;height:100%;background:var(--pink);opacity:.1}
  .ch .top{display:flex;align-items:center;gap:9px;margin-bottom:auto}
  .ch .top img{height:22px}
  .ch .pill{background:var(--pink);color:#fff;border-radius:999px;padding:4px 13px;font-size:11px;font-weight:800}
  .ch .rn{margin-inline-start:auto;font-size:11px;font-weight:800;color:var(--muted)}
  .ch .q{font-size:31px;font-weight:900;line-height:1.28;letter-spacing:-.5px;margin:auto 0}
  .ch .bot{margin-top:auto;display:flex;align-items:center;gap:10px;border-top:1.5px solid var(--line);padding-top:9px}
  .ch .bot .t{background:#111;color:var(--yellow);border-radius:8px;padding:5px 13px;font-size:15px;font-weight:900}
  .ch .bot .r{font-size:12px;color:var(--muted);font-weight:600;line-height:1.35}
  .ch .bot .l{margin-inline-start:auto;font-size:11px;font-weight:800;color:var(--muted)}

  /* קלף אליאס — 6 מילים, 4 בעמוד */
  .esheet{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8mm}
  .ec{border:2.5px dashed #b9b3c0;border-radius:6mm;padding:9mm 9mm;display:flex;flex-direction:column}
  .ec .h{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--yellow);padding-bottom:6px;margin-bottom:8px}
  .ec .h img{height:18px}
  .ec .h .t{font-size:13px;font-weight:900}
  .ec .h .n{margin-inline-start:auto;font-size:10.5px;font-weight:800;color:var(--muted)}
  .ec ol{margin:0;padding-inline-start:18px}
  .ec li{font-size:16px;font-weight:800;margin-bottom:7px;line-height:1.25}
  .ec .f{margin-top:auto;font-size:9.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:5px}

  @media print{
    body{background:#fff}
    .bar{display:none}
    .sheet{width:auto;min-height:0;margin:0;padding:8mm;box-shadow:none;page-break-after:always;height:281mm}
    .sheet:last-child{page-break-after:auto}
    @page{size:A4;margin:0}
  }
</style>
</head>
<body>

<div class="bar">
  <h1>קלפי המשחק</h1>
  <small>21.10 · לגזור לפני המפגש</small>
  <span class="sp"></span>
  <button class="g on" id="bt-ch">🎴 קלפי אתגר</button>
  <button class="g" id="bt-el">🗣️ קלפי אליאס</button>
  <select id="chSel"></select>
  <button onclick="window.print()">🖨️ הדפסה</button>
</div>

<div id="out"></div>

<script src="elias-data.js"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var qs=new URLSearchParams(location.search);
var mode=qs.get('m')||'ch';
var only=qs.get('p')||'';

var sel=document.getElementById('chSel');
sel.innerHTML='<option value="">כל השולחנות (32 קלפים)</option>'+
  CHAPTERS.map(function(c){return '<option value="'+c.key+'"'+(c.key===only?' selected':'')+'>שולחן '+c.n+' · '+esc(c.t)+'</option>'}).join('');
sel.onchange=function(){go(mode,this.value)};
function go(m,p){location.search='?m='+m+(p?'&p='+p:'')}
document.getElementById('bt-ch').onclick=function(){go('ch',only)};
document.getElementById('bt-el').onclick=function(){go('el','')};
document.getElementById('bt-ch').classList.toggle('on',mode==='ch');
document.getElementById('bt-el').classList.toggle('on',mode==='el');
sel.style.display=mode==='ch'?'':'none';

var out=document.getElementById('out'),H='';

if(mode==='el'){
  /* קלפי אליאס — 6 מילים לקלף, 4 קלפים לעמוד */
  var per=6,cards=[];
  for(var i=0;i<ELIAS_WORDS.length;i+=per)cards.push(ELIAS_WORDS.slice(i,i+per));
  for(var s=0;s<cards.length;s+=4){
    H+='<div class="sheet"><div class="esheet">';
    for(var j=s;j<Math.min(s+4,cards.length);j++){
      H+='<div class="ec"><div class="h"><img src="hopa-logo.png" alt=""><span class="t">אליאס · ליווי בוגרים</span>'+
        '<span class="n">קלף '+(j+1)+'</span></div><ol>'+
        cards[j].map(function(w){return '<li>'+esc(w)+'</li>'}).join('')+
        '</ol><div class="f">מסבירים בלי להגיד את המילה · 60 שניות · כל ניחוש נכון = נקודה</div></div>';
    }
    /* השלמה לריבוע */
    for(var k=Math.min(s+4,cards.length);k<s+4;k++)H+='<div></div>';
    H+='</div></div>';
  }
}else{
  /* קלפי אתגר — 2 בעמוד */
  var list=[];
  CHAPTERS.forEach(function(c){
    if(only&&c.key!==only)return;
    (CARDS[c.key]||[]).forEach(function(q,i){list.push({c:c,q:q,i:i})});
  });
  for(var a=0;a<list.length;a+=2){
    H+='<div class="sheet">';
    for(var b=a;b<Math.min(a+2,list.length);b++){
      var x=list[b];
      H+='<div class="ch" style="border-color:'+x.c.c+'">'+
        '<div class="top"><img src="hopa-logo.png" alt="">'+
          '<span class="pill" style="background:'+x.c.c+'">שולחן '+x.c.n+' · '+esc(x.c.t)+'</span>'+
          '<span class="rn">סבב '+(x.i+1)+' מתוך 4</span></div>'+
        '<div class="q">'+esc(x.q)+'</div>'+
        '<div class="bot"><span class="t">90 שניות</span>'+
          '<span class="r">זורקים כמה שיותר רעיונות · הרשם/ת כותב/ת הכול<br>כל רעיון = נקודה · <b>לא פוסלים כלום</b></span>'+
          '<span class="l">אליאס הפוך</span></div>'+
      '</div>';
    }
    H+='</div>';
  }
}
out.innerHTML=H||'<div class="sheet"><p>אין קלפים להצגה.</p></div>';
</script>
</body>
</html>
