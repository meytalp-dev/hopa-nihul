<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שאלון לצוות: מכינות קדם-צבאיות | הופה · אחד משלנו</title>
<meta property="og:title" content="שאלון קצר לצוות: מה דעתך על מכינות קדם-צבאיות?">
<meta property="og:description" content="עמותת הופה ומכינת אחד משלנו · כ-5 דקות">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* אחד משלנו: זית #635F2F, חאקי #A4A080, שמנת #D8D7CB · הופה: ורוד #E8348A, צהוב #FFF200 */
:root{--pink:#E8348A;--yellow:#FFF200;--olive:#635F2F;--khaki:#A4A080;--olive-soft:#eeede3;--ink:#2a2915;--muted:#6f6c55;--line:#e4e2d3;--bg:#f7f6f0;--card:#fff;--red:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:Rubik,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 60px}
.stripe{display:flex;height:5px}.stripe i{flex:1}
header.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:20px}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-bottom:0}
header.top img{height:40px;display:block}
header.top .x{color:var(--khaki);font-weight:700}
h1{font-size:clamp(22px,5vw,30px);margin:0 0 8px;font-weight:800;line-height:1.25}
.lead{color:var(--muted);margin:0 0 6px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.meta span{font-size:13px;background:var(--olive-soft);color:var(--olive);border-radius:999px;padding:3px 12px}
.prog{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;margin:14px 0 4px}
.prog .t{font-size:13px;color:var(--muted);margin-bottom:5px}
.prog .b{height:7px;background:#e7e5d6;border-radius:999px;overflow:hidden}
.prog .b i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--olive),var(--khaki));transition:width .25s}
.sec-title{font-size:18px;font-weight:700;margin:26px 0 10px;color:var(--olive);border-inline-start:4px solid var(--khaki);padding-inline-start:10px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;transition:border-color .2s}
.qcard.miss{border-color:var(--red);box-shadow:0 0 0 2px #f6d5d1}
.qt{font-weight:500;margin-bottom:10px}
.req{color:var(--pink)}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.likert button{font:inherit;font-size:12px;line-height:1.3;border:1px solid #d9d7c6;background:#fff;border-radius:10px;padding:8px 4px;cursor:pointer;min-height:52px;color:var(--ink)}
.likert button b{display:block;font-size:16px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{font:inherit;font-size:14px;border:1px solid #d9d7c6;background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--ink)}
.likert button.on,.choices button.on{background:var(--olive);border-color:var(--olive);color:#fff}
textarea,.field{width:100%;font:inherit;border:1px solid #d9d7c6;border-radius:10px;padding:10px 11px;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;color:var(--ink)}
.send{display:block;width:100%;margin-top:22px;font:inherit;font-size:18px;font-weight:700;background:var(--pink);color:#fff;border:0;border-radius:14px;padding:15px;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.send:disabled{opacity:.6;cursor:default}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--red);font-size:14px;margin-top:10px;text-align:center}
.done{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 20px;text-align:center;margin-top:10px}
.done .big{font-size:48px;line-height:1}
.done h2{margin:10px 0 6px;font-size:24px}
.loading{text-align:center;color:var(--muted);padding:40px 0}
footer{text-align:center;font-size:13px;color:var(--muted);margin-top:40px}
footer a{color:var(--pink)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
@media (max-width:560px){
  .likert{grid-template-columns:1fr}
  .likert button{display:flex;align-items:center;gap:10px;min-height:0;text-align:start;padding:10px 12px;font-size:14px}
  .likert button b{font-size:15px}
}
</style>
</head>
<body>
<div class="stripe"><i style="background:#635F2F"></i><i style="background:#A4A080"></i><i style="background:#FFF200"></i><i style="background:#E8348A"></i></div>
<header class="top"><div class="wrap">
  <a href="https://hopa.org.il" target="_blank" rel="noopener"><img src="hopa-logo.png" alt="עמותת הופה"></a>
  <span class="x">×</span>
  <img src="one-of-us-logo.png" alt="מכינת אחד משלנו">
</div></header>

<div class="wrap">
  <div id="intro">
    <h1>מה דעתך על מכינות קדם-צבאיות?</h1>
    <p class="lead">עמותת הופה ומכינת "אחד משלנו" רוצות להבין איך הצוות בבית הספר רואה את המכינות, ומה יעזור לקדם את הנושא.
    אין תשובות נכונות או לא נכונות. לא נשאל את שמך.</p>
    <div class="meta"><span>כ-5 דקות</span><span id="qCount"></span><span>רוב השאלות בלחיצה</span></div>
  </div>
  <div id="app"><div class="loading">טוען את השאלון…</div></div>
  <footer>עמותת הופה · <a href="https://hopa.org.il" target="_blank" rel="noopener">hopa.org.il</a> · מכינת "אחד משלנו"</footer>
</div>
<div id="toast" class="toast"></div>

<script src="mechinot-q.js"></script>
<script>
const DRAFT_KEY = 'mechinot_tofes_draft';
const LS = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};
let DATA = null, ANS = {}, SENDING = false;
try{ ANS = JSON.parse(LS.get(DRAFT_KEY)||'{}') || {}; }catch(e){ ANS = {}; }
const app = document.getElementById('app');
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}
const allQ = () => DATA.sections.flatMap(s=>s.questions);
const answered = q => { const a=ANS[q.id];
  if(q.type==='text') return !!String(a||'').trim();
  if(q.type==='multi') return Array.isArray(a) && a.length>0;
  if(a==null || a==='') return false;
  if(q.type==='select' && isOther(q.options[a])) return !!String(ANS[q.id+'_o']||'').trim();
  return true; };

function onAns(){
  LS.set(DRAFT_KEY, JSON.stringify(ANS));
  const qs=allQ(), done=qs.filter(answered).length;
  document.getElementById('pt').textContent = `ענית על ${done} מתוך ${qs.length}`;
  document.getElementById('pb').style.width = Math.round(done/qs.length*100)+'%';
}
function render(){
  let n=0, h=`<div class="prog"><div class="t" id="pt"></div><div class="b"><i id="pb"></i></div></div>`;
  DATA.sections.forEach(s=>{
    if(!s.questions.length) return;
    h += `<div class="sec-title">${esc(s.title)}</div>`;
    s.questions.forEach(q=>{ h += qHTML(q, ++n); });
  });
  h += `<button class="send" id="sendBtn" onclick="submit()">שליחה</button><div class="err" id="err"></div>`;
  const y = window.scrollY; app.innerHTML = h; window.scrollTo(0, y);
  document.getElementById('qCount').textContent = n+' שאלות';
  onAns();
}
function pick(qid, i){
  const q = allQ().find(x=>x.id===qid);
  if(q.type==='multi'){
    const cur=ANS[qid]||[]; const k=cur.indexOf(i);
    if(k>-1) cur.splice(k,1); else { if(q.max && cur.length>=q.max){ toast('אפשר לבחור עד '+q.max+' — בטלו בחירה אחרת קודם'); return; } cur.push(i); }
    ANS[qid]=cur;
  } else ANS[qid]=i;
  const c = document.getElementById('qc_'+qid); if(c) c.classList.remove('miss');
  render();
}

// התשובה כטקסט קריא (לדף המעקב ולייצוא) — סולם הסכמה נשמר כמספר 1–5
function answerValue(q){
  const a=ANS[q.id], o=String(ANS[q.id+'_o']||'').trim();
  const withOther = op => isOther(op) && o ? 'אחר: '+o : op;
  if(q.type==='text') return String(a||'').trim();
  if(q.type==='likert') return a==null ? '' : a+1;
  if(q.type==='multi') return (a||[]).map(i=>withOther(q.options[i]));
  return a==null||a==='' ? '' : withOther(q.options[a]);
}
async function submit(){
  if(SENDING) return;
  const err=document.getElementById('err'); err.textContent='';
  const missing = allQ().filter(q=>q.required && !answered(q));
  document.querySelectorAll('.qcard.miss').forEach(c=>c.classList.remove('miss'));
  if(missing.length){
    missing.forEach(q=>{ const c=document.getElementById('qc_'+q.id); if(c) c.classList.add('miss'); });
    const first=document.getElementById('qc_'+missing[0].id);
    if(first) first.scrollIntoView({behavior:'smooth', block:'center'});
    err.textContent = missing.length===1 ? 'נשארה שאלה אחת בלי תשובה (מסומנת באדום)' : `נשארו ${missing.length} שאלות בלי תשובה (מסומנות באדום)`;
    return;
  }
  SENDING=true; const btn=document.getElementById('sendBtn'); btn.disabled=true; btn.textContent='שולח…';
  const qs=allQ(), school=qs.find(q=>q.type==='select'), role=qs.find(q=>/תפקיד/.test(q.text));
  const payload = {
    v:1, ts:new Date().toISOString(),
    school: school ? answerValue(school) : '',
    role: role ? [].concat(answerValue(role)).join(', ') : '',
    a: {}                                  // מזהה שאלה → תשובה (נוסח השאלות נלקח מהשאלון בדף המעקב)
  };
  qs.forEach(q=>{ const v=answerValue(q); if(v!=='' && !(Array.isArray(v)&&!v.length)) payload.a[q.id]=v; });
  const params = {action:'intakeSubmit', school:RESP_PREFIX+Date.now().toString(36)+Math.random().toString(36).slice(2,6), json:JSON.stringify(payload)};
  try{
    if(new URLSearchParams(params).toString().length>6500) throw new Error('too-long');
    const r = await jsonp(params, ()=>{ btn.textContent='גוגל מתעכב — מנסה שוב…'; });
    if(!r || !r.ok) throw new Error((r&&r.error)||'err');
  }catch(e){
    // מוצא אחרון: שליחה בפוסט — עדיף מלאבד את התשובות
    try{
      await fetch(EXEC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(params).toString()});
    }catch(e2){
      SENDING=false; btn.disabled=false; btn.textContent='שליחה';
      err.textContent='השליחה לא הצליחה. בדקו שיש אינטרנט ולחצו שוב — התשובות שמורות.'; return;
    }
  }
  LS.del(DRAFT_KEY); LS.set('mechinot_tofes_sent', payload.ts);
  showDone();
}
function showDone(){
  document.getElementById('intro').style.display='none';
  app.innerHTML = `<div class="done"><div class="big">🙏</div><h2>תודה רבה!</h2>
    <p>התשובות שלך נשמרו. הן יעזרו לנו לבנות יחד עם בית הספר דרך נכונה לקדם את נושא המכינות.</p>
    <p class="hint">רוצים שעוד מישהו מהצוות ימלא מהמכשיר הזה?</p>
    <button class="btn" onclick="again()">מילוי חדש</button></div>`;
  window.scrollTo({top:0});
}
function again(){ ANS={}; SENDING=false; LS.del('mechinot_tofes_sent'); document.getElementById('intro').style.display=''; render(); window.scrollTo({top:0}); }

(async()=>{
  try{ DATA = await loadQuestions(); }catch(e){ DATA = JSON.parse(JSON.stringify(DEFAULT)); }
  if(LS.get('mechinot_tofes_sent') && !Object.keys(ANS).length){ render(); showDone(); return; }
  render();
})();
</script>
</body>
</html>
