<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שאלון מיפוי עמדות צוות — מכינות | הופה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* אחד משלנו: זית #635F2F, חאקי #A4A080, שמנת #D8D7CB · הופה: ורוד #E8348A, צהוב #FFF200 */
:root{--pink:#E8348A;--pink-soft:#fde7f2;--yellow:#FFF200;--olive:#635F2F;--khaki:#A4A080;--cream:#D8D7CB;--olive-soft:#eeede3;--ink:#2a2915;--muted:#6f6c55;--line:#e4e2d3;--bg:#f7f6f0;--card:#fff;--green:#4f7a2a}
*{box-sizing:border-box}
body{margin:0;font-family:Rubik,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 80px}
.stripe{display:flex;height:5px}.stripe i{flex:1}
header.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:20px}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-bottom:0}
header.top img{height:40px;display:block}
header.top .x{color:var(--khaki);font-weight:700}
header.top .h{font-size:13px;color:var(--muted);margin-inline-start:auto}
@media (max-width:480px){header.top .h{display:none}}
h1{font-size:clamp(22px,4.5vw,30px);margin:0 0 6px;font-weight:800}
.lead{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line);margin-bottom:16px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;font:inherit;padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--pink);color:#fff;font-weight:500}
.status{font-size:13px;color:var(--muted);margin-inline-start:auto}
.status.ok{color:var(--green)}
.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:500}
.btn.ghost{border-style:dashed;color:var(--pink);border-color:#f3b3d2;width:100%;justify-content:center;padding:10px}
.btn:disabled{opacity:.5;cursor:default}
.icon{width:34px;height:34px;padding:0;justify-content:center;border-radius:9px}
.icon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon.del{color:#c0392b}
.sec{margin-top:26px}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec-head input{flex:1;font:inherit;font-size:19px;font-weight:700;border:1px solid transparent;background:none;padding:4px 6px;border-radius:8px;min-width:0}
.sec-head input:hover,.sec-head input:focus{border-color:var(--line);background:#fff;outline:none}
.sec-num{background:var(--olive);color:#F3F1E6;font-weight:800;border-radius:8px;padding:2px 9px;box-shadow:inset 0 -3px 0 var(--yellow)}
.q{display:flex;gap:10px;align-items:flex-start}
.q .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--olive-soft);color:var(--olive);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.q .body{flex:1;min-width:0}
.q .txt{font-weight:500}
.tag{display:inline-block;font-size:12px;background:#f1f0f6;color:var(--muted);border-radius:6px;padding:1px 8px;margin-top:6px}
.opts{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.opts li{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:#444}
.note{margin-top:8px;font-size:13px;background:#fffbe0;border-radius:8px;padding:6px 10px}
.tools{display:flex;gap:4px;flex:none}
.edit label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.edit textarea,.edit select,.edit input[type=text],.field{width:100%;font:inherit;border:1px solid #dcdce6;border-radius:10px;padding:9px 11px;background:#fff}
.edit textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted)}
/* תצוגת טופס */
.pv .qcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.pv .qt{font-weight:500;margin-bottom:10px}
.pv .req{color:var(--pink)}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.likert button{font:inherit;font-size:12px;line-height:1.3;border:1px solid #dcdce6;background:#fff;border-radius:10px;padding:8px 4px;cursor:pointer;min-height:52px}
.likert button b{display:block;font-size:16px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{font:inherit;font-size:14px;border:1px solid #dcdce6;background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer}
.likert button.on,.choices button.on{background:var(--olive);border-color:var(--olive);color:#fff}
.pv textarea{width:100%;font:inherit;border:1px solid #dcdce6;border-radius:10px;padding:10px;min-height:80px}
.pv .sec-title{font-size:18px;font-weight:700;margin:22px 0 10px;color:var(--olive);border-inline-start:4px solid var(--khaki);padding-inline-start:10px}
.tag{background:var(--olive-soft)}
.opts li{border-color:var(--line)}
.likert button,.choices button,.edit textarea,.edit select,.edit input[type=text],.field{border-color:#d9d7c6}
footer{text-align:center;font-size:13px;color:var(--muted);margin-top:40px}
footer a{color:var(--pink)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
@media (max-width:560px){
  .likert{grid-template-columns:1fr}
  .likert button{display:flex;align-items:center;gap:10px;min-height:0;text-align:start;padding:10px 12px;font-size:14px}
  .likert button b{font-size:15px}
  .q{flex-wrap:wrap}
  .tools{width:100%;justify-content:flex-end}
  .status{width:100%;margin:0}
}
</style>
</head>
<body>
<div class="stripe"><i style="background:#635F2F"></i><i style="background:#A4A080"></i><i style="background:#FFF200"></i><i style="background:#E8348A"></i></div>
<header class="top"><div class="wrap">
  <a href="https://hopa.org.il" target="_blank" rel="noopener"><img src="hopa-logo.png" alt="עמותת הופה"></a>
  <span class="x">×</span>
  <img src="one-of-us-logo.png" alt="מכינת אחד משלנו">
  <div class="h">עמותת הופה · מכינת "אחד משלנו"</div>
</div></header>

<div class="wrap">
  <h1>שאלון מיפוי עמדות צוות כלפי מכינות</h1>
  <p class="lead">טיוטה לעבודה משותפת. אפשר לערוך כל שאלה, למחוק, להוסיף ולשנות את הסדר. כל שינוי נשמר אוטומטית ומופיע אצל כולם.
  ב"תצוגת טופס" רואים את השאלון כמו שהצוות ימלא אותו.</p>

  <div class="card">
    <label class="hint" for="who">השם שלך (כדי שנדע מי ערך)</label>
    <input id="who" class="field" type="text" placeholder="למשל: נועה — אחד משלנו">
  </div>

  <div class="bar">
    <div class="seg" role="tablist">
      <button id="mEdit" class="on" onclick="setMode('edit')">עריכה</button>
      <button id="mPrev" onclick="setMode('preview')">תצוגת טופס</button>
    </div>
    <button class="btn" onclick="load()" title="לטעון את הגרסה העדכנית">רענון</button>
    <span id="status" class="status">טוען…</span>
  </div>

  <div id="app"></div>

  <div id="genWrap" class="card" style="margin-top:28px">
    <label class="hint" for="gen">הערות כלליות על השאלון</label>
    <textarea id="gen" class="field" rows="3" placeholder="מה חסר, מה מיותר, רעיונות לשאלות נוספות…"></textarea>
    <div class="actions"><button class="btn primary" onclick="saveGeneral()">שמירת ההערה</button></div>
  </div>

  <footer>עמותת הופה · <a href="https://hopa.org.il" target="_blank" rel="noopener">hopa.org.il</a></footer>
</div>
<div id="toast" class="toast"></div>

<script src="mechinot-q.js"></script>
<script>
let DATA = JSON.parse(JSON.stringify(DEFAULT));
let MODE = 'edit', EDITING = null, ANS = {};
const app = document.getElementById('app');
const LS = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
const ICON = {
  edit:'<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  up:'<svg viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  del:'<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>'
};

/* ---------- גיליון ---------- */
function setStatus(t, ok){ const s=document.getElementById('status'); s.textContent=t; s.className='status'+(ok?' ok':''); }
function fmt(iso){ if(!iso) return ''; const d=new Date(iso); return d.toLocaleDateString('he-IL',{day:'numeric',month:'numeric'})+' '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}); }
function lastLine(){ return DATA.updatedAt ? `עודכן ${fmt(DATA.updatedAt)}${DATA.updatedBy?' · '+DATA.updatedBy:''}` : 'טיוטה ראשונה — עוד לא נערכה'; }

/* קוד עריכה — מוקלד פעם אחת בכל מכשיר. בלי קוד אפשר לצפות, אבל לא לשמור. */
let EDIT_CODE = LS.get('mechinot_edit_code') || '', codeOk = false;
async function ensureCode(){
  if (codeOk && EDIT_CODE) return true;
  for (let i=0; i<2; i++){
    if (!EDIT_CODE) EDIT_CODE = (prompt('קוד עריכה לשאלון (קיבלתם אותו מצוות הופה):')||'').trim();
    if (!EDIT_CODE) return false;
    try{
      const r = await jsonp({action:'checkCode', secret:EDIT_CODE});
      if (r && r.ok && (r.staff || (r.keys||[]).includes(STORE_KEY))){ codeOk = true; LS.set('mechinot_edit_code', EDIT_CODE); return true; }
    }catch(e){ setStatus('לא הצלחתי לבדוק את הקוד — נסו שוב'); return false; }
    alert('קוד העריכה לא נכון.'); EDIT_CODE = ''; LS.set('mechinot_edit_code','');
  }
  return false;
}
let saveT;
function save(){
  DATA.updatedAt = new Date().toISOString();
  DATA.updatedBy = document.getElementById('who').value.trim();
  setStatus('שומר…');
  clearTimeout(saveT);
  saveT = setTimeout(async()=>{
    if (!(await ensureCode())){ setStatus('לא נשמר — צריך קוד עריכה. השינוי יישמר בעריכה הבאה.'); return; }
    try{
      await fetch(EXEC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:new URLSearchParams({action:'storeSet',secret:EDIT_CODE,key:STORE_KEY,json:JSON.stringify(DATA)}).toString()});
      setStatus('נשמר ✓ · '+lastLine(), true);
    }catch(e){ setStatus('שגיאה בשמירה — בדקו אינטרנט ונסו שוב'); toast('השמירה נכשלה'); }
  }, 300);
}
async function load(){
  setStatus('טוען מהגיליון…');
  try{
    const r = await jsonp({action:'storeAll'}, i=>setStatus(`גוגל מתעכב — מנסה שוב (${i}/4)…`));
    if(!r.ok) throw new Error(r.error||'err');
    const st = (r.store||{})[STORE_KEY];
    if (st && Array.isArray(st.sections)) DATA = st;
    setStatus(lastLine(), true);
  }catch(e){ setStatus('לא הצלחתי לטעון מהגיליון — מוצגת הטיוטה הראשונה. לחצו "רענון".'); }
  EDITING = null;
  document.getElementById('gen').value = DATA.general || '';
  render();
}

/* ---------- עריכה ---------- */
function find(qid){ for(const s of DATA.sections){ const i=s.questions.findIndex(q=>q.id===qid); if(i>-1) return {s,i,q:s.questions[i]}; } return null; }
function move(qid, d){
  const f=find(qid); const j=f.i+d;
  if(j<0||j>=f.s.questions.length) return;
  [f.s.questions[f.i], f.s.questions[j]] = [f.s.questions[j], f.s.questions[f.i]];
  save(); render();
}
function delQ(qid){
  const f=find(qid);
  if(!confirm('למחוק את השאלה?\n\n'+f.q.text)) return;
  f.s.questions.splice(f.i,1); save(); render(); toast('השאלה נמחקה');
}
function addQ(sid){
  const s=DATA.sections.find(x=>x.id===sid);
  const q = L(''); q._new = true; s.questions.push(q);
  EDITING = q.id; render();
  setTimeout(()=>{ const t=document.getElementById('e_text'); if(t){ t.focus(); t.scrollIntoView({block:'center'}); } }, 50);
}
function startEdit(qid){ cancelNew(); EDITING=qid; render(); }
function cancelNew(){ if(!EDITING) return; const f=find(EDITING); if(f && f.q._new) f.s.questions.splice(f.i,1); }
function cancelEdit(){ cancelNew(); EDITING=null; render(); }
function typeChanged(){
  const t=document.getElementById('e_type').value, o=document.getElementById('e_opts');
  document.getElementById('e_optsWrap').style.display = t==='text'?'none':'';
  document.getElementById('e_maxWrap').style.display = t==='multi'?'':'none';
  if(t==='likert') o.value = LIKERT.join('\n');
  else if(o.value.trim()===LIKERT.join('\n')) o.value='';
}
function commitEdit(){
  const f=find(EDITING); const q=f.q;
  const text=document.getElementById('e_text').value.trim();
  if(!text){ toast('צריך לכתוב את השאלה'); return; }
  const type=document.getElementById('e_type').value;
  const opts=document.getElementById('e_opts').value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(type!=='text' && opts.length<2){ toast('צריך לפחות 2 אפשרויות, כל אחת בשורה'); return; }
  q.text=text; q.type=type; q.options = type==='text'?[]:opts;
  q.max = type==='multi' ? (+document.getElementById('e_max').value||0) : 0;
  q.required = document.getElementById('e_req').checked;
  q.note = document.getElementById('e_note').value.trim();
  delete q._new; EDITING=null; save(); render(); toast('השאלה נשמרה');
}
function renameSec(sid, v){ const s=DATA.sections.find(x=>x.id===sid); v=v.trim(); if(v && v!==s.title){ s.title=v; save(); } }
function addSection(){
  const t = prompt('שם הנושא החדש:'); if(!t||!t.trim()) return;
  DATA.sections.push({id:'s'+Date.now().toString(36), title:t.trim(), questions:[]}); save(); render();
}
function delSection(sid){
  const s=DATA.sections.find(x=>x.id===sid);
  if(s.questions.length){ toast('אפשר למחוק רק נושא ריק — קודם מוחקים את השאלות שבו'); return; }
  DATA.sections = DATA.sections.filter(x=>x.id!==sid); save(); render();
}
function saveGeneral(){ DATA.general=document.getElementById('gen').value.trim(); save(); toast('ההערה נשמרה'); }

function editForm(q){
  return `<div class="edit">
    <label for="e_text">נוסח השאלה</label>
    <textarea id="e_text">${esc(q.text)}</textarea>
    <div class="row">
      <div><label for="e_type">סוג</label>
        <select id="e_type" onchange="typeChanged()">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}"${q.type===k?' selected':''}>${v}</option>`).join('')}</select></div>
      <div id="e_maxWrap" style="${q.type==='multi'?'':'display:none'}"><label for="e_max">כמה אפשר לסמן</label>
        <select id="e_max">${[0,2,3,4,5].map(n=>`<option value="${n}"${(q.max||0)===n?' selected':''}>${n?'עד '+n:'ללא הגבלה'}</option>`).join('')}</select></div>
    </div>
    <div id="e_optsWrap" style="${q.type==='text'?'display:none':''}">
      <label for="e_opts">אפשרויות תשובה — כל אפשרות בשורה נפרדת</label>
      <textarea id="e_opts" rows="${Math.max(4,(q.options||[]).length+1)}">${esc((q.options||[]).join('\n'))}</textarea>
    </div>
    <label style="display:flex;align-items:center;gap:8px;color:var(--ink)"><input type="checkbox" id="e_req"${q.required?' checked':''}> שאלת חובה</label>
    <label for="e_note">הערה לעבודה המשותפת (לא תופיע למי שממלא)</label>
    <input type="text" id="e_note" value="${esc(q.note||'')}" placeholder="למשל: לשקול לנסח אחרת">
    <div class="actions"><button class="btn primary" onclick="commitEdit()">שמירה</button><button class="btn" onclick="cancelEdit()">ביטול</button></div>
  </div>`;
}

function render(){
  document.getElementById('genWrap').style.display = MODE==='edit'?'':'none';
  if(MODE==='preview') return renderPreview();
  let n=0, h='';
  DATA.sections.forEach((s,si)=>{
    h += `<div class="sec"><div class="sec-head"><span class="sec-num">${si+1}</span>
      <input value="${esc(s.title)}" aria-label="שם הנושא" onchange="renameSec('${s.id}',this.value)">
      ${s.questions.length?'':`<button class="btn icon del" title="מחיקת נושא" onclick="delSection('${s.id}')">${ICON.del}</button>`}</div>`;
    s.questions.forEach((q,qi)=>{
      n++;
      if(EDITING===q.id){ h += `<div class="card">${editForm(q)}</div>`; return; }
      const opts = q.type==='likert' ? '<span class="tag">'+TYPES.likert+(q.dk?' + "'+DK_TEXT+'"':'')+'</span>'
        : `<span class="tag">${TYPES[q.type]}${q.type==='multi'&&q.max?' · עד '+q.max:''}${q.required?'':' · לא חובה'}</span>` +
          (q.type==='select' ? `<div class="hint" style="margin-top:6px">${q.options.length} אפשרויות ברשימה</div>`
            : q.options.length?`<ul class="opts">${q.options.map(o=>`<li>${esc(o)}</li>`).join('')}</ul>`:'');
      h += `<div class="card"><div class="q"><span class="n">${n}</span><div class="body">
        <div class="txt">${esc(q.text)}</div>${opts}${q.note?`<div class="note">${esc(q.note)}</div>`:''}</div>
        <div class="tools">
          <button class="btn icon" title="עריכה" onclick="startEdit('${q.id}')">${ICON.edit}</button>
          <button class="btn icon" title="למעלה" onclick="move('${q.id}',-1)"${qi===0?' disabled':''}>${ICON.up}</button>
          <button class="btn icon" title="למטה" onclick="move('${q.id}',1)"${qi===s.questions.length-1?' disabled':''}>${ICON.down}</button>
          <button class="btn icon del" title="מחיקה" onclick="delQ('${q.id}')">${ICON.del}</button>
        </div></div></div>`;
    });
    h += `<button class="btn ghost" onclick="addQ('${s.id}')">+ הוספת שאלה לנושא הזה</button></div>`;
  });
  h += `<div class="sec"><button class="btn ghost" onclick="addSection()">+ נושא חדש</button></div>`;
  h += `<p class="hint" style="margin-top:16px">${n} שאלות · ${countOpen()} פתוחות</p>`;
  app.innerHTML = h;
}
function countOpen(){ return DATA.sections.reduce((a,s)=>a+s.questions.filter(q=>q.type==='text').length,0); }

/* ---------- תצוגת טופס ---------- */
function renderPreview(){
  let n=0, h='<p class="hint">כך הצוות יראה את השאלון. אפשר ללחוץ ולנסות. התשובות כאן לא נשמרות.</p><div class="pv">';
  DATA.sections.forEach(s=>{
    if(!s.questions.length) return;
    h += `<div class="sec-title">${esc(s.title)}</div>`;
    s.questions.forEach(q=>{ h += qHTML(q, ++n); });
  });
  app.innerHTML = h + '</div>';
}
function pick(qid,i){
  const q=find(qid).q;
  if(q.type==='multi'){
    const cur = togglePick(q, ANS[qid], i);
    if(!cur){ toast('אפשר לבחור עד '+q.max); return; }
    ANS[qid]=cur;
  } else ANS[qid]=i;
  renderPreview();
}
function setMode(m){
  if(m==='preview') cancelNew();
  MODE=m; EDITING=null;
  document.getElementById('mEdit').classList.toggle('on', m==='edit');
  document.getElementById('mPrev').classList.toggle('on', m==='preview');
  render(); window.scrollTo({top:0});
}

const who=document.getElementById('who');
who.value = LS.get('mechinot_who')||'';
who.addEventListener('change', ()=>LS.set('mechinot_who', who.value.trim()));
render(); load();
</script>
