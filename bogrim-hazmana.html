<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>הזמנת בוגרים לקבוצה · הופה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#E8348A; --pink-dark:#c02673; --pink-soft:#fde7f2;
    --yellow:#FFF200; --yellow-soft:#fffbcc;
    --ink:#2b2b33; --muted:#8a8a95; --line:#ece7ef;
    --bg:#f6f2f7; --card:#ffffff;
    --ok:#22b573; --ok-soft:#e6f8ef; --warn:#b7791f; --warn-soft:#fff4dc; --wa:#25D366;
    --shadow:0 4px 18px rgba(43,43,51,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Rubik',system-ui,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;min-height:100dvh}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit;color:inherit;font-size:16px}
  .wrap{max-width:820px;margin:0 auto;padding:0 14px 60px}
  .hero{background:linear-gradient(125deg,var(--pink) 0%,var(--pink-dark) 100%);color:#fff;border-radius:0 0 26px 26px;padding:18px 18px 22px;box-shadow:var(--shadow)}
  .hero-in{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .logobox{background:#fff;border-radius:13px;padding:6px 12px;box-shadow:0 4px 14px rgba(0,0,0,.18);display:inline-flex;align-items:center;flex-shrink:0}
  .logobox img{height:34px;display:block;max-width:140px}
  .hero h1{margin:0;font-size:20px;font-weight:800;line-height:1.25}
  .hero p{margin:2px 0 0;opacity:.92;font-size:14px}
  .card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px;margin-top:14px}
  .card h2{margin:0 0 4px;font-size:17px;font-weight:700}
  .hint{color:var(--muted);font-size:13px;margin:0 0 10px}
  label.l{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
  .field{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;outline:none;transition:border .15s}
  .field:focus{border-color:var(--pink)}
  .field.ltr{direction:ltr;text-align:left}
  .field.missing{border-color:#f3b0cf;background:#fff8fb}
  textarea.field{min-height:300px;resize:vertical;line-height:1.55;unicode-bidi:plaintext}
  .btn{border-radius:12px;padding:10px 16px;font-size:15px;font-weight:700;transition:transform .1s;white-space:nowrap}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--pink);color:#fff;box-shadow:0 6px 18px rgba(232,52,138,.3)}
  .btn.outline{border:2px solid var(--line);background:#fff}
  .btn.wa{background:var(--wa);color:#fff;text-decoration:none;text-align:center}
  .btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
  details summary{cursor:pointer;color:var(--pink-dark);font-weight:600;font-size:14px;margin:8px 0 2px}
  .prev{white-space:pre-wrap;unicode-bidi:plaintext;background:#f7f5f9;border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:8px;font-size:13.5px;line-height:1.6}
  .tokens{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
  .tok{background:var(--bg);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--muted)}
  .tok b{color:var(--ink)}

  .today{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .meter{flex:1;min-width:160px;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
  .meter i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
  .meter.over i{background:#e0a020}
  .today b{font-size:22px}
  .warnbox{background:var(--warn-soft);color:#7a5210;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
  .tab{background:#fff;border:2px solid var(--line);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:600}
  .tab.on{background:var(--pink);border-color:var(--pink);color:#fff}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chip{background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:5px 11px;font-size:13px}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .search{margin-top:10px}

  .list{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .row{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .row.sent{background:#f6fbf8;box-shadow:none;border:1px solid #d7efe1}
  .who{flex:1;min-width:150px}
  .who .nm{font-weight:700;font-size:16px}
  .who .meta{font-size:13px;color:var(--muted)}
  .who .meta .ph{direction:ltr;unicode-bidi:isolate}
  .who .note{font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:2px 8px;display:inline-block;margin-top:3px}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .badge{font-size:12.5px;color:var(--ok);font-weight:700}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  .more{display:block;margin:12px auto 0}

  .lock{max-width:420px;margin:40px auto 0;text-align:center}
  .lock .field{text-align:center;direction:ltr;margin-top:10px}
  .err{color:#c0392b;font-size:14px;min-height:20px;margin-top:8px}

  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;transition:all .25s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:520px){
    .hero h1{font-size:17px}
    .logobox img{height:28px}
    .acts{width:100%}
    .acts .btn{flex:1}
  }
</style>
</head>

async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); return true; } catch(e) {}
  try { const ta=document.createElement('textarea'); ta.value=txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); ta.remove(); if(ok) return true; } catch(e) {}
  try { window.prompt('ההעתקה האוטומטית לא עבדה — להעתיק מכאן:', txt); } catch(e) {}
  return false;
}

/* ---------- פתיחת הנתונים (מוצפנים — בדף אין שמות או טלפונים גלויים) ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(BLOB.s), iterations:BLOB.it, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(BLOB.iv)}, key, b64(BLOB.d));
  return JSON.parse(new TextDecoder().decode(plain));
}
function renderLock(errMsg){
  app.innerHTML = `
    <div class="card lock">
      <h2>🔒 הדף מוגן</h2>
      <p class="hint">יש כאן שמות וטלפונים של בוגרים, ולכן צריך סיסמה. את הסיסמה מקבלים ממיטל.</p>
      <input class="field" id="pw" type="password" autocomplete="current-password" placeholder="סיסמה" dir="ltr">
      <div class="err" id="err">${esc(errMsg||'')}</div>
      <button class="btn primary" id="go" style="width:100%;margin-top:6px">כניסה</button>
    </div>`;
  const go = async () => {
    const pw = document.getElementById('pw').value.trim();
    if(!pw) return;
    document.getElementById('go').disabled = true;
    try{ ROWS = await unlock(pw); LS.set('pw', pw); render(); }
    catch(e){ renderLock('הסיסמה לא נכונה'); }
  };
  document.getElementById('go').onclick = go;
  document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') go(); });
  document.getElementById('pw').focus();
}

function filtered(){
  let list = ROWS.filter(r => {
    const isSent = !!S.sent[r.i];
    if(S.tab==='send') return !r.r && !isSent;
    if(S.tab==='review') return r.r && !isSent;
    return isSent;
  });
  if(S.year!=='all') list = list.filter(r => r.y===S.year);
  if(S.q){ const q=S.q.replace(/\D/g,'') ; list = list.filter(r => r.n.includes(S.q) || (q && r.p.includes(q))); }
  const yi = y => { const i=YEAR_ORDER.indexOf(y); return i<0?99:i; };
  if(S.tab==='sent') list.sort((a,b)=>S.sent[b.i]-S.sent[a.i]);
  else list.sort((a,b)=> yi(a.y)-yi(b.y) || a.n.localeCompare(b.n,'he'));
  return list;
}

      ${today>=DAILY_LIMIT ? `<div class="warnbox">⚠️ הגעת ל-${DAILY_LIMIT} הודעות היום. כדי שוואטסאפ לא יחסום את המספר, כדאי לעצור ולהמשיך מחר.</div>` :
        `<p class="hint" style="margin:8px 0 0">וואטסאפ חוסם מספרים ששולחים הרבה הודעות דומות. עדיף לשלוח עד ${DAILY_LIMIT} ביום. נשארו ${nSend} בוגרים, כלומר בערך ${Math.ceil(nSend/DAILY_LIMIT)} ימים.</p>`}
      <p class="hint" style="margin:8px 0 0">לכל בוגר/ת: <b>📋 העתק</b> ← <b>💬 פתח צ'אט</b> ← מדביקים ושולחים. אחרי פתיחת הצ'אט השורה עוברת ל"נשלחו".</p>
    </section>

    <div class="tabs">
      <button class="tab ${S.tab==='send'?'on':''}" data-tab="send">לשלוח (${nSend})</button>
      <button class="tab ${S.tab==='review'?'on':''}" data-tab="review">לבדיקה (${nRev})</button>
      <button class="tab ${S.tab==='sent'?'on':''}" data-tab="sent">נשלחו (${nSent})</button>
    </div>
    ${S.tab==='review' ? `<div class="warnbox">ייתכן שהבוגרים האלה כבר בקבוצה בשם אחר. כדאי לבדוק לפני ששולחים.</div>` : ''}
    <div class="chips">
      <button class="chip ${S.year==='all'?'on':''}" data-year="all">כל המחזורים</button>
      ${years.map(y=>`<button class="chip ${S.year===y?'on':''}" data-year="${esc(y)}">${esc(y||'בלי מחזור')}</button>`).join('')}
    </div>
    <input class="field search" id="q" type="search" placeholder="🔍 חיפוש לפי שם או טלפון" value="${esc(S.q)}">
    <div class="list">
      ${list.length ? list.slice(0,S.shown).map(rowHtml).join('') : `<div class="empty">${S.tab==='sent'?'עוד לא נשלחו הודעות':'אין כאן אף אחד 🎉'}</div>`}
    </div>
    ${list.length>S.shown ? `<button class="btn outline more" id="more">הצגת עוד (${list.length-S.shown})</button>` : ''}
  `;
  bind();
  updatePreview();
}
function rowHtml(r){
  const sent = S.sent[r.i];
  return `<div class="row ${sent?'sent':''}" data-id="${esc(r.i)}">
    <div class="who">
      <div class="nm">${esc(r.n)}</div>
      <div class="meta">${esc(r.y||'בלי מחזור')} · <span class="ph">${esc(fmtPhone(r.p))}</span></div>
      ${r.t ? `<div class="note">${esc(r.t)}</div>` : ''}
    </div>
    <div class="acts">
      ${sent ? `<span class="badge">✓ נשלח</span><button class="btn sm outline" data-act="unsend">ביטול</button>` : ''}
      <button class="btn sm primary" data-act="copy">📋 העתק</button>
      <a class="btn sm wa" data-act="chat" href="https://wa.me/${waNum(r.p)}" target="_blank" rel="noopener">💬 פתח צ'אט</a>
    </div>
  </div>`;
}
function updatePreview(){
  const el = document.getElementById('prev'); if(!el) return;
  const sample = ROWS.find(r=>!r.r) || {n:'נועה'};
  el.textContent = msgFor(sample);
}
function bind(){
  const save = (k, el) => el.addEventListener('input', () => {
    S[k] = el.value; LS.set(k, el.value); el.classList.toggle('missing', !el.value.trim()); updatePreview();
  });
  save('link', document.getElementById('link'));
  save('signer', document.getElementById('signer'));
  save('msg', document.getElementById('msg'));
  document.getElementById('resetMsg').onclick = () => { S.msg = DEFAULT_MSG; LS.set('msg', DEFAULT_MSG); render(); toast('הנוסח חזר למקור'); };
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab=b.dataset.tab; S.shown=40; render(); });
  document.querySelectorAll('[data-year]').forEach(b => b.onclick = () => { S.year=b.dataset.year; S.shown=40; render(); });
  const q = document.getElementById('q');
  q.addEventListener('input', () => { S.q=q.value.trim(); S.shown=40; const pos=q.selectionStart; render(); const n=document.getElementById('q'); n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} });
  const more = document.getElementById('more'); if(more) more.onclick = () => { S.shown += 40; render(); };
  document.querySelectorAll('.row').forEach(row => {
    const r = ROWS.find(x => x.i===row.dataset.id);
    row.querySelector('[data-act="copy"]').onclick = async () => {
      if(!S.link.trim() || !S.signer.trim()){ toast('קודם ממלאים למעלה את הקישור לקבוצה ואת החתימה'); window.scrollTo({top:0,behavior:'smooth'}); return; }
      const ok = await copyText(msgFor(r));
      if(ok) toast('ההודעה ל' + firstName(r.n) + ' הועתקה ✓ עכשיו פותחים צ\'אט');
    };
    row.querySelector('[data-act="chat"]').addEventListener('click', e => {
      if(!S.link.trim() || !S.signer.trim()){ e.preventDefault(); toast('קודם ממלאים למעלה את הקישור לקבוצה ואת החתימה'); return; }
      S.sent[r.i] = Date.now(); LS.set('sent', S.sent);
      setTimeout(render, 400);
    });
    const un = row.querySelector('[data-act="unsend"]');
    if(un) un.onclick = () => { delete S.sent[r.i]; LS.set('sent', S.sent); render(); };
  });
}

/* כניסה אוטומטית אם הסיסמה כבר נשמרה במכשיר */
(async () => {
  const pw = LS.get('pw','');
  if(pw){ try{ ROWS = await unlock(pw); render(); return; }catch(e){} }
  renderLock();
})();
</script>
</body>
</html>
