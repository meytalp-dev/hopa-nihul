<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כרטיס כיס · שיחת בוגר · הופה</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--pink:#E8348A;--pink-dark:#c02673;--yellow:#FFF200;--ink:#1f1f26;--muted:#7d7d8a;--line:#e0dbe4}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{font-family:'Rubik',system-ui,Arial,sans-serif;background:#e9e5ec;color:var(--ink)}
  .bar{background:#111;color:#fff;padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .bar h1{margin:0;font-size:17px;font-weight:800}
  .bar small{opacity:.6;font-size:12.5px}
  .bar .sp{margin-inline-start:auto}
  .bar button{border:none;background:var(--yellow);color:#111;border-radius:10px;padding:9px 20px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}

  .sheet{width:210mm;min-height:297mm;background:#fff;margin:16px auto;padding:12mm;box-shadow:0 6px 30px rgba(0,0,0,.15);
    display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:min-content;gap:8mm}

  .card{border:2px dashed #c9c3cf;border-radius:5mm;padding:7mm 7mm;height:128mm;display:flex;flex-direction:column}
  .card .top{display:flex;align-items:center;gap:7px;border-bottom:2.5px solid var(--pink);padding-bottom:5px;margin-bottom:8px}
  .card .top img{height:22px}
  .card .top h2{margin:0;font-size:15px;font-weight:900;letter-spacing:-.2px}
  .card .top .s{margin-inline-start:auto;font-size:9.5px;font-weight:800;color:var(--pink-dark);background:#fde7f2;border-radius:999px;padding:2px 8px}

  .q{display:flex;gap:7px;margin-bottom:7px}
  .q .ic{font-size:15px;line-height:1.1;flex:none}
  .q b{display:block;font-size:12.5px;font-weight:900}
  .q span{display:block;font-size:10.5px;line-height:1.35;color:#4a4a55}

  .princ{background:#fffdf0;border:1.2px solid #f0e08a;border-radius:3mm;padding:5px 8px;margin-top:2px}
  .princ b{font-size:10px;font-weight:900;color:#8a7500;display:block;margin-bottom:2px}
  .princ ul{margin:0;padding-inline-start:14px;font-size:10px;line-height:1.4}

  .steps{display:flex;gap:3px;margin-top:7px}
  .steps div{flex:1;border-radius:2.5mm;padding:5px 3px;text-align:center;font-size:10px;font-weight:900}
  .steps div small{display:block;font-weight:500;font-size:8.5px;opacity:.7;margin-top:1px}
  .steps div:nth-child(1){background:#e8f8ef;color:#14613b}
  .steps div:nth-child(2){background:#fffdf0;color:#6b5300}
  .steps div:nth-child(3){background:#fff2f8;color:var(--pink-dark)}
  .steps div:nth-child(4){background:var(--pink);color:#fff}
  .steps div:nth-child(4) small{opacity:.85}

  .rule{font-size:10px;background:#f6f2f7;border-radius:2.5mm;padding:5px 8px;margin-top:6px;line-height:1.4}
  .rule b{color:var(--pink-dark)}
  .lim{font-size:9.5px;color:#a03030;background:#fff4f4;border:1.2px solid #f0cccc;border-radius:2.5mm;padding:5px 8px;margin-top:6px;line-height:1.35}
  .foot{margin-top:auto;padding-top:6px;border-top:1.2px solid var(--line);font-size:9px;color:var(--muted);display:flex;gap:6px}
  .foot b{color:var(--ink)}
  .foot .l{margin-inline-start:auto}

  @media print{
    body{background:#fff}
    .bar{display:none}
    .sheet{width:auto;min-height:0;margin:0;padding:8mm;box-shadow:none}
    .card{break-inside:avoid}
    @page{size:A4;margin:0}
  }
</style>
</head>
<body>

<div class="bar">
  <h1>כרטיס כיס · שיחת בוגר</h1>
  <small>4 בכל דף A4 · לגזור ולתת לכל רכז/ת</small>
  <span class="sp"></span>
  <button onclick="window.print()">🖨️ הדפסה</button>
</div>

<div class="sheet" id="sheet"></div>

<script>
var CARD=
'<div class="card">'+
  '<div class="top"><img src="hopa-logo.png" alt="הופה"><h2>שיחת בוגר</h2><span class="s">15 דקות</span></div>'+

  '<div class="q"><span class="ic">🧭</span><div><b>מסלול</b><span>איפה את/ה עכשיו — צבא / שירות / לימודים / עבודה? מה השלב הבא ומתי?</span></div></div>'+
  '<div class="q"><span class="ic">💰</span><div><b>כסף וזכויות</b><span>מלגות פתוחות, פיקדון, זכאויות שלא מומשו, חובות שמעיקים?</span></div></div>'+
  '<div class="q"><span class="ic">🏠</span><div><b>חיים</b><span>דיור, משפחה, איך את/ה מרגיש/ה באמת? מקשיבים גם למה שלא נאמר.</span></div></div>'+
  '<div class="q"><span class="ic">🔗</span><div><b>חיבור</b><span>למה אפשר לחבר אותך עכשיו — מענה, אירוע, בוגר/ת אחר/ת?</span></div></div>'+

  '<div class="princ"><b>שלושת העקרונות</b><ul>'+
    '<li>מתחילים מהתקוות, לא מהחששות</li>'+
    '<li>משקפים כוחות — שהבוגר ילמד על צדדים חזקים שלו</li>'+
    '<li>מדברים על <b>הפרק הבא</b>, לא על כל החיים</li>'+
  '</ul></div>'+

  '<div class="steps">'+
    '<div>יידוע<small>סיפרתי</small></div>'+
    '<div>תיווך<small>חיברתי</small></div>'+
    '<div>סנגור<small>נלחמתי</small></div>'+
    '<div>ליווי<small>עד שנפתר</small></div>'+
  '</div>'+

  '<div class="rule"><b>חיבור בלי מעקב לא נחשב.</b> בודקים שהקשר נוצר ושהצורך נענה — ואם לא, מחפשים מענה אחר. מסיימים ב״מה הצעד הבא שלך?״ + עדכון המאגר.</div>'+
  '<div class="lim"><b>גבולות:</b> לא מעבירים כסף אישי ולא מלווים כספית. במצוקה נפשית חריפה — התייעצות עם מטה הופה וחיבור לגורם טיפולי עוד באותו יום.</div>'+

  '<div class="foot"><span><b>מענים:</b> hopa.org.il</span><span class="l"><b>הופה</b> · תוכנית הבוגרים</span></div>'+
'</div>';
document.getElementById('sheet').innerHTML=CARD+CARD+CARD+CARD;
</script>
</body>
</html>
