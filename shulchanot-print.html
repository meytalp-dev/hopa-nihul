<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>דף המנחה · שולחנות הרעיונות · 21.10 · הופה</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--pink:#E8348A;--yellow:#FFF200;--ink:#1f1f26;--muted:#6d6d7a;--line:#d9d2dd}
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:'Rubik',system-ui,Arial,sans-serif;color:var(--ink);background:#eee;line-height:1.35}
  .bar{position:sticky;top:0;background:#111;color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5}
  .bar b{font-size:16px}
  .bar select,.bar button{font-family:inherit;font-size:15px;border-radius:10px;border:none;padding:8px 12px}
  .bar button{background:var(--yellow);font-weight:800;cursor:pointer}
  .page{width:210mm;min-height:297mm;margin:16px auto;background:#fff;padding:11mm 13mm;box-shadow:0 4px 20px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:7px}
  .top{display:flex;align-items:center;gap:12px;border-bottom:3px solid #111;padding-bottom:8px}
  .num{background:var(--pink);color:#fff;border-radius:16px;font-size:40px;font-weight:900;width:72px;height:72px;display:flex;align-items:center;justify-content:center;flex:none}
  .top h1{margin:0;font-size:25px;font-weight:900}
  .top .s{font-size:13px;color:var(--muted);font-weight:700;margin-top:2px}
  .top .qr{margin-inline-start:auto;text-align:center;font-size:10px;font-weight:700;color:var(--muted)}
  .top .qr div{width:76px;height:76px;margin-bottom:2px}
  .intro{background:#fffdf0;border-inline-start:6px solid var(--yellow);border-radius:0 12px 12px 0;padding:8px 12px}
  .intro b{font-size:16px}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  .chips span{border:1.5px solid var(--line);border-inline-start:5px solid var(--c);border-radius:8px;padding:1px 7px;font-size:11.5px;font-weight:700}
  .st{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;padding:7px 10px}
  .st i{font-style:normal;background:#111;color:var(--yellow);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:900;flex:none}
  .st .t{font-weight:800;font-size:15px}
  .st .t small{display:block;font-weight:500;color:var(--muted);font-size:12px}
  .st .fill{flex:1;border-bottom:1.5px dotted #999;height:20px;min-width:60px}
  .ok{margin-inline-start:auto;flex:none;font-size:13px;font-weight:800;white-space:nowrap}
  .ok:before{content:"";display:inline-block;width:15px;height:15px;border:2px solid #111;border-radius:4px;vertical-align:-3px;margin-inline-end:5px}
  .comp{border:2px solid #111;border-radius:12px;padding:7px 10px}
  .comp .h{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px}
  .comp .h .fill{flex:1;border-bottom:1.5px dotted #999;height:18px}
  .comp .row{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:13.5px;font-weight:700}
  .comp .row .t{flex:1}
  .comp .row .t small{font-weight:500;color:var(--muted)}
  .comp table{width:100%;border-collapse:collapse;margin-top:5px;font-size:11.5px}
  .scribe{display:flex;align-items:center;gap:12px;background:#e8f8ef;border:2px solid #b8e6c9;border-radius:12px;padding:7px 10px;font-size:14px}
  .scribe b{font-size:15px}.scribe span{display:block;font-size:12.5px;margin-top:2px}
  .scribe .qr2{text-align:center;font-size:10px;font-weight:700;color:var(--muted);flex:none}.scribe .qr2 div{width:62px;height:62px}
  .part{background:#111;color:var(--yellow);border-radius:10px;padding:5px 12px;font-weight:900;font-size:15px;align-self:flex-start}
  .comp td{border:1.5px solid #bbb;height:28px;padding:2px 5px;vertical-align:top;color:var(--muted)}
  .more{display:flex;align-items:center;gap:14px;border:2px dashed var(--line);border-radius:12px;padding:7px 10px;font-weight:800;font-size:14px}
  .more .ok{margin:0}
  .rule{background:var(--pink);color:#fff;border-radius:12px;padding:8px 14px;font-size:17px;font-weight:900;text-align:center}
  .foot{text-align:center;font-size:10px;color:var(--muted);margin-top:auto}
  @media print{
    body{background:#fff}.bar{display:none}
    .page{margin:0;box-shadow:none;width:auto;min-height:0;height:auto;padding:3mm 6mm;break-after:page;break-inside:avoid;zoom:.94}.page:last-child{break-after:auto}
    @page{size:A4;margin:6mm}
  }
  @media (max-width:820px){.page{width:auto;min-height:auto;margin:10px;padding:14px}.num{width:56px;height:56px;font-size:30px}.top h1{font-size:19px}}
</style>
</head>
<body>
<div class="bar"><b>דף המנחה · להדפסה</b>
  <select id="pick"><option value="all">כל השולחנות</option></select>
  <button onclick="window.print()">הדפסה</button>
</div>
<div id="pages"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="elias-data.js"></script>
<script>
var TABLES=[
  {n:1,lead:"ליאת",sec:"כללי ודרוזי",s:["עתיד גליל מערבי ירכא", "ג'וליס בנות", "אלחכמה כסרא-סמיע", "עתיד כרמיאל"]},
  {n:2,lead:"לירון",sec:"כללי",s:["התיכון החברתי חיפה", "צור ים", "עוצמ\"ה זוקו", "תיכון שיח", "תפן ליזמות", "בית אל"]},
  {n:3,lead:"עידית",sec:"כללי",s:["רימונים", "רמת דוד", "דרור גליל", "אנרג'י טק", "תיכון חברתי ת\"א"]},
  {n:4,lead:"סיגלית ורויטל",sec:"כללי",s:["אורט אורמת", "עמל אשדוד", "עתיד באר שבע", "צור ברק", "קמ\"ג דימונה", "מצפה רמון", "בית דוד", "אורט בית הערבה", "חוש\"ן", "תיכון החממה", "דן גורמה", "עמל טק אין", "אורט תעשייה אווירית", "אורט תל נוף", "עתיד פלמחים"]},
  {n:5,lead:"יסמין",sec:"ערבי",s:["אכסאל", "אל אמאני סכנין", "נצרת", "טורען", "אי טק סקול מסעדה"]},
  {n:6,lead:"רביב",sec:"ערבי",s:["שפרעם", "ערערה", "כפר יסיף", "אבו סנאן", "אורט כרמל", "אום אל פחם בנים", "אום אל פחם בנות"]},
  {n:7,lead:"ויסאם",sec:"ערבי",s:["בית חנינה בנים", "בית חנינה בנות", "סור באהר", "כפר עקב", "עמל טייבה ב'", "לקייה", "שגב שלום", "דרור נווה מדבר", "סכנין תל שבע", "עמל רהט", "ביר אל מכסור"]},
  {n:8,lead:"יששכר",sec:"חרדי",s:["אור העתיד תורני מקצועי", "הדר", "ישיבת עתיד אור מנחם", "נחלים", "עתיד כפר חב\"ד", "אור דניאל", "עתיד בת עמי", "טל חרמון", "ישיבת חנוך לנער", "כפר זיתים", "מרחביה/מעיינות"]}
];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var tableUrl=location.href.replace(/shulchanot-print\.html.*$/,'bursa.html?v=table');
var gameUrl=location.href.replace(/shulchanot-print\.html.*$/,'bursa.html');
function comp(k,label){
  return '<div class="comp"><div class="h">רכיב '+k+' <span style="font-weight:600;font-size:12px;color:var(--muted)">'+label+'</span><span class="fill"></span></div>'+
    '<div class="row"><span class="t">שלב 3 · שאלו שאלה <small>— אחת מתוך 4 בשקית. רכז/ת אחד/ת רושם/ת את הרעיונות בטלפון שלו/ה</small></span><span class="ok">סיימתי</span></div>'+
    '<div class="row"><span class="t">שלב 4 · בחרו רעיון אחד ופרקו אותו לפעילות <small>— לפי מה שייכנס לתוכנית השנתית</small></span><span class="ok">סיימתי</span></div>'+
    '<table><tr><td style="width:44%">הפעילות</td><td style="width:22%">מי אחראי/ת</td><td style="width:12%">שעות</td><td>מתי בשנה</td></tr></table></div>';
}
function page(t){
  return '<section class="page"><div class="top"><div class="num">'+t.n+'</div><div><h1>דף המנחה · שולחן '+t.n+' · '+esc(t.sec)+'</h1>'+
    '<div class="s">מנחה: '+esc(t.lead)+' · '+t.s.map(esc).join(' · ')+'</div></div>'+
    '<div class="qr"><div id="qr'+t.n+'"></div>דף המנחה בטלפון</div></div>'+
    '<div class="scribe"><div class="qr2"><div id="qs'+t.n+'"></div>המשחק</div><div><b>לפני הכול: מנו רכז/ת רעיונות שיכתוב/תכתוב את כל הרעיונות.</b>'+
      '<span>איפה? בטלפון שלו/ה, <b>במשחק שפתחנו בהתחלה</b> ← בתיבה <b>"אני הרשם/ת של השולחן"</b> ← מקלידים כל רעיון ולוחצים <b>"+ רעיון"</b>. סגר/ה את המשחק? סורקים את הקוד.</span>'+
      '<span>הרכז/ת: ______________________</span></div><span class="ok">סיימתי</span></div>'+
    '<div class="part">חלק א׳ · אליאס מושגים</div>'+
    '<div class="st"><span class="t">בתוך השקית — שקית אורגנזה לבנה עם כרטיסי מושגים (קלף ורוד)'+
      '<small>3 סבבים של דקה · בכל סבב מסביר/ה מישהו אחר · מסבירים את המושג <b>בלי להגיד את המילה או חלק ממנה</b> · כל ניחוש נכון = נקודה</small>'+
      '<small style="margin-top:4px;color:var(--ink);font-weight:700">ניחושים — סבב 1: ____ &nbsp; סבב 2: ____ &nbsp; סבב 3: ____</small></span><span class="ok">סיימתי</span></div>'+
    '<div class="part">חלק ב׳ · שולחנות הרעיונות</div>'+
    '<div class="intro"><b>לפנייך שקית ובה 8 שקיות קטנות — שקית לכל רכיב. בכל שקית 4 שאלות.</b>'+
    '<div class="chips">'+CHAPTERS.map(function(c){return '<span style="--c:'+c.c+'">'+esc(c.t)+'</span>'}).join('')+'</div></div>'+
    '<div class="st"><i>שלב 1</i><span class="t">הגרילו רכיב אחד בהפתעה<small>שולפים שקית בלי להסתכל</small></span><span class="fill"></span><span class="ok">סיימתי</span></div>'+
    '<div class="st"><i>שלב 2</i><span class="t">בחרו 2 רכיבים<small>שהשולחן החליט ביחד שמעניינים אתכם</small></span><span class="fill"></span><span class="ok">סיימתי</span></div>'+
    comp(1,'· מההגרלה')+comp(2,'· בחירה')+comp(3,'· בחירה')+
    '<div class="more">נשאר זמן? מעוניינים בעוד רכיב? <span class="ok">כן — רכיב: ________</span><span class="ok">סיימנו</span></div>'+
    '<div class="rule">בזמן הרעיונות — לא פוסלים כלום</div>'+
    '<div class="foot">מפגש רכזים חברתיים · 21.10 · בני ברק · תוכנית הבוגרים הופה · נבנה על ידי impactos</div></section>';
}
var sel=document.getElementById('pick');
TABLES.forEach(function(t){var o=document.createElement('option');o.value=t.n;o.textContent='שולחן '+t.n+' · '+t.lead;sel.appendChild(o)});
function render(){
  var v=sel.value,l=v==='all'?TABLES:TABLES.filter(function(t){return String(t.n)===v});
  document.getElementById('pages').innerHTML=l.map(page).join('');
  l.forEach(function(t){try{new QRCode(document.getElementById('qr'+t.n),{text:tableUrl,width:76,height:76,correctLevel:QRCode.CorrectLevel.M})}catch(e){}});
  l.forEach(function(t){try{new QRCode(document.getElementById('qs'+t.n),{text:gameUrl,width:62,height:62,correctLevel:QRCode.CorrectLevel.M})}catch(e){}});
}
sel.onchange=render;render();
</script>
</body>
</html>
