<style>
  :root{--pink:#E8348A;--pink-d:#C2185B;--yel:#FFF200;--yel-s:#FFF9B0;--ink:#1d1d24;--mut:#6b6b78;--line:#ececf2;--bg:#faf9fc;--ok:#1f9d55;--ok-s:#e6f6ec;--fix:#d9480f;--fix-s:#fff0e6}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Rubik',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px}

  .logobox{background:#fff;border-radius:13px;padding:6px 12px;box-shadow:0 4px 14px rgba(0,0,0,.18);display:inline-flex;align-items:center}

  .bar{position:fixed;inset-inline:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -6px 20px rgba(30,20,60,.06)}

  .track{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}

</style>

/* ===================== תוכן הטיוטה (מתוך תיק-הגשה-לירון-גולן.md) ===================== */
var BLOCKS=[
 {id:'b1',t:'הבעיה שאף אחד לא פתר',x:'בכל שנה אלפי צעירים בישראל נעלמים ברגע אחד: ביום שבו הם יוצאים משערי התיכון. עד אותו יום יש מי שרואה אותם, מחנכת, יועצת, בית ספר. מאותו יום, אף אחד לא יודע איפה הם, מה עובר עליהם, ולאיזו עזרה הם זכאים. והעזרה קיימת: מאות תוכניות, מלגות, זכויות ומסגרות, מפוזרות בין משרדי ממשלה, רשויות ועמותות. אבל היא לא מגיעה אל מי שהכי זקוק לה.\n\nעבור צעירים בסיכון, זה ההבדל בין חיים יציבים לבין נפילה. צעיר בסיכון לא יחפש בעצמו את התוכנית שמתאימה לו. לרוב הוא לא יודע שהיא קיימת, ולפעמים כבר אין לו כוח לחפש.'},
 {id:'b2',t:'החזון של לירון',x:'לירון גולן, מנכ"לית הופה, הבינה משהו שמערכת החינוך והרווחה בישראל לא הבינו עד כה: זו לא בעיה של מחסור במענים. זו בעיה של חיבור. ואם זו בעיה של חיבור, אפשר לפתור אותה.\n\nמתוך התובנה הזו לירון יצרה שלושה דברים ששלובים זה בזה: <b>שיטה</b> (מודל הרדאר 360), <b>דרך עבודה</b> (מודל ההפעלה של הופה), ו<b>תשתית דיגיטלית</b> שמממשת את שתיהן. זו פלטפורמה <mark>ראשונה מסוגה בישראל</mark>, שמנטרת באופן רציף את מצבם של צעירים בגילאי 14 עד 26, מזהה כל צורך שעולה ומתאימה לו את המענה הנכון.'},
 {id:'b3',t:'מודל הרדאר 360: שיטה חדשה לראות צעירים',x:'לירון הגתה את מודל הרדאר, שמתרגם את הרעיון של "לראות בזמן" לארבעה שלבים:<ol><li><b>שידור וקליטה:</b> איסוף מידע שוטף מבית הספר, מהצעיר ומהמשפחה.</li><li><b>ניתוח:</b> מודל רמזור ירוק, כתום ואדום, שמראה מי יציב, מי מתחיל להתרחק ומי בסכנה.</li><li><b>חישוב והתאמה:</b> הצלבה של הצורך עם מאגר המענים.</li><li><b>החזרת גלים:</b> פעולה יזומה, לפני שהמצב מחריף.</li></ol>זו תפיסה הפוכה לגישה המקובלת. במקום להגיב למשבר, הרדאר מזהה את האות הראשון. בציר מניעת הנשירה, <mark>הרמזור נדלק בכתום אחרי שלושה ימי היעדרות רצופים, ארבעה ימים לפני</mark> שהנוהל הרשמי מתחיל לפעול. המודל <mark>זכה במענק "רדאר 360" מקרן מגה אור</mark>, והתוכנית של הופה <mark>מאושרת במאגר גפ"ן של משרד החינוך</mark>.'},
 {id:'b4',t:'מודל ההפעלה: מרעיון לשיטה שאפשר לשכפל',x:'לירון תכננה את כל מודל ההפעלה של הופה: רצף ליווי אחד מגיל 14 ועד 26, בשני צירים שמשלימים זה את זה, מניעת נשירה בבית הספר וליווי בוגרים אחריו. המודל מגדיר את התפקיד של רכזת או רכז בכל בית ספר, סולם הסלמה ברור, כרטיסי התערבות ומדדי הצלחה. כך הופה אינה תלויה באדם אחד מוכשר. זו שיטה שכל בית ספר יכול לאמץ, <mark>בעלות של כ-393 ₪ לצעיר בשנה</mark>.'},
 {id:'b5',t:'פריצת הדרך: ניטור והתאמה במערכת אחת',x:'החדשנות של לירון היא בחיבור בין שני עולמות שעד היום עמדו בנפרד:\n\n<b>ניטור נתונים חי.</b> במקום רשימות בוגרים באקסל שמתיישנות תוך חודשים, המערכת מחזיקה תמונת מצב חיה של כל בוגר. היא יודעת מי השתחרר, מי עובד, מי לומד ומי הפסיק לענות. היא מזהה בעצמה מי חסר פרטים ומי זקוק לטיפול, ומציפה אותו לרכז לפני שהוא נעלם.\n\n<b>התאמת מענים לכל צורך.</b> ברגע שבוגר מדווח שהוא מחפש עבודה, זקוק למלגה או לא יודע מה לעשות אחרי השחרור, המערכת מצליבה את הצורך שלו עם מאגר המענים ומציעה את ההתאמה המדויקת, לפי גיל, אזור, שפה ותחום.\n\nזה שינוי עמוק בגישה: <b>המערכת לא מחכה שהצעיר יבקש עזרה. היא מאתרת את הצורך ומביאה אליו את העזרה.</b>'},
 {id:'b6',t:'מה לירון בנתה, במו ידיה',x:'<ul><li><b>מאגר מענים לאומי לצעירים:</b> <mark>כ-645 תוכניות, מלגות וזכויות</mark>, שמתעדכן כל הזמן, גם ממערכת שמנטרת עשרות קבוצות מקצועיות.</li><li><b>"הופי", בוט וואטסאפ מבוסס בינה מלאכותית:</b> מדבר עם צעירים בערוץ שלהם, קורא מסמכים שהם שולחים ומחזיר מענים מותאמים.</li><li><b>מערכת מאובטחת למעקב אחר בוגרים:</b> <mark>כ-2,500 בוגרים מלמעלה מ-20 בתי ספר</mark>.</li><li><b>שאלון מיפוי ופורטל דו-לשוניים</b> בעברית ובערבית, שסביבם צמחה קהילה ארצית של רכזים, כולל בחברה הערבית, הבדואית והדרוזית.</li></ul>'},
 {id:'b7',t:'למה לירון היא פורצת דרך',x:'<b>היא הוגה, והיא גם בונה.</b> נדיר שאותה אישה מנסחת מודל, כותבת את מודל ההפעלה שלו ובונה במו ידיה את הטכנולוגיה. לירון עומדת בראש עמותה חברתית בלי מחלקת פיתוח. במקום לחכות למשאבים, היא למדה לעבוד עם כלי פיתוח מבוססי בינה מלאכותית ו<mark>בנתה בעצמה את כל התשתית הדיגיטלית של הארגון</mark>. בכך הוכיחה לכל המגזר החברתי שארגון חברתי יכול להחזיק תשתית ברמה של ארגון גדול.\n\n<b>היא מחברת טכנולוגיה ולב.</b> "אף צעיר לא נופל בין הכיסאות". הטכנולוגיה שלה מעצימה את הקשר האנושי, ומאפשרת לרכז אחד לראות מאות צעירים ולדעת עם מי לדבר היום.\n\n<b>היא מקדמת שוויון הזדמנויות אמיתי.</b> רוב הצעירים שהופה מלווה חיים בפריפריה הגיאוגרפית והחברתית, שם הפער בנגישות למידע הוא עצום. המערכת של לירון מביאה לצעיר בעיירת פיתוח או בכפר בגליל את אותו מידע ואותן הזדמנויות שיש לצעיר במרכז, בשפה שלו ובערוץ שלו.\n\n<b>היא הובילה קפיצת מדרגה.</b> הופה פועלת כבר שנים רבות בליווי צעירים. לירון לקחה את הניסיון הזה והפכה אותו למודל חדש: שיטה מובנית, דרך עבודה אחידה ותשתית דיגיטלית. בתוך זמן קצר המודל החדש כבר פועל בבתי ספר מהגליל ועד הנגב, בעברית ובערבית, <mark>בשותפות עם [רשתות, משרד העבודה]</mark>. וזו רק תחילת הדרך: התשתית מוכנה לצמוח לכל בית ספר בישראל.'},
 {id:'b8',t:'לסיום',x:'לירון גולן לקחה את אחת הבעיות העיקשות בחברה הישראלית, צעירים שנעלמים אחרי התיכון, והפכה אותה לבעיה שאפשר לפתור. לא עוד תוכנית ולא עוד פרויקט, אלא תשתית: מערכת שרואה כל צעיר, יודעת מה קיים עבורו ומחברת ביניהם. היא עשתה זאת במו ידיה, מתוך אמונה עמוקה שכל צעיר ראוי שמישהו ימשיך לחפש אותו.\n\nזו חדשנות דיגיטלית בחינוך במובן העמוק ביותר: טכנולוגיה שמחזירה צעירים לתמונה. לירון לא רק פרצה דרך. היא סללה דרך שארגונים, בתי ספר ומדינה שלמה יכולים ללכת בה.'}
];

/* ===================== שאלות אימות (כל מה שמסומן בצהוב) ===================== */
var FACTS=[
 {id:'f1',l:'מאגר המענים: "כ-645 מענים"',w:'באתר רשומים כיום כ-640. מה המספר הנכון לציין?'},
 {id:'f2',l:'מערכת הבוגרים: "כ-2,500 בוגרים מלמעלה מ-20 בתי ספר"',w:'לפי HOPA Secure בסוף ספטמבר: כ-2,480 בוגרים מ-21 בתי ספר.'},
 {id:'f3',l:'מענק "רדאר 360" מקרן מגה אור',w:'האם השם והפרטים נכונים? האם המענק התקבל בתקופתך? מה הסכום, אם רוצים לציין אותו?'},
 {id:'f4',l:'הופה מאושרת במאגר גפ"ן של משרד החינוך',w:'האם זה נכון, ומאיזו שנה?'},
 {id:'f5',l:'עלות של כ-393 ₪ לצעיר בשנה',w:'האם המספר מתאים למודל החדש, או שהוא מחושב מהמודל הקודם?'},
 {id:'f6',l:'רמזור נשירה: כתום אחרי 3 ימי היעדרות, 4 ימים לפני הנוהל הרשמי',w:'האם זה חלק מהמודל שלך ואפשר לייחס אותו אלייך?'},
 {id:'f7',l:'מה בנית בעצמך ומה נבנה עם אחרים',w:'בטקסט כתוב שבנית "במו ידייך" את כל התשתית: האתר, הבוט, מערכת הבוגרים המאובטחת, השאלון והפורטל. איזה חלק בנית בעצמך, ואיזה עם מפתח או שותף? הוועדה עשויה לבדוק, ולכן חשוב לדייק.'},
 {id:'f8',l:'"פלטפורמה ראשונה מסוגה בישראל"',w:'טענה חזקה. אם את לא בטוחה בה, נכתוב "פלטפורמה חדשנית".'},
 {id:'f9',l:'שותפויות: "בשותפות עם [רשתות, משרד העבודה]"',w:'עם מי בדיוק, ובאיזה ניסוח?'},
 {id:'f10',l:'ציר הזמן: ממתי מודל הרדאר והמערכת פועלים?',w:'אנחנו במסלול "תחילת הדרך", ולכן חשוב שכל הישג בטקסט יהיה מתקופתך.'}
];

/* ===================== מה חסר ===================== */
var MISSING=[
 {id:'m1',l:'ממתי את מנכ"לית הופה?',ph:'לדוגמה: מאז 2023'},
 {id:'m2',l:'מה עשית לפני הופה? (בקצרה, לקורות החיים)',ph:'תפקידים, ארגונים, שנים',ta:1},
 {id:'m3',l:'השכלה',ph:'תואר, מוסד, שנה'},
 {id:'m4',l:'פרסים, הכרה, כנסים או הרצאות',ph:'כל מה שיש, גם דברים קטנים',ta:1},
 {id:'m5',l:'נתון השפעה אחד מהתקופה שלך',ph:'לדוגמה: כמה בוגרים סומנו לטיפול וקיבלו מענה, כמה פניות טיפל הבוט, כמה צעירים מילאו את השאלון',ta:1,why:'זה מה שיחזק את ההגשה יותר מכל דבר אחר.'},
 {id:'m6',l:'רגע אחד שמראה למה זה חשוב',ph:'צעיר או צעירה (בלי שם) שהמערכת "תפסה" בזמן, או רגע שבו הבנת שצריך לבנות את זה',ta:1},
 {id:'m7',l:'מי יכתבו עלייך מכתבי המלצה? (עד 3)',ph:'מיטל כבר כותבת. אולי נאוה גינזבורג? מנהל או מנהלת של בית ספר שותף? גורם במשרד?',ta:1},
 {id:'m8',l:'עוד משהו שחשוב לך שייכתב',ph:'',ta:1}
];

var TODO=[
 {id:'t1',l:'לצלם סרטון הצגה עצמית (60 עד 90 שניות)',script:1},
 {id:'t2',l:'צילום תעודת זהות (לשלוח למיטל בנפרד, לא דרך הדף הזה)'},
 {id:'t3',l:'הצהרה חתומה: "אני מצהירה כי לא הורשעתי בעבירה פלילית"'}
];

/* ===================== מצב ===================== */
var state={blocks:{},facts:{},missing:{},todo:{}};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
try{var saved=JSON.parse(lsGet(DRAFT_KEY)||'null');if(saved)state=Object.assign(state,saved)}catch(e){}

var app=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2200)}

/* ===================== תצוגת לירון ===================== */
function render(){
  var h='';
  h+='<div class="card intro"><p><b>איך זה עובד?</b> ארבעה שלבים קצרים:</p><p>1. לקרוא את טקסט ההגשה ולסמן על כל חלק אם הוא <b>מדויק</b> או אם <b>צריך לתקן</b>.</p><p>2. לענות על שאלות האימות. כל מה שמסומן <mark>בצהוב</mark> בטקסט צריך את האישור שלך.</p><p>3. להשלים את מה שרק את יודעת.</p><p>4. להכין את מה שצריך ממך להגשה: סרטון, תעודת זהות והצהרה.</p><p class="sub">הכול נשמר תוך כדי, ואפשר לחזור לדף מאוחר יותר. בסוף לוחצים "שליחה למיטל".</p></div>';

  h+='<div class="step"><b>1</b><div><h2>הטקסט שיוגש לוועדה</h2><p class="sub">תיאור העשייה וההישגים, כ-900 מילים. המגבלה של הפרס היא 1,000.</p></div></div>';
  BLOCKS.forEach(function(b){
    var s=state.blocks[b.id]||{};
    h+='<div class="card blk '+(s.v==='ok'?'s-ok':s.v==='fix'?'s-fix':'')+'" data-b="'+b.id+'"><h3>'+b.t+'</h3><div class="txt">'+b.x+'</div>'+
      '<div class="acts"><button class="b ok'+(s.v==='ok'?' on':'')+'" data-v="ok">✓ מדויק</button><button class="b fx'+(s.v==='fix'?' on':'')+'" data-v="fix">✏️ צריך לתקן</button></div>'+
      '<textarea class="'+(s.v==='fix'?'':'hide')+'" rows="3" placeholder="מה לא מדויק, ואיך נכון לכתוב?">'+esc(s.note)+'</textarea></div>';
  });

  h+='<div class="step"><b>2</b><div><h2>שאלות אימות</h2><p class="sub">ועדות פרסים בודקות עובדות. מספר אחד שגוי יכול לפגוע באמינות של כל ההגשה.</p></div></div><div class="card">';
  FACTS.forEach(function(f){
    var s=state.facts[f.id]||{};
    h+='<div class="q" data-f="'+f.id+'"><div class="lbl">'+esc(f.l)+'</div><div class="why">'+esc(f.w)+'</div>'+
      '<div class="acts"><button class="b ok'+(s.v==='ok'?' on':'')+'" data-v="ok">✓ נכון</button><button class="b fx'+(s.v==='fix'?' on':'')+'" data-v="fix">✏️ לתקן או להסביר</button></div>'+
      '<textarea class="'+(s.v==='fix'?'':'hide')+'" rows="2" placeholder="הנוסח או המספר הנכון">'+esc(s.note)+'</textarea></div>';
  });
  h+='</div>';

  h+='<div class="step"><b>3</b><div><h2>מה שרק את יודעת</h2><p class="sub">מספיקות כמה מילים. אנחנו ננסח.</p></div></div><div class="card">';
  MISSING.forEach(function(m){
    var v=state.missing[m.id]||'';
    h+='<div class="q"><div class="lbl">'+esc(m.l)+'</div>'+(m.why?'<div class="why">'+esc(m.why)+'</div>':'')+
      (m.ta?'<textarea data-m="'+m.id+'" rows="3" placeholder="'+esc(m.ph)+'">'+esc(v)+'</textarea>':'<input type="text" data-m="'+m.id+'" placeholder="'+esc(m.ph)+'" value="'+esc(v)+'">')+'</div>';
  });
  h+='</div>';

  h+='<div class="step"><b>4</b><div><h2>מה צריך ממך להגשה</h2><p class="sub">את זה אי אפשר לעשות בשבילך. אפשר לסמן כאן כשזה מוכן.</p></div></div><div class="card">';
  TODO.forEach(function(t){
    h+='<label class="chk"><input type="checkbox" data-t="'+t.id+'"'+(state.todo[t.id]?' checked':'')+'><div><div class="lbl">'+esc(t.l)+'</div>'+
    (t.script?'<div class="script"><p><b>תסריט מוצע (לא חובה להקריא):</b></p><p>1. "אני לירון גולן, מנכ"לית הופה. אנחנו מלווים צעירים מגיל 14 ועד 26, רובם מהפריפריה."</p><p>2. "ראיתי צעירים שמסיימים תיכון ונעלמים. לא כי אין להם מענים, אלא כי אף אחד לא מחבר ביניהם."</p><p>3. "אז בניתי מערכת שמנטרת את מצבו של כל בוגר, מזהה את הצורך שלו ומתאימה לו מענה מתוך מאות תוכניות, מלגות וזכויות. לצעיר בסיכון זה ההבדל בין לחפש לבד לבין שהעזרה תגיע אליו."</p><p>4. "היום יותר מ-20 בתי ספר עובדים איתה, בעברית ובערבית, וכל רכזת רואה בזמן אמת מי מהבוגרים שלה צריך אותה עכשיו. וזו רק ההתחלה."</p><p>5. "טכנולוגיה, בשבילי, היא דרך לוודא שאף צעיר לא נופל בין הכיסאות."</p><p class="sub">טיפ: טלפון לרוחב, אור מהחלון, לדבר בגובה העיניים.</p></div>':'')+
    '</div></label>';
  });
  h+='</div>';
  h+='<footer>הופה · <a href="https://hopa.org.il" target="_blank" rel="noopener">hopa.org.il</a></footer>';
  app.innerHTML=h;
  bind();progress();
}

function bind(){
  app.querySelectorAll('[data-b],[data-f]').forEach(function(box){
    var isB=box.hasAttribute('data-b'),id=isB?box.getAttribute('data-b'):box.getAttribute('data-f'),bag=isB?state.blocks:state.facts;
    var ta=box.querySelector('textarea');
    box.querySelectorAll('.b').forEach(function(btn){btn.onclick=function(){
      var v=btn.getAttribute('data-v');bag[id]=bag[id]||{};bag[id].v=(bag[id].v===v?null:v);
      box.querySelectorAll('.b').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-v')===bag[id].v)});
      ta.classList.toggle('hide',bag[id].v!=='fix');
      if(isB){box.classList.toggle('s-ok',bag[id].v==='ok');box.classList.toggle('s-fix',bag[id].v==='fix')}
      if(bag[id].v==='fix')ta.focus();
      changed();
    }});
    ta.oninput=function(){bag[id]=bag[id]||{};bag[id].note=ta.value;changed()};
  });
  app.querySelectorAll('[data-m]').forEach(function(el){el.oninput=function(){state.missing[el.getAttribute('data-m')]=el.value;changed()}});
  app.querySelectorAll('[data-t]').forEach(function(el){el.onchange=function(){state.todo[el.getAttribute('data-t')]=el.checked;changed()}});
}

function progress(){
  var tot=BLOCKS.length+FACTS.length+MISSING.length,done=0;
  BLOCKS.forEach(function(b){if((state.blocks[b.id]||{}).v)done++});
  FACTS.forEach(function(f){if((state.facts[f.id]||{}).v)done++});
  MISSING.forEach(function(m){if((state.missing[m.id]||'').trim())done++});
  document.getElementById('progTxt').textContent=done+' מתוך '+tot;
  document.getElementById('progBar').style.width=Math.round(done/tot*100)+'%';
}

var timer=null;
function changed(){
  lsSet(DRAFT_KEY,JSON.stringify(state));progress();
  document.getElementById('saveTxt').textContent='שומרת…';
  clearTimeout(timer);timer=setTimeout(function(){push(false)},2500);
}
function push(final){
  var payload=Object.assign({},state,{ts:new Date().toISOString(),final:!!final||!!state.final});
  if(final)state.final=true;
  lsSet(DRAFT_KEY,JSON.stringify(state));
  return fetch(EXEC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({action:'intakeSubmit',school:KEY,json:JSON.stringify(payload)}).toString()})
   .then(function(){document.getElementById('saveTxt').textContent='נשמר ✓'})
   .catch(function(){document.getElementById('saveTxt').textContent='נשמר במכשיר. ננסה שוב בשינוי הבא'});
}
document.getElementById('sendBtn').onclick=function(){
  var b=this;b.disabled=true;
  push(true).then(function(){b.disabled=false;toast('נשלח למיטל. תודה לירון! 💛')});
};

/* ===================== תצוגת ניהול: ?admin=hopa ===================== */
function jsonp(params){return new Promise(function(res,rej){var cb='cb'+Math.random().toString(36).slice(2);var s=document.createElement('script');
  window[cb]=function(d){delete window[cb];s.remove();res(d)};s.onerror=function(){delete window[cb];s.remove();rej(new Error('network'))};
  s.src=EXEC_URL+'?'+new URLSearchParams(Object.assign({callback:cb},params)).toString();document.head.appendChild(s)})}
function tag(v){return v==='ok'?'<span class="tag ok">מדויק</span>':v==='fix'?'<span class="tag fix">לתקן</span>':'<span class="tag no">טרם סומן</span>'}
function renderAdmin(){
  document.getElementById('bar').remove();
  document.getElementById('heroTitle').textContent='התשובות של לירון';
  document.getElementById('heroSub').textContent='חי מהגיליון. רענון הדף מציג את העדכון האחרון.';
  app.innerHTML='<div class="card"><p class="sub">טוענת…</p></div>';
  jsonp({action:'storeAll',secret:GS_SECRET}).then(function(r){
    if(!r.ok)throw new Error(r.error||'err');
    var d=r.store['intake_'+KEY];
    if(!d){app.innerHTML='<div class="card"><p>לירון עוד לא התחילה למלא.</p></div>';return}
    var h='<div class="card"><b>עדכון אחרון:</b> '+esc(new Date(d.ts).toLocaleString('he-IL'))+(d.final?' <span class="tag ok">נשלח סופית</span>':' <span class="tag no">עדיין בעבודה</span>')+'</div>';
    h+='<div class="step"><b>1</b><h2>הטקסט</h2></div><div class="card adm">';
    BLOCKS.forEach(function(b){var s=(d.blocks||{})[b.id]||{};h+='<div class="row"><b>'+b.t+'</b>'+tag(s.v)+(s.note?'<div class="txt">'+esc(s.note)+'</div>':'')+'</div>'});
    h+='</div><div class="step"><b>2</b><h2>אימות</h2></div><div class="card adm">';
    FACTS.forEach(function(f){var s=(d.facts||{})[f.id]||{};h+='<div class="row"><b>'+esc(f.l)+'</b>'+tag(s.v)+(s.note?'<div class="txt">'+esc(s.note)+'</div>':'')+'</div>'});
    h+='</div><div class="step"><b>3</b><h2>השלמות</h2></div><div class="card adm">';
    MISSING.forEach(function(m){var v=(d.missing||{})[m.id]||'';h+='<div class="row"><b>'+esc(m.l)+'</b><div class="txt">'+(v?esc(v):'<span class="sub">—</span>')+'</div></div>'});
    h+='</div><div class="step"><b>4</b><h2>הכנות</h2></div><div class="card adm">';
    TODO.forEach(function(t){h+='<div class="row">'+((d.todo||{})[t.id]?'✅ ':'⬜ ')+esc(t.l)+'</div>'});
    app.innerHTML=h+'</div>';
  }).catch(function(e){app.innerHTML='<div class="card"><p>לא הצלחתי לטעון מהגיליון ('+esc(e.message)+'). נסי לרענן.</p></div>'});
}

if(new URLSearchParams(location.search).get('admin')==='hopa')renderAdmin();else render();
</script>
