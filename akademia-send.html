.card.sent{opacity:.72;border-color:#b9e2c7}
.card h3{margin:0 0 2px;font-size:16.5px}
.card .unit{font-size:13.5px;color:var(--muted)}
.card .to{font-size:14px;margin-top:6px;word-break:break-all}
.card .note{font-size:13px;color:#8a5a00;background:#fff6d6;border-radius:8px;padding:4px 8px;margin-top:6px;display:inline-block}

details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px}
summary{cursor:pointer;font-weight:700}
.preview{font-size:14px;white-space:pre-wrap;margin-top:8px;color:#222}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:92vw;text-align:center}
.toast.show{opacity:1}
#clip{position:fixed;left:-9999px;top:0}

function paras(m){
  return [
    'שלום רב,',
    'שמי מיטל פלג, סמנכ"לית תפעול בעמותת הופה. הופה מלווה צעירים מגיל 14 עד 26 ביותר מ-30 בתי ספר בכל הארץ, בעיקר צעירים במצבי סיכון וללא עורף משפחתי, במעבר מהתיכון לשירות, ללימודים ולעבודה.',
    'אנחנו מגייסים מתנדבים לליווי הבוגרים שלנו. המתנדבים מקיימים שיחות טלפון עם בוגרים, שואלים מה מצבם ומה הם צריכים, ומכוונים אותם למענים: מלגות, הכשרות, תעסוקה ומיצוי זכויות. העמותה מכשירה את המתנדבים, נותנת להם תסריט שיחה ומלווה אותם לאורך כל התקופה. ההתנדבות נעשית מהבית ובזמן גמיש.',
    'נשמח לברר אם אפשר לרשום את הופה אצלכם ב' + m.name + ' כמקום התנדבות מוכר לסטודנטים, במסגרת מעורבות חברתית, נקודות זכות או מלגות. אם כן, נשמח לדעת מה התנאים, מה היקף השעות הנדרש ולמי לפנות.',
    'לסטודנטים יש אצלנו מסלול שנתי של כ-140 שעות, כ-4 שעות בשבוע לאורך שנת הלימודים. המסלול כולל הכשרה בפתיחה, הדרכה קבוצתית חודשית ודיווח שעות חודשי שהעמותה מאשרת. אם הדרישות אצלכם שונות, נשמח להתאים.'
  ];
}

}

function jsonpOnce(params, tmo){
  return new Promise((res,rej)=>{
    const cb='cb'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    const timer=setTimeout(()=>{ window[cb]=()=>{}; s.remove(); rej(new Error('timeout')); }, tmo);
    window[cb]=d=>{clearTimeout(timer); delete window[cb]; s.remove(); res(d);};
    s.src=EXEC_URL+'?'+new URLSearchParams(Object.assign({callback:cb},params)).toString();
    s.onerror=()=>{clearTimeout(timer); delete window[cb]; s.remove(); rej(new Error('network'));};
    document.head.appendChild(s);
  });
}
async function fetchOnce(params, tmo){
  const ctl = new AbortController(); const timer = setTimeout(()=>ctl.abort(), tmo);
  try{
    const r = await fetch(EXEC_URL+'?'+new URLSearchParams(params).toString(), {credentials:'omit', cache:'no-store', redirect:'follow', signal:ctl.signal});
    const txt = await r.text();
    try{ return JSON.parse(txt); }catch(e){ throw new Error('bad response '+r.status); }
  } finally { clearTimeout(timer); }
}
async function jsonp(params, onRetry){
  let err;
  for (let i=1;i<=4;i++){
    try{ return await fetchOnce(params, 25000); } catch(e){ err=e; }
    try{ return await jsonpOnce(params, 25000); } catch(e){ err=e; if(onRetry) onRetry(i+1); }
  }
  throw err;
}
let SENT = {}, FILTER = 'todo';
async function load(){
  $('app').textContent = 'טוען…';
  try{
    const r = await jsonp({action:'storeAll', secret:GS_SECRET});
    if(!r || !r.ok) throw new Error((r&&r.error)||'err');
    SENT = (r.store||{})[STATE_KEY] || {};
    render();
  }catch(e){
    if(window.staffCodeFail && staffCodeFail(e, $('app'))) return;
    $('app').innerHTML = '<div class="card">לא הצלחתי לטעון מהגיליון. <button class="btn" onclick="load()">לנסות שוב</button></div>';
  }
}
async function save(){
  try{
    const r = await jsonp({action:'storeSet', secret:GS_SECRET, key:STATE_KEY, json:JSON.stringify(SENT)});
    if(!r || !r.ok) throw 0;
  }catch(e){ toast('הסימון לא נשמר בגיליון, נסי שוב'); }
}
function mark(id, on){
  if(on) SENT[id] = new Date().toISOString(); else delete SENT[id];
  save(); render();
}

/* ---------- תצוגה ---------- */
function render(){
  const total = MOSDOT.length, done = MOSDOT.filter(m=>SENT[m.id]).length;
  const list = MOSDOT.filter(m=>FILTER==='all' || (FILTER==='todo' ? !SENT[m.id] : !!SENT[m.id]));
  const ex = MOSDOT[0];
  $('app').innerHTML = `
    <div class="progress"><span class="n">${done} מתוך ${total}</span> נשלחו<div class="b"><i style="width:${Math.round(done/total*100)}%"></i></div></div>
    <div class="tip">${IS_MOBILE
      ? '📱 בטלפון: לחיצה על "שליחה" פותחת מייל מוכן. <b>לבדוק שבשורת "מאת" מופיע meytal@hopa.org.il</b> ולא חשבון אחר.'
      : '💻 במחשב: לחיצה על "פתיחה בג\'ימייל" מעתיקה את הנוסח ופותחת טיוטה מחשבון הופה. <b>לחצי בגוף המייל ו-Ctrl+V</b>, ואז שליחה.'}</div>
    <div class="bar">
      <button class="btn ${FILTER==='todo'?'on':''}" data-f="todo">לשליחה (${total-done})</button>
      <button class="btn ${FILTER==='done'?'on':''}" data-f="done">נשלחו (${done})</button>
      <button class="btn ${FILTER==='all'?'on':''}" data-f="all">הכל (${total})</button>
    </div>
    <details><summary>הנוסח שיוצא (דוגמה: ${esc(ex.name)})</summary><div class="preview"><b>נושא:</b> ${esc(SUBJECT)}\n\n${esc(mailText(ex))}</div></details>
    ${list.map(m=>{ const s = SENT[m.id];
      return `<div class="card ${s?'sent':''}">
        <h3>${esc(m.name)}<span class="reg">${esc(m.region)}</span></h3>
        <div class="unit">${esc(m.unit)}${m.conf==='general'?' · מייל כללי':''}</div>
        <div class="to" dir="ltr" style="text-align:right">${esc(m.to.split(',').join(', '))}</div>
        ${m.note?`<div class="note">⚠️ ${esc(m.note)}</div>`:''}
        <div class="acts">
          ${IS_MOBILE
            ? `<a class="btn pri" href="${esc(mailtoHref(m))}" data-send="${m.id}">✉️ שליחה</a>`
            : `<button class="btn pri" data-gmail="${m.id}">✉️ פתיחה בג'ימייל</button>
               <a class="btn" href="${esc(mailtoHref(m))}" data-send="${m.id}">mailto</a>`}
          <button class="btn" data-copy="${m.id}">📋 העתקת הנוסח</button>
          ${s ? `<button class="btn done" data-unmark="${m.id}">✓ נשלח ${new Date(s).toLocaleDateString('he-IL')} · ביטול</button>`
              : `<button class="btn" data-mark="${m.id}">סימון כנשלח</button>`}
        </div></div>`; }).join('') || '<div class="card">אין כאן מוסדות. 🎉</div>'}`;
}
function copyHtml(m){
  const c = $('clip'); c.innerHTML = mailHtml(m);
  const r = document.createRange(); r.selectNodeContents(c);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  let ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
  sel.removeAllRanges(); c.innerHTML = '';
  return ok;
}
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-f],[data-gmail],[data-copy],[data-mark],[data-unmark],[data-send]'); if(!t) return;
  const find = id => MOSDOT.find(m=>m.id===id);
  if(t.dataset.f){ FILTER = t.dataset.f; render(); return; }
  if(t.dataset.gmail){
    const m = find(t.dataset.gmail);
    const ok = copyHtml(m);                                // קודם העתקה (סינכרוני), ורק אז חלון חדש
    window.open(gmailHref(m) + (ok ? '' : '&body=' + encodeURIComponent(mailText(m))), '_blank');
    toast(ok ? 'הנוסח הועתק. לחצי בגוף המייל ו-Ctrl+V' : 'ההעתקה לא הצליחה, הנוסח נכנס כטקסט רגיל', 4500);
    mark(m.id, true); return;
  }
  if(t.dataset.send){ const id = t.dataset.send; setTimeout(()=>mark(id, true), 400); return; }   // ה-mailto נפתח מה-href עצמו; מציירים מחדש רק אחריו
  if(t.dataset.copy){ toast(copyHtml(find(t.dataset.copy)) ? 'הנוסח הועתק' : 'ההעתקה לא הצליחה'); return; }
  if(t.dataset.mark){ mark(t.dataset.mark, true); return; }
  if(t.dataset.unmark){ mark(t.dataset.unmark, false); return; }
});
load();
</script>
</body>
