<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>משוב · מפגש רכזי הבוגרים · הופה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--pink:#E8348A;--pink-dark:#c02673;--pink-soft:#fde7f2;--yellow:#FFF200;
    --ink:#1f1f26;--muted:#7d7d8a;--line:#ebe6ee;--bg:#f6f2f7;--card:#fff;--ok:#22b573;
    --shadow:0 4px 18px rgba(31,31,38,.07);--shadow-lg:0 14px 40px rgba(31,31,38,.14)}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{font-family:'Rubik',system-ui,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  button,textarea,input,select{font-family:inherit;font-size:inherit}
  a{color:var(--pink-dark)}
  .in{max-width:680px;margin:0 auto;padding:0 16px}
  .in.adm{max-width:980px}

  header{background:#111;color:#fff;padding:18px 0 26px;position:relative;overflow:hidden}
  header:after{content:"";position:absolute;inset-inline-start:-80px;top:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,242,0,.22),transparent 65%);pointer-events:none}
  .hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{background:#fff;border-radius:14px;padding:6px 10px;display:inline-flex;align-items:center}
  .logo img{height:40px;display:block}
  header h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.2px}
  header .sub{font-size:13.5px;opacity:.85;margin-top:2px}
  .meet{margin-top:14px;display:inline-flex;gap:10px;align-items:center;background:var(--yellow);color:#111;border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
  .meet small{font-weight:500;opacity:.8}

  main{padding:18px 0 40px}
  .card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px;margin-top:14px}
  .card h2{margin:0 0 2px;font-size:16.5px;font-weight:800;display:flex;align-items:center;gap:8px}
  .card h2 .num{background:var(--pink-soft);color:var(--pink-dark);width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:800;flex:none}
  .hint{font-size:13px;color:var(--muted);margin:2px 0 10px}
  select,textarea,input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink);outline:none;transition:.15s}
  select:focus,textarea:focus,input[type=text]:focus{border-color:var(--pink)}
  textarea{min-height:88px;resize:vertical;line-height:1.55}

  .scale{display:flex;gap:8px;justify-content:space-between}
  .scale button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 4px 8px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:2px}
  .scale button .e{font-size:26px;line-height:1;filter:grayscale(1);opacity:.55;transition:.15s}
  .scale button .l{font-size:11px;color:var(--muted);font-weight:600}
  .scale button:hover{border-color:var(--pink)}
  .scale button.on{border-color:var(--pink);background:var(--pink-soft);box-shadow:0 3px 12px rgba(232,52,138,.18)}
  .scale button.on .e{filter:none;opacity:1;transform:scale(1.12)}
  .scale button.on .l{color:var(--pink-dark)}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;color:var(--ink)}
  .chips button:hover{border-color:var(--pink)}
  .chips button.on{background:var(--pink);border-color:var(--pink);color:#fff}
  .otherwrap{margin-top:10px;display:none}
  .otherwrap.show{display:block}

  .send{margin-top:18px;text-align:center}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;padding:14px 30px;font-weight:800;font-size:16.5px;cursor:pointer;transition:.15s;text-decoration:none}
  .btn:active{transform:scale(.97)}
  .btn.pink{background:var(--pink);color:#fff;box-shadow:0 8px 24px rgba(232,52,138,.35)}
  .btn.pink:hover{background:var(--pink-dark)}
  .btn.pink:disabled{opacity:.6;cursor:default}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);font-size:13.5px;padding:8px 14px;border-radius:10px}
  .err{color:#d9534f;font-size:13.5px;margin-top:8px;min-height:18px;font-weight:600}
  .req{color:var(--pink);font-weight:800}

  .done{text-align:center;padding:36px 18px}
  .done .big{font-size:64px;line-height:1}
  .done h2{justify-content:center;font-size:22px;margin-top:10px}
  .done p{color:var(--muted);font-size:15px}
  .nextbox{margin:16px auto 0;max-width:380px;background:var(--pink-soft);border-radius:14px;padding:12px 16px;font-weight:700;color:var(--pink-dark)}
  .nextbox small{display:block;font-weight:500;color:var(--ink);opacity:.75;margin-top:2px}

  /* admin */
  .stat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .stat>div{background:var(--pink-soft);border-radius:12px;padding:8px 16px;font-size:13px;color:var(--pink-dark);font-weight:600;text-align:center}
  .stat b{display:block;font-size:22px;color:var(--ink)}
  .resp{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
  .resp .who{font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .resp .who .sc{font-weight:500;color:var(--muted);font-size:13px}
  .resp .who .rt{margin-inline-start:auto;font-size:14px}
  .resp .row{font-size:13.5px;margin-top:6px}
  .resp .row b{color:var(--pink-dark);font-weight:700}
  .missing{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .missing span{background:#fff8dc;border:1.5px solid #f6dc7a;color:#6b5300;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600}
  .bar{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:5px}
  .bar .track{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar .fill{height:100%;background:var(--pink);border-radius:99px}
  .bar .n{width:22px;text-align:center;font-weight:700;color:var(--muted)}

  footer{text-align:center;color:var(--muted);font-size:12.5px;padding:18px 0 30px}
  .toast{position:fixed;bottom:18px;inset-inline-start:50%;transform:translateX(50%);background:#111;color:#fff;border-radius:12px;padding:10px 18px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
  .toast.show{opacity:1}
  @media(max-width:520px){
    .scale{gap:5px}.scale button .e{font-size:22px}.scale button .l{font-size:10px}
    header h1{font-size:19px}
  }
  @media print{header:after{display:none}}
</style>
</head>
<body>

<header>
  <div class="in">
    <div class="hrow">
      <span class="logo"><img src="hopa-logo.png" alt="הופה"></span>
      <div>
        <h1 id="heroTitle">איך היה? המשוב שלך חשוב לנו 💛</h1>
        <div class="sub" id="heroSub">משוב על המפגש הראשון של קהילת רכזי הבוגרים · 2 דקות</div>
      </div>
    </div>
    <div class="meet">📅 מפגש #1 · "בוגר אחד, שנה אחת" <small>· זום · 24.8.2026</small></div>
  </div>
</header>

<main>
  <div class="in" id="app"></div>
</main>

<footer>הופה · <a href="https://hopa.org.il" target="_blank">hopa.org.il</a> · קהילת רכזי הבוגרים</footer>
<div class="toast" id="toast"></div>

<script>
var EXEC_URL='https://script.google.com/macros/s/AKfycby7ilGQKB0eypgYMJ0-F4PDgRUlhs12wB5NQVV3_gsm4U1iWec4aNzmeQ8qi7dFFBUoGw/exec';
var GS_SECRET='hopa-nihul-2026';
var KEY_PREFIX='mashov1-';
var ADMIN_PARAM='hopa';        // mashov.html?admin=hopa
var LS_KEY='hopa-mashov1-draft';

var PEOPLE=[
  {n:"מוניק איפרח ממן",s:"עמל רמת דוד"},
  {n:"מור",s:"עמל רמת דוד"},
  {n:"אביחי חריר",s:"עתיד שמיים ק. מוצקין"},
  {n:"זהור אלעוברה",s:"עמל טכנולוגי רהט"},
  {n:"טליה ברנע",s:"שיח' דנון עמקה"},
  {n:"לי ארנן",s:"התיכון החברתי ת\"א"},
  {n:"טלי יונה",s:"אורט צור ברק"},
  {n:"מריה דיאב",s:"אורט כרמל חיפה"},
  {n:"מלשה חנין",s:"אורט כרמל חיפה"},
  {n:"סאמר מיעארי",s:"אלאמאני סחנין"},
  {n:"מוחמד גזאל",s:"אלאמאני סחנין"},
  {n:"היאם אזברגה",s:"דרור נווה מדבר"},
  {n:"ריקי מסס",s:"יוצר עמל אשדוד"},
  {n:"עלי עותמאן",s:"עתיד אבדאע ביר אלמכסור"},
  {n:"טוהר מרסדס כהן",s:"אורט מרום עכו"},
  {n:"ראניה חגו",s:"טכנולוגי לקייה"},
  {n:"לבנה גיל בן חמו",s:"מגשימים כרמיאל"},
  {n:"יעקב גרונספלד",s:"אורט בית הערבה"},
  {n:"מוניר עבדאלהאדי",s:"מנאראת טוראען"},
  {n:"סיגל דדון",s:"אורט אשקלון"},
  {n:"רשא סייד אחמד",s:"ח'טוואת ירכא אבו סנאן"},
  {n:"שירן עוגן",s:"יוצר עתיד פלמחים"},
  {n:"טל מילוא",s:"מרכז תורני נחלים"}
];

var WORKED=[
  "הפתיחה — לירון ונאוה","השיח וההיכרות בחדרים","הסימולציה — בוגר אחד, שנה אחת",
  "שיחת 4 השאלות","ההצצה למאגר המענים","״השנה שלי בדף אחד״","ההצבעות וענן המילים","האווירה והאנשים"
];
var TOPICS=[
  "מלגות","תעסוקה והכשרות","מיצוי זכויות","בניית מאגר הבוגרים שלי","שיחות עם בוגרים — תרגול",
  "כלים דיגיטליים ומעקב","עבודה עם קבוצות וואטסאפ","חיבור לגורמים בקהילה","למידת עמיתים והצלחות"
];
var RATE_LABELS=["ממש לא","פחות","בסדר","טוב","מעולה!"];
var RATE_EMOJI=["😕","😐","🙂","😃","🤩"];

var app=document.getElementById('app');
var qs=new URLSearchParams(location.search);
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(function(){el.classList.remove('show')},1900)}

/* ---------- state ---------- */
var state=load();
function load(){
  try{var s=JSON.parse(localStorage.getItem(LS_KEY));if(s&&s.id)return s}catch(e){}
  return {id:String(Date.now())+'-'+Math.random().toString(36).slice(2,7),
    who:'',whoOther:'',rate:0,useful:0,worked:[],workedOther:'',improve:'',topics:[],topicsOther:'',heart:'',sent:false};
}
function save(){localStorage.setItem(LS_KEY,JSON.stringify(state))}

/* ---------- form ---------- */
function render(){
  if(state.sent){renderDone();return}
  var opts='<option value="">בחרו את השם שלכם…</option>'+
    PEOPLE.map(function(p){return '<option value="'+esc(p.n+' · '+p.s)+'"'+(state.who===p.n+' · '+p.s?' selected':'')+'>'+esc(p.n)+' · '+esc(p.s)+'</option>'}).join('')+
    '<option value="__other"'+(state.who==='__other'?' selected':'')+'>אחר / שם אחר…</option>';

  app.innerHTML=
  '<div class="card">'+
    '<h2><span class="num">1</span>מי ממלא/ת? <span class="req">*</span></h2>'+
    '<p class="hint">כדי שנדע למי להגיד תודה 🙂</p>'+
    '<select id="who">'+opts+'</select>'+
    '<div class="otherwrap'+(state.who==='__other'?' show':'')+'" id="whoOtherWrap"><input type="text" id="whoOther" placeholder="שם + בית ספר" value="'+esc(state.whoOther)+'"></div>'+
  '</div>'+

  '<div class="card">'+
    '<h2><span class="num">2</span>איך היה המפגש בסך הכול? <span class="req">*</span></h2>'+
    '<div class="scale" id="rate">'+scaleBtns(state.rate)+'</div>'+
  '</div>'+

  '<div class="card">'+
    '<h2><span class="num">3</span>עד כמה יצאת עם משהו מעשי לעבודה שלך? <span class="req">*</span></h2>'+
    '<div class="scale" id="useful">'+scaleBtns(state.useful)+'</div>'+
  '</div>'+

  '<div class="card">'+
    '<h2><span class="num">4</span>מה הכי עבד בשבילך?</h2>'+
    '<p class="hint">אפשר לסמן כמה שרוצים</p>'+
    '<div class="chips" id="worked">'+chipBtns(WORKED,state.worked)+'</div>'+
    '<div class="otherwrap show" style="margin-top:10px"><input type="text" id="workedOther" placeholder="משהו נוסף שאהבת? (לא חובה)" value="'+esc(state.workedOther)+'"></div>'+
  '</div>'+

  '<div class="card">'+
    '<h2><span class="num">5</span>דבר אחד לשפר למפגש הבא</h2>'+
    '<textarea id="improve" placeholder="מה היה חסר? מה היית משנה? כל הערה עוזרת לנו">'+esc(state.improve)+'</textarea>'+
  '</div>'+

  '<div class="card">'+
    '<h2><span class="num">6</span>אילו נושאים תרצו במפגשים הבאים?</h2>'+
    '<p class="hint">אפשר לסמן כמה שרוצים</p>'+
    '<div class="chips" id="topics">'+chipBtns(TOPICS,state.topics)+'</div>'+
    '<div class="otherwrap show" style="margin-top:10px"><input type="text" id="topicsOther" placeholder="נושא אחר…" value="'+esc(state.topicsOther)+'"></div>'+
  '</div>'+

  '<div class="card">'+
    '<h2><span class="num">7</span>עוד משהו על הלב? 💛</h2>'+
    '<textarea id="heart" placeholder="מילה טובה, מחשבה, רעיון — הכול מתקבל באהבה (לא חובה)">'+esc(state.heart)+'</textarea>'+
  '</div>'+

  '<div class="send"><button class="btn pink" id="sendBtn">שליחת המשוב 💌</button><div class="err" id="err"></div></div>';

  bind();
}
function scaleBtns(val){
  return RATE_EMOJI.map(function(e,i){
    return '<button type="button" data-v="'+(i+1)+'"'+(val===i+1?' class="on"':'')+'><span class="e">'+e+'</span><span class="l">'+RATE_LABELS[i]+'</span></button>';
  }).join('');
}
function chipBtns(list,sel){
  return list.map(function(t){return '<button type="button" data-t="'+esc(t)+'"'+(sel.indexOf(t)>-1?' class="on"':'')+'>'+esc(t)+'</button>'}).join('');
}
function bind(){
  $('who').onchange=function(){state.who=this.value;$('whoOtherWrap').classList.toggle('show',this.value==='__other');save()};
  $('whoOther').oninput=function(){state.whoOther=this.value;save()};
  bindScale('rate','rate');bindScale('useful','useful');
  bindChips('worked','worked');bindChips('topics','topics');
  $('workedOther').oninput=function(){state.workedOther=this.value;save()};
  $('topicsOther').oninput=function(){state.topicsOther=this.value;save()};
  $('improve').oninput=function(){state.improve=this.value;save()};
  $('heart').oninput=function(){state.heart=this.value;save()};
  $('sendBtn').onclick=submit;
}
function bindScale(id,key){
  var host=$(id);
  Array.prototype.forEach.call(host.querySelectorAll('button'),function(b){
    b.onclick=function(){
      state[key]=Number(b.dataset.v);save();
      Array.prototype.forEach.call(host.querySelectorAll('button'),function(x){x.classList.toggle('on',x===b)});
    };
  });
}
function bindChips(id,key){
  var host=$(id);
  Array.prototype.forEach.call(host.querySelectorAll('button'),function(b){
    b.onclick=function(){
      var t=b.dataset.t,i=state[key].indexOf(t);
      if(i>-1)state[key].splice(i,1);else state[key].push(t);
      save();b.classList.toggle('on');
    };
  });
}

async function submit(){
  var errEl=$('err');errEl.textContent='';
  var who=state.who==='__other'?state.whoOther.trim():state.who;
  if(!who){errEl.textContent='רק שנדע מי — בחרו שם מהרשימה 🙂';$('who').focus();return}
  if(!state.rate){errEl.textContent='חסר דירוג כללי (שאלה 2)';return}
  if(!state.useful){errEl.textContent='חסר דירוג בשאלה 3';return}
  var btn=$('sendBtn');btn.disabled=true;btn.textContent='שולח…';
  var payload={
    id:state.id,ts:new Date().toISOString(),who:who,
    rate:state.rate,useful:state.useful,
    worked:state.worked.concat(state.workedOther.trim()?[state.workedOther.trim()]:[]),
    improve:state.improve.trim(),
    topics:state.topics.concat(state.topicsOther.trim()?[state.topicsOther.trim()]:[]),
    heart:state.heart.trim(),
    meeting:'מפגש רכזי בוגרים #1 · 24.8.2026 · זום'
  };
  try{
    await fetch(EXEC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({action:'intakeSubmit',school:KEY_PREFIX+state.id,json:JSON.stringify(payload)}).toString()});
    state.sent=true;save();renderDone();window.scrollTo({top:0,behavior:'smooth'});
  }catch(e){
    btn.disabled=false;btn.textContent='שליחת המשוב 💌';
    errEl.textContent='לא הצלחנו לשלוח — בדקו חיבור לאינטרנט ונסו שוב. התשובות שלך שמורות.';
  }
}

function renderDone(){
  app.innerHTML=
  '<div class="card done">'+
    '<div class="big">💛</div>'+
    '<h2>תודה! המשוב נשלח</h2>'+
    '<p>כל מילה שכתבת תעזור לנו לבנות מפגשים טובים יותר לקהילה.</p>'+
    '<div class="nextbox">📅 המפגש הבא: 21.10 — נפגשים פנים אל פנים בבני ברק<small>נשלח פרטים והרשמה בקבוצת הוואטסאפ</small></div>'+
    '<p style="margin-top:18px"><a class="btn ghost" href="https://hopa.org.il" target="_blank">🌐 לאתר הופה</a></p>'+
  '</div>';
}

/* ---------- admin (?admin=hopa) ---------- */
function jsonp(params){
  return new Promise(function(res,rej){
    var cb='cb'+Math.random().toString(36).slice(2);
    params=Object.assign({},params,{callback:cb});
    var s=document.createElement('script');
    s.src=EXEC_URL+'?'+new URLSearchParams(params).toString();
    window[cb]=function(d){delete window[cb];s.remove();res(d)};
    s.onerror=function(){delete window[cb];s.remove();rej(new Error('network'))};
    document.head.appendChild(s);
  });
}
async function renderAdmin(){
  $('heroTitle').textContent='משוב מפגש #1 · ניהול';
  $('heroSub').textContent='כל התשובות, חי מהגיליון · למיטל ולצוות';
  document.querySelector('main .in').classList.add('adm');
  app.innerHTML='<div class="card"><p class="hint">טוען תשובות…</p></div>';
  var store;
  try{var r=await jsonp({action:'storeAll',secret:GS_SECRET});if(!r.ok)throw new Error(r.error||'err');store=r.store}
  catch(e){app.innerHTML='<div class="card"><p class="hint">לא הצלחתי לטעון מהגיליון ('+esc(e.message)+'). נסו לרענן.</p></div>';return}
  var items=Object.keys(store).filter(function(k){return k.indexOf('intake_'+KEY_PREFIX)===0})
    .map(function(k){return store[k]||{}}).filter(function(x){return x.who})
    .sort(function(a,b){return String(b.ts).localeCompare(String(a.ts))});

  var avg=function(key){if(!items.length)return'—';return (items.reduce(function(s,x){return s+(Number(x[key])||0)},0)/items.length).toFixed(1)};
  var answered=items.map(function(x){return String(x.who).split(' · ')[0].trim()});
  var missing=PEOPLE.filter(function(p){return answered.indexOf(p.n)===-1});

  var count=function(list,val){return list.filter(function(x){return (x||[]).indexOf?x.indexOf(val)>-1:false}).length};
  var workedAll=items.map(function(x){return x.worked||[]});
  var topicsAll=items.map(function(x){return x.topics||[]});
  var barRow=function(label,n,max){
    var w=max?Math.round(n/max*100):0;
    return '<div class="bar"><span style="width:190px;font-weight:600">'+esc(label)+'</span><span class="track"><span class="fill" style="width:'+w+'%"></span></span><span class="n">'+n+'</span></div>';
  };
  var workedCounts=WORKED.map(function(t){return{t:t,n:count(workedAll,t)}}).sort(function(a,b){return b.n-a.n});
  var topicCounts=TOPICS.map(function(t){return{t:t,n:count(topicsAll,t)}}).sort(function(a,b){return b.n-a.n});
  var wMax=Math.max.apply(null,[1].concat(workedCounts.map(function(x){return x.n})));
  var tMax=Math.max.apply(null,[1].concat(topicCounts.map(function(x){return x.n})));

  app.innerHTML=
  '<div class="card">'+
    '<div class="stat">'+
      '<div>ענו<b>'+items.length+'</b></div>'+
      '<div>דירוג כללי<b>'+avg('rate')+'</b></div>'+
      '<div>ערך מעשי<b>'+avg('useful')+'</b></div>'+
      '<div>טרם ענו<b>'+missing.length+'</b></div>'+
    '</div>'+
    '<div style="text-align:left"><button class="btn ghost" onclick="location.reload()">🔄 רענון</button> <button class="btn ghost" id="csvBtn">⬇️ CSV</button></div>'+
  '</div>'+
  '<div class="card"><h2>מה הכי עבד</h2>'+workedCounts.map(function(x){return barRow(x.t,x.n,wMax)}).join('')+'</div>'+
  '<div class="card"><h2>נושאים מבוקשים למפגשים הבאים</h2>'+topicCounts.map(function(x){return barRow(x.t,x.n,tMax)}).join('')+'</div>'+
  '<div class="card"><h2>טרם ענו ('+missing.length+')</h2><div class="missing">'+
    (missing.length?missing.map(function(p){return '<span>'+esc(p.n)+' · '+esc(p.s)+'</span>'}).join(''):'<span style="background:#e8f8ef;border-color:#b8e6c9;color:#14613b">כולם ענו! 🎉</span>')+
  '</div></div>'+
  '<div class="card"><h2>כל התשובות ('+items.length+')</h2>'+
    (items.length?items.map(respCard).join(''):'<p class="hint">עדיין אין תשובות — שתפו את הקישור בקבוצה 🙂</p>')+
  '</div>';

  $('csvBtn').onclick=function(){
    var head=['שם','דירוג כללי','ערך מעשי','מה עבד','לשפר','נושאים','על הלב','נשלח'];
    var rows=items.map(function(x){return [x.who,x.rate,x.useful,(x.worked||[]).join(' | '),x.improve,(x.topics||[]).join(' | '),x.heart,x.ts]});
    var csv='﻿'+[head].concat(rows).map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='mashov-mifgash1.csv';a.click();
  };
}
function respCard(x){
  var stars=function(n){return RATE_EMOJI[Math.min(4,Math.max(0,Number(n)-1))]+' '+n+'/5'};
  return '<div class="resp">'+
    '<div class="who">'+esc(String(x.who).split(' · ')[0])+' <span class="sc">'+esc(String(x.who).split(' · ').slice(1).join(' · '))+'</span>'+
    '<span class="rt">כללי '+stars(x.rate)+' · מעשי '+stars(x.useful)+'</span></div>'+
    ((x.worked||[]).length?'<div class="row"><b>עבד:</b> '+esc(x.worked.join(' · '))+'</div>':'')+
    (x.improve?'<div class="row"><b>לשפר:</b> '+esc(x.improve)+'</div>':'')+
    ((x.topics||[]).length?'<div class="row"><b>נושאים:</b> '+esc(x.topics.join(' · '))+'</div>':'')+
    (x.heart?'<div class="row"><b>💛:</b> '+esc(x.heart)+'</div>':'')+
  '</div>';
}

if(qs.get('admin')===ADMIN_PARAM)renderAdmin();else render();
</script>
</body>
</html>
