<!doctype html>
<html lang="he" dir="rtl">
<head>
<script src="staff-code.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שליחת בקשות לרכזים · הופה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#E8348A; --pink-dark:#c02673; --pink-soft:#fde7f2;
    --yellow:#FFF200; --yellow-soft:#fffbcc;
    --ink:#2b2b33; --muted:#8a8a95; --line:#ece7ef;
    --bg:#f6f2f7; --card:#ffffff;
    --ok:#22b573; --ok-soft:#e6f8ef; --wa:#25D366;
    --shadow:0 4px 18px rgba(43,43,51,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Rubik',system-ui,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;min-height:100dvh}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  textarea{font-family:inherit;color:inherit;font-size:16px}
  a{color:var(--pink-dark)}
  .ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px 60px}

  .hero{background:linear-gradient(125deg,var(--pink) 0%,var(--pink-dark) 100%);color:#fff;border-radius:0 0 26px 26px;padding:18px 16px 22px;box-shadow:var(--shadow)}
  .hero-in{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .logobox{background:#fff;border-radius:13px;padding:6px 12px;box-shadow:0 4px 14px rgba(0,0,0,.18);display:inline-flex;align-items:center;flex-shrink:0}
  .logobox img{height:32px;display:block;max-width:140px}
  .hero h1{margin:0;font-size:20px;font-weight:800;line-height:1.25}
  .hero p{margin:2px 0 0;opacity:.92;font-size:14px}

  .card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px;margin-top:14px}
  .hint{color:var(--muted);font-size:13px;margin:0}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{background:var(--pink-soft);border-radius:14px;padding:10px;text-align:center}
  .stat b{display:block;font-size:24px;font-weight:800;color:var(--pink-dark);line-height:1.1}
  .stat span{font-size:12px;color:var(--ink)}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .chip{border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;background:#fff}
  .chip.on{background:var(--pink);border-color:var(--pink);color:#fff}

  details.tpl{margin-top:14px}
  details.tpl summary{cursor:pointer;font-weight:700;font-size:15px}
  .tpl label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
  .tpl textarea{width:100%;min-height:110px;border:2px solid var(--line);border-radius:12px;padding:10px;outline:none}
  .tpl textarea:focus{border-color:var(--pink)}

  .school{border-right:6px solid var(--line)}
  .school.sent{border-right-color:var(--ok)}
  .shead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
  .shead h3{margin:0;font-size:17px;font-weight:700}
  .meta{font-size:13px;color:var(--muted)}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .tag{font-size:12px;border-radius:999px;padding:2px 10px;font-weight:600}
  .tag.ok{background:var(--ok-soft);color:#13804f}
  .tag.no{background:var(--yellow-soft);color:#7a6a00}
  .tag.sent{background:var(--ok);color:#fff}
  .msgs{display:grid;gap:8px;margin-top:12px}
  .msg{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fcfafd}
  .msg .mt{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .msg .mt b{font-size:14px}
  .msg pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:13.5px;margin:8px 0 0;display:none}
  .msg.open pre{display:block}
  .btn{display:inline-flex;align-items:center;gap:5px;border-radius:12px;padding:8px 13px;font-weight:600;font-size:14px;text-decoration:none;line-height:1.2}
  .b1{background:var(--pink);color:#fff}
  .b2{background:#fff;border:2px solid var(--line);color:var(--ink)}
  .bwa{background:var(--wa);color:#fff}
  .bok{background:var(--ok-soft);color:#13804f}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .small{font-size:12.5px;padding:6px 10px}
  .foot{text-align:center;margin-top:24px;font-size:13px;color:var(--muted)}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;transition:transform .25s;z-index:20;visibility:hidden}
  #toast.on{transform:translateX(-50%) translateY(0);visibility:visible}
  @media (max-width:420px){ .hero h1{font-size:18px} .logobox img{height:26px} }
</style>
</head>
<body>
<header class="hero">
  <div class="hero-in">
    <div>
      <h1>שליחת בקשות לרכזי הבוגרים</h1>
      <p>תוכנית עבודה · דרך דוד · בוגרים בעסקים</p>
    </div>
    <a class="logobox" href="https://hopa.org.il" target="_blank" rel="noopener"><img src="hopa-logo.png" alt="הופה"></a>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <div class="stats">
      <div class="stat"><b id="sAll">–</b><span>בתי ספר</span></div>
      <div class="stat"><b id="sPlan">–</b><span>לא הגישו תוכנית</span></div>
      <div class="stat"><b id="sSent">–</b><span>נשלח</span></div>
    </div>
    <div class="filters" id="filters"></div>
    <p class="hint" id="loadHint" style="margin-top:10px">טוען מהגיליון מי הגיש…</p>

    <details class="tpl">
      <summary>✏️ עריכת הנוסחים</summary>
      <p class="hint" style="margin-top:6px">אפשר לכתוב <b>{רכז}</b>, <b>{בית ספר}</b> ו-<b>{קישור}</b>, והם יוחלפו לכל בית ספר. השינויים נשמרים בגיליון לכל הצוות.</p>
      <label for="t_open">פתיחה</label><textarea id="t_open"></textarea>
      <label for="t_plan">1. תוכנית עבודה (רק למי שלא הגיש)</label><textarea id="t_plan"></textarea>
      <label for="t_dd">2. דרך דוד</label><textarea id="t_dd"></textarea>
      <label for="t_esek">3. בוגרים בעסקים</label><textarea id="t_esek"></textarea>
      <label for="t_mipui">הערה על שאלון המיפוי (בסוף ההודעה)</label><textarea id="t_mipui"></textarea>
      <label for="t_close">סיום</label><textarea id="t_close"></textarea>
      <div class="row"><button class="btn b1" id="tplSave">💾 שמירת הנוסחים</button><button class="btn b2" id="tplReset">↩ לנוסח המקורי</button></div>
    </details>
  </section>

  <div id="list"></div>
  <p class="foot">עמותת הופה · <a href="https://hopa.org.il" target="_blank" rel="noopener">hopa.org.il</a></p>
</main>
<div id="toast"></div>

<script>
const EXEC_URL = 'https://script.google.com/macros/s/AKfycby7ilGQKB0eypgYMJ0-F4PDgRUlhs12wB5NQVV3_gsm4U1iWec4aNzmeQ8qi7dFFBUoGw/exec';
const STORE_KEY = 'bakashot_send';
const BASE_URL = 'https://meytalp-dev.github.io/hopa-nihul/';

/* שמות בתי הספר כמו בטופס התקציב (taktziv.html) · רכז/ת כמו בטבלת בתי הספר (batei-sefer.html) */
const SCHOOLS = [
  {n:'אורט אדיבי אשקלון', c:'סיגל דדון', p:'053-778-0196', m:'רנל אדרי', mp:'053-366-6830'},
  {n:'אורט בית הערבה', c:'יעקב גרונספלד', p:'054-699-5254', m:'מיטל פלג / רווית גל', mp:'050-399-3021'},
  {n:'אורט כרמל חיפה', c:'חנין מלשה', p:'052-599-4110', m:'וליד דאו', mp:'054-459-7762', ar:1},
  {n:'אורט מרום עכו', c:'טוהר מרסדס כהן', p:'050-828-2032', m:'הדר בן סימון', mp:'052-467-7981'},
  {n:'אורט צור ברק', c:'טלי יונה', p:'054-808-0808', m:'סיגל כהן', mp:'054-530-3604'},
  {n:'דרור גליל', c:'רינה שריד', p:'054-673-8232', m:'עינת וינברן', mp:'054-673-5214'},
  {n:'דרור נווה מדבר', c:'היאם אזברגה', p:'050-422-2996', m:'עבד אבו אלקיעאן', mp:'052-587-3735', ar:1},
  {n:'התיכון החברתי מצפה רמון', c:'', p:'', m:'ענבל לוי', mp:'054-673-8573'},
  {n:'התיכון החברתי תל אביב יפו', c:'לי ארנן', p:'050-345-0755', m:'יפית שפירא', mp:'054-974-7128'},
  {n:'טכנולוגי אלמסתקבל תל שבע', c:'', p:'', m:'', mp:'', noq:1},
  {n:'טכנולוגי לקייה', c:'ראניה חגו', p:'050-470-8424', m:'עלי אלחואגרה', mp:'052-296-7194', ar:1},
  {n:'מנאראת טורעאן', c:'מוניר זרעיני', p:'054-695-9114', m:'עלי עדאווי', mp:'054-571-4431', ar:1},
  {n:'מרכז תורני טכנולוגי נחלים', c:'טל מילוא', p:'058-404-0494', m:'אליהו טובול', mp:'052-811-9499'},
  {n:'עמל טכנולוגי רהט', c:'זהור אלעוברה', p:'054-791-8502', m:'הוזייל ראיד', mp:'054-649-3125', ar:1},
  {n:'עמל רמת דוד', c:'מוניק איפרח ממן', p:'050-988-3385', m:'שי סודרי', mp:'054-993-3445'},
  {n:'עתיד אבדאע ביר אלמכסור', c:'עלי עותמאן', p:'050-955-1109', m:'ופיק אגבאריה', mp:'054-993-3462', ar:1},
  {n:'עתיד יוצר מגשימים', c:'לבנה בן חמו', p:'050-440-0956', m:'שיראל פרץ', mp:'052-657-2714'},
  {n:'עתיד יוצר מגשימים בית שאן', c:'שגית הדר', p:'050-593-9223', m:'יוחנן כהן', mp:'058-555-1381'},
  {n:'עתיד שמיים מוצקין', c:'אביחי חריר', p:'050-313-9150', m:'משה בחר', mp:'052-946-3874'},
  {n:'תיכון ח׳טוואת ירכא אבו סנאן', c:'רשא סייד אחמד', p:'050-545-5077', m:'נסרין נבואני', mp:'050-871-1450', ar:1},
  {n:'תיכון חושן', c:'ברכי בר לב', p:'052-869-7690', m:'שרי שמבורסקי', mp:'052-393-6126'},
  {n:'תיכון טכנולוגי אלאמאני סחנין', c:'סוזן קאסום', p:'054-796-1329', m:'מוחמד גזאל', mp:'050-752-7765', ar:1},
  {n:'תיכון יוצר עמל טכנולוגי אשדוד', c:'ריקי מסס', p:'054-444-1300', m:'מגי רביבו', mp:'052-833-4601'},
  {n:'תיכון יוצר עתיד בנות ג׳וליס', c:'בהייה מולא', p:'054-669-9072', m:'שאדיה נבואני', mp:'054-245-4243', ar:1},
  {n:'תיכון יוצר עתיד פלמחים', c:'שירן עוגן', p:'054-978-9029', m:'ד״ר ורד אזולאי יהב', mp:'052-663-1135'},
  {n:'תיכון שיח', c:'טליה ברנע', p:'054-806-9898', m:'טליה ברנע', mp:'054-806-9898'}
];
/* הגישו תוכנית מחוץ לטופס התקציב: בפורטל של הופה דש (אוג׳–ספט׳) או בקובץ */
const PLAN_ELSEWHERE = {
  'התיכון החברתי תל אביב יפו':'בפורטל 4.8', 'תיכון ח׳טוואת ירכא אבו סנאן':'בפורטל 16.8',
  'עתיד יוצר מגשימים':'בפורטל 25.8', 'עתיד שמיים מוצקין':'בפורטל 8.9', 'אורט בית הערבה':'בקובץ'
};

const DEFAULT_TPL = {
  open: 'שלום לצוות {בית ספר} 😊\nכמה דברים קטנים מהופה לגבי הבוגרים שלכם:',
  plan: 'תוכנית עבודה לבוגרים לשנת תשפ״ז, על התקציב של 10,000 ₪. הטופס קצר: כותבים מה מתכננים לעשות וכמה זה עולה, וזהו.\nהקישור של בית הספר:\n{קישור}',
  dd: 'דרך דוד — יש בוגרים שרוצים להתגייס ונתקלים בקושי, קיבלו פטור או דחייה, או צריכים ליווי בדרך לשירות? אפשר להעביר להם את טופס ההפניה הקצר:\n{קישור}',
  esek: 'בוגרים בעסקים — יש לכם בוגרים שפתחו עסק? אנחנו אוספים את העסקים של הבוגרים כדי לפרסם אותם. אפשר להעביר להם את הטופס:\n{קישור}',
  mipui: '📝 לידיעתכם: השבוע אנחנו נשלח לבוגרים את שאלון המיפוי של הופה. אם בוגרים פונים אליכם לגבי השאלון, זה הקישור (בוחרים בו את בית הספר מהרשימה):\n{קישור}',
  close: 'אם יש שאלה, אני כאן.\nתודה רבה! 🙏\nצוות הופה'
};
const NUM = ['1️⃣','2️⃣','3️⃣'];

let DATA = { tpl:null, sent:{} };   // נשמר בגיליון תחת bakashot_send
let PLAN_FORM = {};                  // בית ספר → תאריך הגשה בטופס התקציב
let FILTER = 'all';
let OPEN = {};

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits = p => String(p||'').replace(/\D/g,'');
const waNum = p => '972' + digits(p).replace(/^0/,'');
const firstName = c => String(c||'').split(/\s+/)[0] || '';
const tpl = () => Object.assign({}, DEFAULT_TPL, DATA.tpl || {});
const fmtD = iso => { try{ const d=new Date(iso); return d.getDate()+'.'+(d.getMonth()+1); }catch(e){ return ''; } };

function planStatus(n){
  if (PLAN_FORM[n]) return 'בטופס '+fmtD(PLAN_FORM[n]);
  return PLAN_ELSEWHERE[n] || '';
}
function links(s){
  const q = encodeURIComponent(s.n);
  let dd = BASE_URL+'derech-david.html?school='+q;
  if (s.c) dd += '&rakez='+encodeURIComponent(s.c);
  if (s.p) dd += '&tel='+digits(s.p);
  const mipui = 'https://bogrim.hopa.org.il' + (s.ar ? '\nבערבית: https://bogrim.hopa.org.il/ar' : '');
  return { plan: BASE_URL+'taktziv.html?school='+q, dd, esek: BASE_URL+'bogrim-asakim.html', mipui };
}
function fill(t, s, link){
  return t.replace(/\{רכז\}/g, firstName(s.c)).replace(/\{בית ספר\}/g, s.n).replace(/\{קישור\}/g, link||'')
          .replace(/^היי  /,'היי ').replace(/היי \s*😊/,'היי 😊');
}
/* שאלון המיפוי — הערה בסוף ההודעה, לא בקשה ממוספרת. תל שבע לא ברשימת בתי הספר של השאלון */
function mipuiNote(s){ return s.noq ? '' : fill(tpl().mipui, s, links(s).mipui); }
function parts(s){
  const L = links(s), T = tpl(), out = [];
  if (!planStatus(s.n)) out.push({k:'plan', title:'תוכנית עבודה', text:fill(T.plan,s,L.plan)});
  out.push({k:'dd', title:'דרך דוד', text:fill(T.dd,s,L.dd)});
  out.push({k:'esek', title:'בוגרים בעסקים', text:fill(T.esek,s,L.esek)});
  return out;
}
function combined(s){
  const T = tpl();
  const body = parts(s).map((p,i)=>NUM[i]+' '+p.text).join('\n\n');
  const note = mipuiNote(s);
  return fill(T.open,s) + '\n\n' + body + (note ? '\n\n' + note : '') + '\n\n' + fill(T.close,s);
}
function single(s, p){ return fill(tpl().open,s).replace(/כמה דברים קטנים/,'משהו קטן') + '\n\n' + p.text + '\n\n' + fill(tpl().close,s); }

/* ── גיליון ── */
function jsonpOnce(params, tmo){
  return new Promise((res,rej)=>{
    const cb='cb'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    const timer=setTimeout(()=>{ window[cb]=()=>{}; s.remove(); rej(new Error('timeout')); }, tmo);
    window[cb]=d=>{clearTimeout(timer); delete window[cb]; s.remove(); res(d);};
    s.src=EXEC_URL+'?'+new URLSearchParams(Object.assign({callback:cb},params)).toString();
    s.onerror=()=>{clearTimeout(timer); delete window[cb]; s.remove(); rej(new Error('network'));};
    document.head.appendChild(s);
  });
}
async function fetchOnce(params, tmo){
  const ctl = new AbortController(); const timer = setTimeout(()=>ctl.abort(), tmo);
  try{
    const r = await fetch(EXEC_URL+'?'+new URLSearchParams(params).toString(), {credentials:'omit', cache:'no-store', redirect:'follow', signal:ctl.signal});
    const txt = await r.text();
    try{ return JSON.parse(txt); }catch(e){ throw new Error('bad response '+r.status); }
  } finally { clearTimeout(timer); }
}
async function jsonp(params){
  let err;
  for (let i=1;i<=4;i++){
    try{ return await fetchOnce(params, 25000); } catch(e){ err=e; }
    try{ return await jsonpOnce(params, 25000); } catch(e){ err=e; }
  }
  throw err;
}
let saveT;
function save(msg){
  clearTimeout(saveT);
  saveT = setTimeout(async()=>{
    try{
      await fetch(EXEC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:new URLSearchParams({action:'storeSet',secret:GS_SECRET,key:STORE_KEY,json:JSON.stringify(DATA)}).toString()});
      if (msg) toast(msg);
    }catch(e){ toast('שגיאה בשמירה — בדקו אינטרנט'); }
  }, 300);
}
async function load(){
  try{
    const r = await jsonp({action:'storeAll', secret:GS_SECRET});
    if (!r.ok) throw new Error(r.error||'err');
    const st = r.store || {};
    Object.keys(st).forEach(k=>{
      const m = k.match(/^intake_תקציב · (.+)$/); if(!m) return;
      let v = st[k]; try{ if(typeof v==='string') v=JSON.parse(v); }catch(e){ v=null; }
      if (v && v.total) PLAN_FORM[m[1]] = v.submittedAt || v.ts || '1';
    });
    if (st[STORE_KEY]) { let v=st[STORE_KEY]; try{ if(typeof v==='string') v=JSON.parse(v); }catch(e){} if(v&&typeof v==='object') DATA = Object.assign({tpl:null,sent:{}}, v); }
    $('loadHint').textContent = 'עודכן מהגיליון עכשיו.';
  }catch(e){
    if (window.staffCodeFail && staffCodeFail(e, $('list'))) { $('loadHint').textContent=''; return; }
    $('loadHint').textContent = 'לא הצלחתי לטעון מהגיליון — מוצג לפי הידוע ב-1.11. רעננו כדי לנסות שוב.';
    ['עתיד אבדאע ביר אלמכסור','טכנולוגי לקייה','אורט צור ברק','אורט כרמל חיפה','תיכון טכנולוגי אלאמאני סחנין'].forEach(n=>PLAN_FORM[n]='1');
  }
  fillTpl(); render();
}

/* ── תצוגה ── */
function fillTpl(){ const T=tpl(); ['open','plan','dd','esek','mipui','close'].forEach(k=>$('t_'+k).value=T[k]); }
function render(){
  const noPlan = SCHOOLS.filter(s=>!planStatus(s.n)).length;
  const sent = SCHOOLS.filter(s=>DATA.sent[s.n]).length;
  $('sAll').textContent = SCHOOLS.length; $('sPlan').textContent = noPlan; $('sSent').textContent = sent;
  const F = [['all','הכל'],['todo','טרם נשלח'],['sent','נשלח'],['noplan','לא הגישו תוכנית']];
  $('filters').innerHTML = F.map(([k,t])=>`<button class="chip${FILTER===k?' on':''}" data-f="${k}">${t}</button>`).join('');
  const list = SCHOOLS.filter(s=> FILTER==='all' || (FILTER==='todo'&&!DATA.sent[s.n]) || (FILTER==='sent'&&DATA.sent[s.n]) || (FILTER==='noplan'&&!planStatus(s.n)));
  $('list').innerHTML = list.map(s=>{
    const i = SCHOOLS.indexOf(s), ps = planStatus(s.n), sn = DATA.sent[s.n];
    const msgs = [{k:'all', title:'⭐ הודעה אחת עם הכל', text:combined(s)}].concat(parts(s).map(p=>({k:p.k, title:p.title, text:single(s,p)})));
    if (!s.noq) msgs.push({k:'mipui', title:'שאלון מיפוי', text:single(s,{text:mipuiNote(s)})});
    return `<section class="card school${sn?' sent':''}">
      <div class="shead">
        <div>
          <h3>${esc(s.n)}</h3>
          <div class="meta">רכז/ת: ${s.c?esc(s.c)+' · <span class="ltr">'+esc(s.p)+'</span>':'אין פרטים בטבלת בתי הספר'}</div>
          <div class="meta">מנהל/ת: ${s.m?esc(s.m)+' · <span class="ltr">'+esc(s.mp)+'</span>':'אין פרטים בטבלת בתי הספר'}</div>
          <div class="tags">
            ${ps?`<span class="tag ok">✓ תוכנית הוגשה (${esc(ps)})</span>`:'<span class="tag no">תוכנית עבודה חסרה</span>'}
            ${s.noq?'<span class="tag no">לא ברשימת שאלון המיפוי</span>':''}
            ${sn?`<span class="tag sent">נשלח ${esc(fmtD(sn))}</span>`:''}
          </div>
        </div>
        <div class="row" style="margin:0">
          ${s.p?`<a class="btn bwa small" href="https://wa.me/${waNum(s.p)}" target="_blank" rel="noopener">💬 רכז/ת</a>`:''}
          ${s.mp&&s.mp!==s.p?`<a class="btn bwa small" href="https://wa.me/${waNum(s.mp)}" target="_blank" rel="noopener">💬 מנהל/ת</a>`:''}
        </div>
      </div>
      <div class="msgs">
        ${msgs.map(m=>{ const id=i+'_'+m.k; return `<div class="msg${OPEN[id]?' open':''}">
          <div class="mt"><b>${esc(m.title)}</b>
            <span class="row" style="margin:0"><button class="btn b2 small" data-tg="${id}">${OPEN[id]?'הסתרה':'👁 הצגה'}</button><button class="btn b1 small" data-cp="${id}">📋 העתק</button></span>
          </div><pre>${esc(m.text)}</pre></div>`; }).join('')}
      </div>
      <div class="row">
        ${sn?`<button class="btn b2 small" data-un="${i}">↩ ביטול הסימון</button>`:`<button class="btn bok small" data-sent="${i}">✔ סימנתי שנשלח</button>`}
      </div>
    </section>`;
  }).join('') || '<section class="card"><p class="hint">אין בתי ספר בסינון הזה.</p></section>';
}
function msgText(id){
  const [i,k] = id.split('_'), s = SCHOOLS[+i];
  if (k==='all') return combined(s);
  if (k==='mipui') return single(s,{text:mipuiNote(s)});
  const p = parts(s).find(x=>x.k===k); return p ? single(s,p) : '';
}
async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); return true; } catch(e) {}
  try { const ta=document.createElement('textarea'); ta.value=txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); ta.remove(); if(ok) return true; } catch(e) {}
  try { prompt('העתיקו את ההודעה:', txt); } catch(e) {}
  return false;
}
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),2000); }

document.addEventListener('click', async e=>{
  const b = e.target.closest('button'); if(!b) return;
  if (b.dataset.f){ FILTER=b.dataset.f; render(); }
  else if (b.dataset.tg){ OPEN[b.dataset.tg]=!OPEN[b.dataset.tg]; render(); }
  else if (b.dataset.cp){ if (await copyText(msgText(b.dataset.cp))) toast('הועתק ✓ — עכשיו פתחו צ׳אט והדביקו'); }
  else if (b.dataset.sent){ DATA.sent[SCHOOLS[+b.dataset.sent].n]=new Date().toISOString(); render(); save('סומן ✓'); }
  else if (b.dataset.un){ delete DATA.sent[SCHOOLS[+b.dataset.un].n]; render(); save('הסימון בוטל'); }
  else if (b.id==='tplSave'){ DATA.tpl={}; ['open','plan','dd','esek','mipui','close'].forEach(k=>DATA.tpl[k]=$('t_'+k).value); render(); save('הנוסחים נשמרו ✓'); }
  else if (b.id==='tplReset'){ DATA.tpl=null; fillTpl(); render(); save('חזרנו לנוסח המקורי'); }
});

load();
</script>
</body>
</html>
