function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(function(){e.classList.remove('show')},1900)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

function jsonp(params,tmo){
  return new Promise(function(res,rej){
    var cb='cb'+Math.random().toString(36).slice(2);
    params=Object.assign({},params,{callback:cb});
    var s=document.createElement('script');
    var t=setTimeout(function(){cl();rej(new Error('timeout'))},tmo||25000);
    function cl(){try{delete window[cb]}catch(e){window[cb]=undefined}s.remove();clearTimeout(t)}
    window[cb]=function(d){cl();res(d)};
    s.src=EXEC_URL+'?'+new URLSearchParams(params).toString();
    s.onerror=function(){cl();rej(new Error('network'))};
    document.head.appendChild(s);
  });
}
function delay(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function jsonpRetry(p,tries,onA){
  var e;
  for(var i=1;i<=(tries||5);i++){
    if(onA)onA(i);
    try{var r=await jsonp(p,25000);if(r&&r.ok)return r;if(r&&r.error==='unauthorized')throw new Error('unauthorized');e=new Error((r&&r.error)||'שגיאת שרת')}catch(x){if(x.message==='unauthorized')throw x;e=x}
    await delay(800+i*700);
  }
  throw e||new Error('נכשל');
}

  try{var s=JSON.parse(lsGet(LS_KEY));if(s&&s.id)return s}catch(e){}
  return {id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),

}

      SCHOOLS.map(function(s){return '<option'+(s===state.school?' selected':'')+'>'+esc(s)+'</option>'}).join('')+'</select></div></div></div>'+
  '<div class="card"><h2><span class="num">2</span>איך היה החלק של הופה בסך הכול? <span class="req">*</span></h2><div class="scale" id="rate">'+scaleBtns(state.rate)+'</div></div>'+
  '<div class="card"><h2><span class="num">3</span>עד כמה ברור לך מה עושים עד 4.11? <span class="req">*</span></h2><div class="scale" id="clear">'+scaleBtns(state.clear)+'</div></div>'+
  '<div class="card"><h2><span class="num">4</span>מה הכי עבד?</h2><p class="hint">אפשר לסמן כמה שרוצים</p>'+
    '<div class="chips" id="worked">'+chipBtns(WORKED,state.worked)+'</div></div>'+
  '<div class="card"><h2><span class="num">5</span>דבר אחד לשפר</h2>'+
    '<textarea id="improve" maxlength="600" placeholder="מה היה חסר? מה היית משנה?">'+esc(state.improve)+'</textarea></div>'+
  '<div class="card"><h2><span class="num">6</span>במה הכי תרצו עזרה לקראת 4.11?</h2>'+
    '<textarea id="help" maxlength="600" placeholder="רכיב, שאלה, משהו שנתקעתם בו">'+esc(state.help)+'</textarea></div>'+
  '<div class="card"><h2><span class="num">7</span>האם תרצו להציג את תוכנית העבודה שלכם בזום, ללמידת עמיתים?</h2>'+
    '<div class="chips" id="present">'+chipBtns(PRESENT_L,state.present?[state.present]:[])+'</div></div>'+
  '<div class="card"><h2><span class="num">8</span>עוד משהו על הלב?</h2>'+
    '<textarea id="heart" maxlength="600" placeholder="מילה טובה, מחשבה, רעיון">'+esc(state.heart)+'</textarea></div>'+
  '<div class="send"><button class="btn pink" id="sendBtn">שליחת המשוב</button><div class="err" id="err"></div>'+
    '<a class="helpbtn" id="helpBtn" href="'+helpHref()+'"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>נתקלתם בבעיה? שלחו הודעה</a></div>';

  ['who','improve','help','heart'].forEach(function(k){
    $(k).addEventListener('input',function(){state[k]=this.value;save();$('helpBtn').href=helpHref()});
  });
  $('school').addEventListener('change',function(){state.school=this.value;save();$('helpBtn').href=helpHref()});
  ['rate','clear'].forEach(function(k){
    [].slice.call($(k).children).forEach(function(b){
      b.onclick=function(){state[k]=Number(b.dataset.v);save();
        [].slice.call($(k).children).forEach(function(x){x.classList.toggle('on',x===b)})};
    });
  });
  [].slice.call($('worked').children).forEach(function(b){
    b.onclick=function(){var v=b.dataset.v,a=state.worked,i=a.indexOf(v);
      if(i>-1)a.splice(i,1);else a.push(v);b.classList.toggle('on');save()};
  });
  [].slice.call($('present').children).forEach(function(b){
    b.onclick=function(){state.present=state.present===b.dataset.v?'':b.dataset.v;save();
      [].slice.call($('present').children).forEach(function(x){x.classList.toggle('on',x.dataset.v===state.present)})};
  });
  $('sendBtn').onclick=submit;
}

async function submit(){
  var btn=$('sendBtn'),e=$('err');e.textContent='';
  if(!state.who.trim()||!state.school){e.textContent='צריך שם ובית ספר.';return}
  if(!state.rate||!state.clear){e.textContent='שני הדירוגים (2 ו-3) חובה.';return}
  btn.disabled=true;btn.textContent='שולח…';
  var payload={who:state.who.trim(),school:state.school,rate:state.rate,clear:state.clear,worked:state.worked,
    improve:state.improve.trim(),help:state.help.trim(),heart:state.heart.trim(),present:state.present||'',ts:new Date().toISOString(),
    meeting:'כנס רכזים חברתיים 21.10.2026 · בני ברק'};
  var params={action:'intakeSubmit',school:KEY_PREFIX+state.id,json:JSON.stringify(payload)};
  try{
    if(new URLSearchParams(params).toString().length>6500)throw new Error('too-long');
    await jsonpRetry(params,5,function(a){if(a>1)btn.textContent='שולח… ('+a+')'});
    state.sent=true;save();renderDone();scrollTo({top:0,behavior:'smooth'});
  }catch(x){
    try{
      await fetch(EXEC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(params).toString()});
      state.sent=true;save();renderDone();scrollTo({top:0,behavior:'smooth'});
    }catch(x2){
      btn.disabled=false;btn.textContent='שליחת המשוב';
      e.textContent='לא הצלחנו לשלוח. בדקו אינטרנט ונסו שוב, התשובות שמורות.';
    }
  }
}
function renderDone(){
  app.innerHTML='<div class="card done"><div class="ic"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h2>תודה!</h2>'+
    '<p>כל מילה כאן נכנסת לתכנון המפגש הבא.</p>'+
    '<div class="nextbox">4.11.2026 · זום<small>תבואו עם הבסיס לתוכנית העבודה שהתחלתם לבנות בכנס.</small></div>'+
    '<p style="margin-top:14px"><a href="raayonot-2110.html" target="_blank" rel="noopener" style="color:#E6007E;font-weight:700">לריכוז הרעיונות מהשולחנות</a>: היו המון רעיונות, איחדנו כפילויות והתאמנו אותם לצרכים שלכם.</p></div>';
}

/* ---------- תצוגת התוצאות (?admin=hopa) ---------- */
function norm(s){return String(s||'').replace(/[\s'"׳״\-.,()]/g,'').toLowerCase()}
function sameName(a,b){
  if(norm(a)===norm(b))return true;
  a=String(a||'').trim().split(/\s+/).map(norm).filter(Boolean);b=String(b||'').trim().split(/\s+/).map(norm).filter(Boolean);
  if(!a.length||!b.length)return false;
  /* רק שם פרטי — מספיק שהוא שם פרטי של השני (הקורא בודק שזה אותו בית ספר) */
  if(a.length===1||b.length===1)return a[0]===b[0];
  /* שם פרטי + שם משפחה, בכל סדר */
  var fa=a[0],la=a[a.length-1],fb=b[0],lb=b[b.length-1];
  return (fa===fb&&la===lb)||(fa===lb&&la===fb);
}
function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('הועתק')},function(){fb()});return}
  fb();
  function fb(){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('הועתק')}catch(e){toast('לא הצלחתי להעתיק')}ta.remove()}
}
async function renderAdmin(){
  $('heroTitle').textContent='משוב · תוצאות';
  $('heroSub').textContent='כנס הרכזים החברתיים 21.10 · חי מהגיליון';
  $('heroMeet').textContent='למיטל ולצוות';
  $('wrap').classList.add('adm');$('hin').classList.add('adm');
  app.innerHTML='<div class="card"><p class="hint" id="ls">טוען…</p></div>';
  var store;
  try{
    var r=await jsonpRetry({action:'storeAll',secret:GS_SECRET},6,function(a){var el=$('ls');if(el)el.textContent=a===1?'טוען…':'ניסיון '+a+'/6…'});
    if(r.public)throw new Error('unauthorized');store=r.store||{};
  }catch(e){if(window.staffCodeFail&&staffCodeFail(e,app))return;app.innerHTML='<div class="card"><p class="hint">לא נטען ('+esc(e.message)+'). <button class="btn ghost" onclick="location.reload()">רענון</button></p></div>';return}

  var items=Object.keys(store).filter(function(k){return k.indexOf('intake_'+KEY_PREFIX)===0})
    .map(function(k){return store[k]||{}}).filter(function(x){return x.who&&!x.del})
    .sort(function(a,b){return String(b.ts).localeCompare(String(a.ts))});
  var avg=function(k){return items.length?(items.reduce(function(s,x){return s+(Number(x[k])||0)},0)/items.length).toFixed(1):'—'};
  var cnt=function(v){return items.filter(function(x){return (x.worked||[]).indexOf(v)>-1}).length};
  var wMax=Math.max.apply(null,[1].concat(WORKED.map(cnt)));

  /* מי טרם מילא: הצלבה גמישה לפי שם, ובאותו בית ספר גם לפי שם פרטי */
  var missing=REG.filter(function(p){
    return !items.some(function(x){return sameName(x.who,p.n)&&(x.school===p.s||norm(x.who)===norm(p.n))});
  });
  var extra=items.filter(function(x){return !REG.some(function(p){return sameName(x.who,p.n)&&(x.school===p.s||norm(x.who)===norm(p.n))})});

  app.innerHTML=
  '<div class="card"><div class="stat">'+
    '<div>ענו<b>'+items.length+'</b></div>'+
    '<div>טרם ענו<b>'+missing.length+' / '+REG.length+'</b></div>'+
    '<div>המפגש בסך הכול<b>'+avg('rate')+'</b></div>'+
    '<div>ברור מה עושים עד 4.11<b>'+avg('clear')+'</b></div>'+
  '</div>'+
  '<div class="rowbtns"><button class="btn ghost" onclick="location.reload()">רענון</button><button class="btn ghost" id="csv">הורדת CSV</button></div></div>'+

  '<div class="card"><h2>מי טרם מילא ('+missing.length+')</h2>'+
    '<p class="hint">מתוך '+REG.length+' שנכחו בכנס לפי מנור. ההצלבה לפי שם, גמישה לכתיב. לפני שפונים למישהו, כדאי להציץ ב"ענו ולא זוהו" למטה.</p>'+
    '<div class="miss">'+missing.map(function(p){return '<span>'+esc(p.n)+' <small>· '+esc(p.s)+'</small></span>'}).join('')+'</div>'+
    (missing.length?'<div class="rowbtns"><button class="btn ghost" id="cpMiss">העתקת הרשימה</button></div>':'')+
    (extra.length?'<h2 style="margin-top:16px;font-size:15px">ענו ולא זוהו ברשימה ('+extra.length+')</h2><div class="miss">'+
      extra.map(function(x){return '<span>'+esc(x.who)+' <small>· '+esc(x.school)+'</small></span>'}).join('')+'</div>':'')+
  '</div>'+

  '<div class="card"><h2>מי רוצה להציג בזום</h2>'+PRESENT_L.map(function(t){var l=items.filter(function(x){return x.present===t});
    return '<div class="row"><b>'+esc(t)+' ('+l.length+'):</b> '+esc(l.map(function(x){return x.who+' · '+x.school}).join(', '))+'</div>'}).join('')+'</div>'+

  '<div class="card"><h2>מה הכי עבד</h2>'+WORKED.map(function(t){var n=cnt(t);
    return '<div class="bar"><span class="t">'+esc(t)+'</span><span class="track"><span class="fill" style="width:'+Math.round(n/wMax*100)+'%"></span></span><span class="c">'+n+'</span></div>'}).join('')+'</div>'+

  '<div class="card"><h2>כל התשובות ('+items.length+')</h2>'+
    (items.length?items.map(function(x){
      return '<div class="resp"><div class="who">'+esc(x.who)+'<small>'+esc(x.school)+'</small>'+
        '<span class="r">מפגש '+esc(x.rate)+' · ברור '+esc(x.clear)+'</span></div>'+
        ((x.worked||[]).length?'<div class="row"><b>עבד:</b> '+esc(x.worked.join(' · '))+'</div>':'')+
        (x.improve?'<div class="row"><b>לשפר:</b> '+esc(x.improve)+'</div>':'')+
        (x.help?'<div class="row"><b>עזרה ל-4.11:</b> '+esc(x.help)+'</div>':'')+
        (x.heart?'<div class="row"><b>מהלב:</b> '+esc(x.heart)+'</div>':'')+
        (x.present?'<div class="row"><b>להציג בזום:</b> '+esc(x.present)+'</div>':'')+
      '</div>';
    }).join(''):'<p class="hint">עדיין אין תשובות.</p>')+'</div>';

  if($('cpMiss'))$('cpMiss').onclick=function(){copyText(missing.map(function(p){return p.n+' · '+p.s}).join('\n'))};
  $('csv').onclick=function(){
    var head=['שם','בית ספר','המפגש','ברור עד 4.11','מה עבד','לשפר','עזרה ל-4.11','מהלב','להציג בזום','זמן'];
    var rows=items.map(function(x){return [x.who,x.school,x.rate,x.clear,(x.worked||[]).join(' | '),x.improve,x.help,x.heart,x.present||'',x.ts]});
    var csv='﻿'+[head].concat(rows).map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='mashov-21-10.csv';document.body.appendChild(a);a.click();a.remove();
  };
}

if(qs.get('admin')===ADMIN_PARAM)renderAdmin();else render();
</script>
