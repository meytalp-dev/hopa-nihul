<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אישור פוסטים · הופה</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--pink:#E8348A;--pink-dark:#c02673;--pink-soft:#fde7f2;--yellow:#FFF200;
    --ink:#1f1f26;--muted:#6f6f7c;--line:#ebe6ee;--bg:#f6f2f7;--ok:#22b573;--warn:#f0a500;--no:#d9534f;
    --shadow:0 4px 18px rgba(31,31,38,.07)}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{font-family:'Rubik',system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  button,input,textarea{font-family:inherit;font-size:inherit}
  .in{max-width:760px;margin:0 auto;padding:0 16px}
  .in.adm{max-width:1000px}

  header{background:#111;color:#fff;padding:18px 0 22px;position:relative;overflow:hidden}
  header:after{content:"";position:absolute;inset-inline-start:-80px;top:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,242,0,.2),transparent 65%)}
  .hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{background:#fff;border-radius:14px;padding:6px 10px;display:inline-flex}
  .logo img{height:36px;display:block}
  header h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.3px}
  header .sub{font-size:13px;opacity:.8;margin-top:3px}

  .who{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(31,31,38,.06)}
  .who .in{display:flex;gap:10px;align-items:center;padding-top:9px;padding-bottom:9px;flex-wrap:wrap}
  .who input{flex:1;min-width:130px;border:1.5px solid var(--line);border-radius:11px;padding:8px 11px;outline:none}
  .who input:focus{border-color:var(--pink)}
  .prog{flex:none;font-size:12.5px;font-weight:800;color:var(--muted)}
  .savedot{font-size:12px;font-weight:800;color:var(--ok);min-width:56px;text-align:center}
  .savedot.busy{color:var(--warn)}.savedot.err{color:var(--no)}

  main{padding:16px 0 100px}
  .intro{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:18px;margin-bottom:6px}
  .intro h2{margin:0 0 6px;font-size:18px;font-weight:900}
  .intro p{margin:0 0 8px;font-size:14.5px}

  .sec{margin:26px 0 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .sec h2{margin:0;font-size:20px;font-weight:900}
  .sec .d{color:var(--muted);font-size:13.5px}

  .card{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:14px;margin-top:14px;border-inline-start:5px solid var(--line)}
  .card.st-ok{border-inline-start-color:var(--ok)}
  .card.st-fix{border-inline-start-color:var(--warn)}
  .card.st-no{border-inline-start-color:var(--no)}
  .card h3{margin:2px 4px 10px;font-size:17px;font-weight:900}
  .card h3 small{font-weight:600;color:var(--muted);font-size:12.5px;margin-inline-start:6px}
  .imgs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
  .imgs img{flex:none;width:min(100%,420px);aspect-ratio:4/5;object-fit:cover;border-radius:12px;scroll-snap-align:start;cursor:zoom-in;background:#eee}
  .imgs.multi img{width:min(82%,340px)}
  .swipe{font-size:12px;color:var(--muted);font-weight:700;margin:2px 4px 0}
  details.cap{margin-top:10px;background:#faf8fb;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px}
  details.cap summary{cursor:pointer;font-weight:800;font-size:13.5px}
  details.cap div{white-space:pre-line;font-size:14px;margin-top:8px}
  .sts{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
  .sts button{flex:1 1 90px;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:9px 6px;font-size:13.5px;font-weight:800;cursor:pointer;color:var(--muted)}
  .sts button.on[data-s=ok]{background:#e8f8ef;border-color:var(--ok);color:#14613b}
  .sts button.on[data-s=fix]{background:#fff8dc;border-color:var(--warn);color:#6b5300}
  .sts button.on[data-s=no]{background:#fff4f4;border-color:var(--no);color:#a03030}
  .card textarea{width:100%;margin-top:9px;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;min-height:54px;resize:vertical;outline:none;line-height:1.5}
  .card textarea:focus{border-color:var(--pink)}

  .genbox{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:18px;margin-top:24px}
  .genbox h3{margin:0 0 8px;font-size:17px;font-weight:900}
  .genbox textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;min-height:90px;outline:none;resize:vertical}

  .done{position:fixed;inset-inline:0;bottom:0;background:#111;color:#fff;padding:11px 16px;z-index:40}
  .done .in{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .done .t{font-size:13.5px;font-weight:700;flex:1;min-width:140px}
  .done .t b{color:var(--yellow)}
  .done button{border:none;background:var(--yellow);color:#111;border-radius:11px;padding:10px 20px;font-weight:800;font-size:14px;cursor:pointer}

  #lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:100;padding:14px}
  #lb.show{display:flex}
  #lb img{max-width:100%;max-height:100%;border-radius:10px}

  .rev{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:15px;margin-top:12px}
  .rev h3{margin:0 0 8px;font-size:16px;font-weight:900}
  .rrow{border-top:1px solid var(--line);padding:9px 0;font-size:14px}
  .pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:800;margin-inline-end:6px}
  .pill.ok{background:#e8f8ef;color:#14613b}.pill.fix{background:#fff8dc;color:#6b5300}.pill.no{background:#fff4f4;color:#a03030}
  .btn{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:9px 17px;font-weight:800;font-size:13.5px;cursor:pointer}
  #toast{position:fixed;inset-inline:0;bottom:74px;margin:auto;width:max-content;max-width:88%;background:var(--pink);color:#fff;padding:11px 22px;border-radius:999px;font-weight:800;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
  #toast.show{opacity:1}
</style>
</head>
<body>

<header><div class="in">
  <div class="hrow">
    <span class="logo"><img src="hopa-logo.png" alt="הופה"></span>
    <div><h1 id="ttl">אישור פוסטים לפייסבוק</h1>
      <div class="sub" id="sub">שתי סדרות לפייסבוק · לאישור לירון</div></div>
  </div>
</div></header>

<div class="who" id="whoBar"><div class="in">
  <input type="text" id="me" placeholder="השם שלך">
  <span class="prog" id="pt">0 / 8</span>
  <span class="savedot" id="sd">נשמר ✓</span>
</div></div>

<main class="in" id="wrap"><div id="app"></div></main>

<div class="done" id="doneBar"><div class="in">
  <div class="t">ההערות נשמרות לבד. כשסיימת — <b>לחצי כאן</b> ומיטל תקבל.</div>
  <button id="finBtn">סיימתי ✓</button>
</div></div>

<div id="lb"><img alt=""></div>
<div id="toast"></div>

<script>
var EXEC_URL='https://script.google.com/macros/s/AKfycby7ilGQKB0eypgYMJ0-F4PDgRUlhs12wB5NQVV3_gsm4U1iWec4aNzmeQ8qi7dFFBUoGw/exec';
var GS_SECRET='hopa-nihul-2026';
var KEY='ishur-posts-';
var ADMIN='hopa';

var SECTIONS=[
  {t:'סדרה א׳ · בהשראת גראז׳ — לפייסבוק',d:'פונה למנהלים, לבתי ספר ולשותפים. כל פוסט צבעוני — צבע רקע משלו ושני צבעי הדגשה. תמונה בודדת.',items:[
    {id:'g1',t:'המפתח לשנה שאחרי',imgs:['fb-1-hamafteach']},
    {id:'g2',t:'מי מלווה את ההמראה?',imgs:['fb-2-hamraa']},
    {id:'g3',t:'יש להם כתובת',imgs:['fb-3-yesh-lahem-ktovet']},
    {id:'g4',t:'פתאום הכל נראה אפשרי',imgs:['fb-4-pitom']}
  ]},
  {t:'סדרה ב׳ · ״ואז — הופה!״ סיפורי בוגרים',d:'קרוסלה של 3 תמונות לכל סיפור: לפני → ואז הופה! → היום.',items:[
    {id:'s1',t:'החלום של ל׳',imgs:['story-1-L-1','story-1-L-2','story-1-L-3'],cap:
'ל׳ סיימה את בית הספר ועמדה בצומת דרכים.\nהיה לה חלום ברור — קורס ביוטי — והיא הרגישה קצת אבודה.\n\nהיא פנתה אלינו כבוגרת, והופה החליטה להשקיע בעתיד שלה.\n\nהיום ל׳ סיימה את הקורס שחלמה עליו. הכנו לה גם לוגו לעסק החדש.\nמ"קצת אבודה" — לפרק חדש, שהיא בונה בעצמה. 💛'},
    {id:'s2',t:'800 ₪ לחג',imgs:['story-2-chag-1','story-2-chag-2','story-2-chag-3'],cap:
'50 בוגרים ובוגרות של בתי הספר של הופה קיבלו לקראת החגים 800 ₪ כל אחד — מתנה מהקרן לידידות.\n\nלא כי הם פנו אלינו.\nכי רצינו שיהיה להם כסף זמין לקראת החגים.\n\nכך זה בהופה: דואגים לבוגרים שלנו גם בחגים.\nתודה לקרן לידידות על השותפות. 🙏'},
    {id:'s3',t:'קורס בינה מלאכותית',imgs:['story-3-ai-1','story-3-ai-2','story-3-ai-3'],cap:
'פרסמנו לבוגרים קורס בינה מלאכותית והכשרה בחינם.\nאחד הבוגרים שלנו ממש רצה להירשם — אבל דמי הרישום עמדו על מאות שקלים.\n\nבזכות הופה, הוא נרשם.\nהיום הוא בעיצומו של הקורס, ולומד כלים שמשנים את עולם העבודה.\n\nלפעמים מה שעומד בין בוגר לבין ההזדמנות הבאה הוא כמה מאות שקלים. אצלנו — זה כבר לא עומד בדרך.'},
    {id:'s4',t:'מילגה פלוס',imgs:['story-4-milga-1','story-4-milga-2','story-4-milga-3'],cap:
'המטרה שלנו: שלכל בוגר ובוגרת של הופה תהיה אפשרות לבחור את העתיד שלהם — ובמיוחד לימודי המשך.\n\nלכן בוגרי הופה קיבלו, ללא עלות, הרשמה למילגה פלוס — פלטפורמה לקבלת מלגות בכל מוסדות הלימוד המוכרים.\n\nכבר עשרות בוגרים נרשמו. פחות דאגות כלכליות, יותר זמן להשקיע בעצמם ובלימודים.\nוזו רק ההתחלה.'}
  ]}
];
var ALL=[];SECTIONS.forEach(function(s){s.items.forEach(function(i){ALL.push(i)})});

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(function(){e.classList.remove('show')},2200)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

var qs=new URLSearchParams(location.search);
var revId=lsGet('hopa-ishur-id');
if(!revId){revId=Date.now().toString(36)+Math.random().toString(36).slice(2,6);lsSet('hopa-ishur-id',revId)}

function jsonp(params,tmo){
  return new Promise(function(res,rej){
    var cb='cb'+Math.random().toString(36).slice(2);
    params=Object.assign({},params,{callback:cb});
    var s=document.createElement('script');
    var t=setTimeout(function(){cl();rej(new Error('timeout'))},tmo||25000);
    function cl(){try{delete window[cb]}catch(e){window[cb]=undefined}s.remove();clearTimeout(t)}
    window[cb]=function(d){cl();res(d)};
    s.src=EXEC_URL+'?'+new URLSearchParams(params).toString();
    s.onerror=function(){cl();rej(new Error('network'))};
    document.head.appendChild(s);
  });
}
function delay(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function jsonpRetry(p,tries){var e;for(var i=1;i<=(tries||5);i++){try{var r=await jsonp(p,25000);if(r&&r.ok)return r;e=new Error((r&&r.error)||'שגיאה')}catch(x){e=x}await delay(700+i*600)}throw e}

/* ---------- מצב ---------- */
var D=(function(){try{var s=JSON.parse(lsGet('hopa-ishur-posts'));if(s&&s.items)return s}catch(e){}return {who:'',items:{},general:'',done:false}})();
function save(){lsSet('hopa-ishur-posts',JSON.stringify(D))}
var saveTimer=null,saving=false,pending=false;
function mark(st){var e=$('sd');if(!e)return;e.className='savedot'+(st==='busy'?' busy':st==='err'?' err':'');e.textContent=st==='busy'?'שומר…':st==='err'?'לא נשמר':'נשמר ✓'}
function queueSave(){save();mark('busy');clearTimeout(saveTimer);saveTimer=setTimeout(pushSave,1400)}
async function pushSave(){
  if(saving){pending=true;return}
  saving=true;
  var payload={who:(D.who||'').trim(),items:D.items,general:D.general,done:!!D.done,ts:new Date().toISOString(),kind:'ishur-posts'};
  var params={action:'intakeSubmit',school:KEY+revId,json:JSON.stringify(payload)};
  var ok=false;
  try{
    if(new URLSearchParams(params).toString().length>6200)throw new Error('long');
    await jsonpRetry(params,3);ok=true;
  }catch(e){
    try{await fetch(EXEC_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(params).toString()});ok=true}catch(e2){}
  }
  saving=false;mark(ok?'ok':'err');
  if(pending){pending=false;pushSave()}
}

/* ---------- בנייה ---------- */
function render(){
  var html='<div class="intro"><h2>לירון, שתי סדרות פוסטים לאישור 💛</h2>'+
    '<p><b>סדרה א׳</b> — בהשראת הפרסום של גראז׳ שאהבת, בגרסה צבעונית. <b>סדרה ב׳</b> — ״ואז — הופה!״: ארבעה סיפורים אמיתיים של בוגרים, כל אחד בשלוש תמונות.</p>'+
    '<p style="color:var(--muted);font-size:13.5px;margin:0">לכל פוסט: מאושר / לתקן / לא מתאים, ואם צריך — הערה. לחיצה על תמונה מגדילה אותה. ההערות נשמרות לבד.</p></div>';
  SECTIONS.forEach(function(s){
    html+='<div class="sec"><h2>'+esc(s.t)+'</h2><span class="d">'+esc(s.d)+'</span></div>';
    s.items.forEach(function(p){
      var it=D.items[p.id]||{};
      html+='<div class="card'+(it.s?' st-'+it.s:'')+'" data-card="'+p.id+'">'+
        '<h3>'+esc(p.t)+(p.imgs.length>1?'<small>קרוסלה · '+p.imgs.length+' תמונות</small>':'')+'</h3>'+
        '<div class="imgs'+(p.imgs.length>1?' multi':'')+'">'+p.imgs.map(function(n){return '<img loading="lazy" src="ishur/'+n+'.jpg" alt="">'}).join('')+'</div>'+
        (p.imgs.length>1?'<div class="swipe">← החליקו לתמונות הבאות</div>':'')+
        (p.cap?'<details class="cap"><summary>📝 הטקסט לפוסט</summary><div>'+esc(p.cap)+'</div></details>':'')+
        '<div class="sts" data-id="'+p.id+'">'+
          '<button data-s="ok"'+(it.s==='ok'?' class="on"':'')+'>✓ מאושר</button>'+
          '<button data-s="fix"'+(it.s==='fix'?' class="on"':'')+'>✏️ לתקן</button>'+
          '<button data-s="no"'+(it.s==='no'?' class="on"':'')+'>✖️ לא מתאים</button>'+
        '</div>'+
        '<textarea data-id="'+p.id+'" placeholder="הערה (לא חובה)">'+esc(it.note||'')+'</textarea>'+
      '</div>';
    });
  });
  html+='<div class="genbox"><h3>💬 הערה כללית</h3><textarea id="general" placeholder="על הסדרות, הסגנון, סדר הפרסום…">'+esc(D.general||'')+'</textarea></div>';
  $('app').innerHTML=html;
  bind();paintProg();
}
function bind(){
  [].slice.call(document.querySelectorAll('.sts')).forEach(function(box){
    var id=box.dataset.id;
    [].slice.call(box.children).forEach(function(b){
      b.onclick=function(){
        var it=D.items[id]=D.items[id]||{};
        it.s=(it.s===b.dataset.s)?'':b.dataset.s;
        [].slice.call(box.children).forEach(function(x){x.classList.toggle('on',x.dataset.s===it.s)});
        box.closest('.card').className='card'+(it.s?' st-'+it.s:'');
        queueSave();paintProg();
      };
    });
  });
  [].slice.call(document.querySelectorAll('.card textarea')).forEach(function(el){
    el.addEventListener('input',function(){var it=D.items[this.dataset.id]=D.items[this.dataset.id]||{};it.note=this.value;queueSave()});
  });
  $('general').addEventListener('input',function(){D.general=this.value;queueSave()});
  [].slice.call(document.querySelectorAll('.imgs img')).forEach(function(im){
    im.onclick=function(){$('lb').querySelector('img').src=im.src;$('lb').classList.add('show')};
  });
}
$('lb').onclick=function(){this.classList.remove('show')};
function paintProg(){var n=0;ALL.forEach(function(p){if((D.items[p.id]||{}).s)n++});$('pt').textContent=n+' / '+ALL.length}

/* ---------- ניהול ---------- */
async function admin(){
  $('ttl').textContent='אישור פוסטים · ניהול';
  $('sub').textContent='מה אושר ומה לתקן · חי מהגיליון';
  $('whoBar').style.display='none';$('doneBar').style.display='none';
  $('wrap').classList.add('adm');
  $('app').innerHTML='<div class="intro"><p>טוען…</p></div>';
  var store;
  try{var r=await jsonpRetry({action:'storeAll',secret:GS_SECRET},6);store=r.store}
  catch(e){$('app').innerHTML='<div class="intro"><p>לא נטען (תקלה רגעית של גוגל). <button class="btn" onclick="location.reload()">🔄 נסו שוב</button></p></div>';return}
  var revs=Object.keys(store).filter(function(k){return k.indexOf('intake_'+KEY)===0}).map(function(k){return store[k]||{}})
    .filter(function(x){return x.who||Object.keys(x.items||{}).length});
  if(!revs.length){$('app').innerHTML='<div class="intro"><p>עדיין אין תשובות.</p></div>';return}
  var pill={ok:'מאושר',fix:'לתקן',no:'לא מתאים'};
  var html='<div class="intro"><h2>'+revs.map(function(r){return esc(r.who||'ללא שם')+(r.done?' ✓':' · בתהליך')}).join(' · ')+'</h2>'+
    '<button class="btn" onclick="location.reload()">🔄 רענון</button></div>';
  SECTIONS.forEach(function(s){
    html+='<div class="rev"><h3>'+esc(s.t)+'</h3>';
    s.items.forEach(function(p){
      var rows=revs.map(function(r){var it=(r.items||{})[p.id];if(!it||(!it.s&&!it.note))return'';
        return '<div>'+(it.s?'<span class="pill '+it.s+'">'+pill[it.s]+'</span>':'')+'<b>'+esc(r.who||'—')+'</b>'+(it.note?': '+esc(it.note):'')+'</div>'}).join('');
      html+='<div class="rrow"><b>'+esc(p.t)+'</b>'+(rows||'<div style="color:var(--muted)">—</div>')+'</div>';
    });
    html+='</div>';
  });
  var gen=revs.filter(function(r){return (r.general||'').trim()});
  if(gen.length)html+='<div class="rev"><h3>💬 הערות כלליות</h3>'+gen.map(function(r){return '<div class="rrow"><b>'+esc(r.who)+':</b> '+esc(r.general)+'</div>'}).join('')+'</div>';
  $('app').innerHTML=html;
}

$('me').value=D.who||'';
$('me').addEventListener('input',function(){D.who=this.value;queueSave()});
$('finBtn').onclick=function(){
  if(!(D.who||'').trim()){toast('רק לרשום את השם למעלה 🙂');$('me').focus();return}
  D.done=true;queueSave();pushSave();
  this.textContent='תודה! נשלח ✓';this.disabled=true;
  toast('תודה 💛 ההערות הגיעו למיטל');
};
if(qs.get('admin')===ADMIN)admin();else{render();mark('ok')}
</script>
</body>
</html>
