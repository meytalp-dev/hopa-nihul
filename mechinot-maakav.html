<!doctype html>
<html lang="he" dir="rtl">
<head>
<script src="staff-code.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>שאלון המכינות: התשובות | הופה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* סולם ההסכמה: ורוד (לא מסכים) ← אפור (באמצע) ← זית (מסכים). נבדק מול עיוורון צבעים */
:root{--pink:#E8348A;--olive:#635F2F;--khaki:#A4A080;--olive-soft:#eeede3;--ink:#2a2915;--muted:#6f6c55;--line:#e4e2d3;--bg:#f7f6f0;--card:#fff;
  --l1:#A83A62;--l2:#D9799B;--l3:#C9C6B8;--l4:#9C9850;--l5:#5A562A;--bar:#7d7940;--track:#efeee6}
*{box-sizing:border-box}
body{margin:0;font-family:Rubik,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 60px}
.stripe{display:flex;height:5px}.stripe i{flex:1}
header.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:22px}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-bottom:0}
header.top img{height:36px;display:block}
header.top .x{color:var(--khaki);font-weight:700}
h1{font-size:clamp(22px,4.8vw,30px);margin:0 0 4px;font-weight:800;color:var(--olive);line-height:1.25}
.lead{color:var(--muted);margin:0 0 16px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-size:28px;font-weight:800;color:var(--olive);line-height:1.1}
.kpi b.sm{font-size:17px;padding-top:8px}
.kpi span{font-size:13px;color:var(--muted)}
.status{font-size:13px;color:var(--muted);margin:6px 0 0}
/* מקטע */
.sec{margin-top:30px}
.sec h2{font-size:19px;margin:0 0 12px;color:var(--olive);border-inline-start:4px solid var(--khaki);padding-inline-start:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.qt{font-weight:500;margin:0 0 4px}
.qt .n{color:var(--muted);font-weight:400}
.qm{font-size:13px;color:var(--muted);margin:0 0 10px}
.tag{display:inline-block;font-size:12px;background:#fbe6ef;color:#8a2c50;border-radius:999px;padding:1px 9px;margin-inline-start:6px;vertical-align:1px}
/* סולם הסכמה — פס מחולק */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:0 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.lk{margin-bottom:16px}
.lk:last-child{margin-bottom:0}
.lk .row{display:flex;align-items:center;gap:10px}
.stack{flex:1;display:flex;gap:2px;height:30px}
.stack i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:500;min-width:0;overflow:hidden;white-space:nowrap}
.stack i:first-child{border-start-start-radius:4px;border-end-start-radius:4px}
.stack i:last-child{border-start-end-radius:4px;border-end-end-radius:4px}
.stack i.dk-text{color:#fff}
.avg{flex:none;width:58px;text-align:center;font-size:13px;color:var(--muted);line-height:1.2}
.avg b{display:block;font-size:18px;color:var(--ink)}
.lk .sub{font-size:12px;color:var(--muted);margin-top:4px}
/* בחירה — פסים אופקיים */
.bars{display:grid;grid-template-columns:minmax(120px,42%) 1fr;gap:6px 12px;align-items:center}
.bars .lbl{font-size:14px}
.bars .lbl.zero{color:#a5a38d}
.bars .bv{display:flex;align-items:center;gap:8px}
.bars .tr{flex:1;height:18px;background:var(--track);border-radius:4px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--bar);border-start-end-radius:4px;border-end-end-radius:4px}
.bars .num{flex:none;width:72px;font-size:13px;color:var(--muted);white-space:nowrap}
.bars .num b{color:var(--ink)}
.others{margin-top:10px;font-size:13px;color:var(--muted)}
.others ul,.quotes{margin:6px 0 0;padding:0;list-style:none}
.others li{background:var(--olive-soft);border-radius:8px;padding:4px 10px;margin:4px 0;color:var(--ink)}
.quotes li{background:var(--olive-soft);border-radius:10px;padding:10px 14px;margin:6px 0;border-inline-start:3px solid var(--khaki)}
.empty{color:var(--muted);font-size:14px}
/* תובנות */
.insbtn{margin-top:14px}
.ins{margin-top:12px}
.ins h3{font-size:16px;margin:22px 0 10px;color:var(--olive);border-inline-start:4px solid var(--khaki);padding-inline-start:10px}
.ins h3:first-child{margin-top:4px}
.ins .warn{font-size:13px;background:#fff8c4;border-radius:8px;padding:6px 10px;margin:0 0 10px}
.ins .foot{font-size:12px;color:var(--muted);margin:16px 0 0}
.ins .ibox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
/* השורה התחתונה — שני מספרים גדולים */
.hero .hl{font-size:clamp(18px,4.4vw,22px);font-weight:800;margin:0 0 14px;line-height:1.3}
.hero .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hero .big{font-size:clamp(40px,11vw,56px);font-weight:800;line-height:1;color:var(--ink)}
.hero .cap{font-size:14px;color:var(--muted);margin:4px 0 8px;min-height:2.6em}
.fat{height:14px;background:var(--track);border-radius:4px;overflow:hidden}
.fat i{display:block;height:100%;border-radius:4px}
.hero .gap{margin:14px 0 0;font-size:14px;color:var(--muted)}
.hero .gap b{color:var(--pink);font-size:16px}
/* מי ענה */
.who{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center}
.who .big{font-size:40px;font-weight:800;line-height:1;color:var(--olive)}
.who .lbl{font-size:13px;color:var(--muted)}
.who .sm{font-size:13px;color:var(--muted);margin-top:6px}
/* שורות עמדה: מספר גדול + פס + המשפט */
.st{display:grid;grid-template-columns:62px 1fr;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.st:last-child{border-bottom:0}
.st .p{font-size:26px;font-weight:800;line-height:1;grid-row:span 2}
.st .p small{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:3px}
.st .t{font-size:14px;line-height:1.4}
.st .t .qn{color:var(--muted);font-size:12px}
.st .fat{height:8px}
.sub-h{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 2px}
.sub-h:first-child{margin-top:0}
/* כרטיסי בחירה */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.cc .ct{font-size:13.5px;font-weight:500;line-height:1.35;margin:0 0 10px}
.cc .ct .qn{color:var(--muted);font-weight:400}
.cc .o{margin:0 0 8px}
.cc .o:last-child{margin:0}
.cc .ol{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:3px}
.cc .ol b{flex:none}
.cc .o.first .ol{font-weight:700}
.cc .fat{height:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--olive-soft);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;border:0;font-family:inherit;color:var(--ink)}
.chip b{font-size:18px;color:var(--olive)}
@media (max-width:640px){ .cgrid{grid-template-columns:1fr} }
/* בתי ספר — מקופל */
details.box{background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:12px}
details.box summary{cursor:pointer;padding:13px 16px;font-weight:500;color:var(--olive)}
details.box .in{padding:0 16px 14px}
.sl{display:flex;flex-wrap:wrap;gap:6px}
.sl span{font-size:13px;background:var(--olive-soft);border-radius:999px;padding:3px 11px}
.sl span b{color:var(--olive)}
.sl.miss span{background:#f4f3ee;color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:500}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.link{direction:ltr;text-align:left;font-size:13px;background:var(--olive-soft);border-radius:8px;padding:6px 10px;word-break:break-all}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
@media (max-width:560px){
  .kpis{grid-template-columns:1fr 1fr}
  .kpis .kpi:last-child{grid-column:1/-1}
  .bars{grid-template-columns:1fr;gap:2px}
  .bars .lbl{margin-top:6px;font-size:13.5px}
  .bars .tr{height:14px}
  .avg{width:48px}
}
</style>
</head>
<body>
<div class="stripe"><i style="background:#635F2F"></i><i style="background:#A4A080"></i><i style="background:#FFF200"></i><i style="background:#E8348A"></i></div>
<header class="top"><div class="wrap">
  <a href="https://hopa.org.il" target="_blank" rel="noopener"><img src="hopa-logo.png" alt="עמותת הופה"></a>
  <span class="x">×</span>
  <img src="one-of-us-logo.png" alt="מכינת אחד משלנו">
</div></header>

<div class="wrap">
  <h1>מה הצוותים חושבים על מכינות</h1>
  <p class="lead">התשובות לשאלון הצוות של הופה ומכינת "אחד משלנו", בלי שמות. הנתונים מתעדכנים מהגיליון.</p>
  <div id="kpis"></div>
  <div class="status" id="status">טוען…</div>
  <button class="btn primary insbtn" id="insBtn" onclick="toggleInsights()" hidden><svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>תובנות מהתשובות</button>
  <div id="insights"></div>
  <div id="app"></div>

  <details class="box" id="schoolsBox">
    <summary>בתי הספר שמילאו</summary>
    <div class="in" id="schools"></div>
  </details>

  <details class="box">
    <summary>קישור לשאלון לשליחה לצוותים</summary>
    <div class="in">
      <div class="link" id="formLink" dir="ltr"></div>
      <div class="btns">
        <button class="btn primary" onclick="copyMsg()"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>העתקת הודעה עם הקישור</button>
        <button class="btn" onclick="copyLink()">העתקת הקישור בלבד</button>
        <a class="btn" id="openForm" target="_blank" rel="noopener">פתיחת השאלון</a>
        <button class="btn" onclick="exportCSV()"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>ייצוא לאקסל (לצוות הופה, עם קוד)</button>
      </div>
    </div>
  </details>
</div>
<div id="toast" class="toast"></div>

<script src="mechinot-q.js"></script>
<script>
const FORM_URL = new URL('mechinot-tofes.html', location.href).href;
const MSG = `שלום לצוות 👋
עמותת הופה ומכינת "אחד משלנו" רוצות לשמוע מה דעתכם על מכינות קדם-צבאיות ואיך אפשר לקדם את הנושא בבית הספר.
זה שאלון קצר, כ-5 דקות, רובו בלחיצה ובלי שם:
${FORM_URL}
תודה רבה! 🙏`;
document.getElementById('formLink').textContent = FORM_URL;
document.getElementById('openForm').href = FORM_URL;
const app = document.getElementById('app');
const LCOL = ['var(--l1)','var(--l2)','var(--l3)','var(--l4)','var(--l5)'];
let DATA = null, QS = null;

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function copy(t, ok){
  const done=()=>toast(ok);
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, ()=>fallback());
  else fallback();
  function fallback(){ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand('copy'); done();}catch(e){prompt('העתיקו:', t);} a.remove(); }
}
const copyMsg = () => copy(MSG, 'ההודעה הועתקה — אפשר להדביק בוואטסאפ');
const copyLink = () => copy(FORM_URL, 'הקישור הועתק');
const setStatus = t => document.getElementById('status').textContent = t;
const fmt = iso => { if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('he-IL',{day:'numeric',month:'numeric'})+' · '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}); };
const pct = (k,n) => n ? Math.round(100*k/n) : 0;

// קריאה ציבורית: השרת מחזיר לכל שאלה רשימת תשובות מעורבבת, בלי לקשר בין תשובות של אותו אדם
async function load(){
  setStatus('טוען מהגיליון…');
  try{
    const r = await jsonp({action:'storeAll'}, i=>setStatus(`גוגל מתעכב — מנסה שוב (${i}/4)…`));
    if(!r || !r.ok) throw new Error((r&&r.error)||'err');
    const st = r.store||{};
    QS = (st[STORE_KEY] && Array.isArray(st[STORE_KEY].sections)) ? st[STORE_KEY] : DEFAULT;
    DATA = st.mechinot_public || {n:0, last:'', schools:{}, ans:{}};
    setStatus('');
    render();
  }catch(e){ setStatus('לא הצלחתי לטעון מהגיליון. רעננו את הדף.'); }
}

function render(){
  const n = DATA.n, sch = DATA.schools||{};
  const nSch = Object.keys(sch).length;
  document.getElementById('kpis').innerHTML = `<div class="kpis">
    <div class="kpi"><b>${n}</b><span>אנשי צוות מילאו</span></div>
    <div class="kpi"><b>${nSch}</b><span>בתי ספר</span></div>
    <div class="kpi"><b class="sm">${fmt(DATA.last)}</b><span>תשובה אחרונה</span></div>
  </div>`;
  document.getElementById('insBtn').hidden = !n;
  if(document.getElementById('insights').innerHTML) document.getElementById('insights').innerHTML = insightsHTML();
  if(!n){ app.innerHTML = '<p class="empty" style="margin-top:20px">עוד אין תשובות. כשמישהו ימלא, התשובות יופיעו כאן.</p>'; renderSchools(); return; }

  let h = '', num = 0;
  QS.sections.forEach(s=>{
    const qs = s.questions.map(q=>({q, no:++num})).filter(x=>x.q.type!=='select');   // בית הספר — למטה, ברשימה המקופלת
    if(!qs.length) return;
    h += `<section class="sec"><h2>${esc(s.title)}</h2>`;
    // לפי סדר השאלון; שאלות סולם רצופות נכנסות לכרטיס אחד עם מקרא
    qs.forEach((x,i)=>{
      if(x.q.type==='likert'){
        if(!i || qs[i-1].q.type!=='likert') h += `<div class="card"><div class="legend">${LIKERT.map((t,j)=>`<span><i style="background:${LCOL[j]}"></i>${j+1} · ${esc(t)}</span>`).join('')}</div>`;
        h += likertHTML(x.q, x.no);
        if(i===qs.length-1 || qs[i+1].q.type!=='likert') h += `</div>`;
      } else h += `<div class="card">${x.q.type==='text' ? textHTML(x.q, x.no) : barsHTML(x.q, x.no)}</div>`;
    });
    h += `</section>`;
  });
  app.innerHTML = h;
  renderSchools();
}

function title(q){ return String(q.text).replace(/\s*\(([^()]*)\)\s*$/, ''); }
const reverse = q => /שאלה הפוכה/.test(q.note||'');

function likertHTML(q, no){
  const vals = DATA.ans[q.id]||[];
  const c = [0,0,0,0,0]; let dk = 0;
  vals.forEach(v=>{ const k = Number(v); if(k>=1 && k<=5) c[k-1]++; else dk++; });
  const m = c.reduce((a,b)=>a+b,0);
  const avg = m ? (c.reduce((s,k,i)=>s+k*(i+1),0)/m).toFixed(1) : '—';
  const seg = c.map((k,i)=>{ if(!k) return ''; const p = pct(k,m);
    return `<i style="flex:${k};background:${LCOL[i]}" class="${i===0||i===4?'dk-text':''}" title="${esc(LIKERT[i])}: ${k} (${p}%)">${p>=12?p+'%':''}</i>`; }).join('');
  return `<div class="lk">
    <div class="qt"><span class="n">${no}.</span> ${esc(title(q))}${reverse(q)?'<span class="tag">הסכמה כאן = חסם</span>':''}</div>
    <div class="row"><div class="stack" role="img" aria-label="${esc(c.map((k,i)=>LIKERT[i]+' '+k).join(', '))}">${seg||'<i style="flex:1;background:var(--track)"></i>'}</div>
      <div class="avg"><b>${avg}</b>ממוצע</div></div>
    <div class="sub">${m} ענו${dk?` · ${dk} ${esc(DK_TEXT)}`:''}</div>
  </div>`;
}

function barsHTML(q, no){
  const vals = DATA.ans[q.id]||[];
  const counts = {}, others = [];
  q.options.forEach(o=>counts[o]=0);
  vals.forEach(v=>[].concat(v).forEach(x=>{
    x = String(x);
    if(/^אחר: /.test(x)){ others.push(x.replace(/^אחר: /,'')); x = q.options.find(isOther) || 'אחר'; }
    counts[x] = (counts[x]||0) + 1;
  }));
  let rows = Object.keys(counts);
  if(q.type==='multi') rows.sort((a,b)=>counts[b]-counts[a] || q.options.indexOf(a)-q.options.indexOf(b));
  const max = Math.max(1, ...rows.map(r=>counts[r]));
  const base = vals.length;
  const hint = q.type==='multi' ? 'אפשר היה לבחור יותר מתשובה אחת, ולכן האחוזים לא מסתכמים ב-100' : '';
  return `<div class="qt"><span class="n">${no}.</span> ${esc(title(q))}</div>
    <div class="qm">${base} ענו${hint?' · '+hint:''}</div>
    <div class="bars">${rows.map(r=>`<div class="lbl${counts[r]?'':' zero'}">${esc(r)}</div>
      <div class="bv" title="${esc(r)}: ${counts[r]} (${pct(counts[r],base)}%)"><div class="tr"><i style="width:${100*counts[r]/max}%"></i></div>
      <div class="num"><b>${counts[r]}</b> · ${pct(counts[r],base)}%</div></div>`).join('')}</div>
    ${others.length?`<div class="others">מה כתבו ב"אחר":<ul>${others.map(o=>`<li>${esc(o)}</li>`).join('')}</ul></div>`:''}`;
}

function textHTML(q, no){
  const vals = (DATA.ans[q.id]||[]).map(v=>String(v).trim()).filter(Boolean);
  return `<div class="qt"><span class="n">${no}.</span> ${esc(title(q))}</div>
    <div class="qm">${vals.length} כתבו</div>
    ${vals.length?`<ul class="quotes">${vals.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:'<p class="empty">עוד אין תשובות לשאלה הזו.</p>'}`;
}

/* ---------- תובנות: מחושבות בדפדפן מאותם נתונים אנונימיים שבדף ---------- */
function toggleInsights(){
  const box = document.getElementById('insights');
  box.innerHTML = box.innerHTML ? '' : insightsHTML();
  document.getElementById('insBtn').lastChild.textContent = box.innerHTML ? 'הסתרת התובנות' : 'תובנות מהתשובות';
  if(box.innerHTML) box.scrollIntoView({behavior:'smooth', block:'start'});
}
function insightsHTML(){
  const n = DATA.n, sch = DATA.schools||{};
  const qs = [], lk = [];
  let no = 0;
  QS.sections.forEach(s=>s.questions.forEach(q=>{ no++; if(q.type!=='select') qs.push({q, no, sec:s.title}); }));
  // סולם: אחוז מסכימים (4–5), לא מסכימים (1–2), "אין מספיק מידע"
  qs.filter(x=>x.q.type==='likert').forEach(x=>{
    const c=[0,0,0,0,0]; let dk=0;
    (DATA.ans[x.q.id]||[]).forEach(v=>{ const k=Number(v); if(k>=1&&k<=5) c[k-1]++; else dk++; });
    const m = c.reduce((a,b)=>a+b,0); if(!m) return;
    lk.push({no:x.no, sec:x.sec, t:title(x.q), rev:reverse(x.q), m, dk, all:m+dk,
      agree:pct(c[3]+c[4],m), dis:pct(c[0]+c[1],m), avg:(c.reduce((s,k,i)=>s+k*(i+1),0)/m).toFixed(1)});
  });
  const q = t => `"${esc(t)}"`;
  const bar = (v, col) => `<div class="fat"><i style="width:${Math.max(v,1)}%;background:${col}"></i></div>`;
  const stRow = (x, val, col, cap) => `<div class="st" title="${esc(x.t)}: ${val}% ${esc(cap)}">
    <div class="p">${val}%<small>${esc(cap)}</small></div>
    <div class="t">${esc(x.t)} <span class="qn">· ש' ${x.no}</span></div>${bar(val, col)}</div>`;
  let h = '';
  if(n < 10) h += `<p class="warn">עד עכשיו ${n} תשובות בלבד, ולכן אלה תובנות ראשוניות. הן יתחדדו ככל שיותר אנשי צוות ימלאו.</p>`;

  // השורה התחתונה: ממוצע אחוז המסכימים בכל חלק של שאלות סולם — פער גדול בין החלקים הוא הממצא המרכזי
  const bySec = {};
  lk.filter(x=>!x.rev).forEach(x=>(bySec[x.sec]=bySec[x.sec]||[]).push(x.agree));
  const secs = Object.keys(bySec).map(s=>({s, a:Math.round(bySec[s].reduce((p,v)=>p+v,0)/bySec[s].length)})).sort((a,b)=>b.a-a.a);
  if(secs.length>1 && secs[0].a-secs[secs.length-1].a>=30){
    const hi=secs[0], lo=secs[secs.length-1];
    h += `<h3>השורה התחתונה</h3><div class="ibox hero">
      <p class="hl">רוב הצוות מסכים עם "${esc(hi.s)}", אבל מעטים מסכימים עם "${esc(lo.s)}"</p>
      <div class="two">
        <div><div class="big">${hi.a}%</div><div class="cap">מסכימים, בממוצע, עם המשפטים ב"${esc(hi.s)}"</div>${bar(hi.a,'var(--l5)')}</div>
        <div><div class="big">${lo.a}%</div><div class="cap">מסכימים, בממוצע, עם המשפטים ב"${esc(lo.s)}"</div>${bar(lo.a,'var(--pink)')}</div>
      </div>
      <p class="gap">פער של <b>${hi.a-lo.a} נקודות</b>. כאן כנראה נמצאת נקודת המינוף.</p></div>`;
  }

  const nSch = Object.keys(sch).length;
  const top = Object.keys(sch).sort((a,b)=>sch[b]-sch[a])[0];
  const missing = SCHOOLS.filter(s=>!isOther(s) && !sch[s]).length;
  const totSch = nSch + missing;
  h += `<h3>מי ענה</h3><div class="ibox who">
    <div><div class="big">${n}</div><div class="lbl">אנשי צוות</div></div>
    <div><div class="ol" style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px"><span><b>${nSch}</b> בתי ספר מתוך ${totSch}</span><span class="lbl">${missing} עוד לא מילאו</span></div>
      ${bar(pct(nSch,totSch),'var(--bar)')}
      ${top?`<div class="sm">הכי הרבה מ${esc(top)} (${sch[top]})</div>`:''}</div></div>`;

  // עמדות: הכי מסכימים / הכי פחות / חסמים / חלוקות / חסר מידע
  const pos = lk.filter(x=>!x.rev);
  const agreeTop = pos.filter(x=>x.agree>=50).sort((a,b)=>b.agree-a.agree).slice(0,3);
  const low = pos.filter(x=>x.agree<50).sort((a,b)=>a.avg-b.avg).slice(0,3);
  const rev = lk.filter(x=>x.rev && x.agree>=30);
  const split = lk.filter(x=>x.agree>=30 && x.dis>=30);
  const gaps = lk.filter(x=>x.dk && pct(x.dk,x.all)>=20).sort((a,b)=>b.dk/b.all-a.dk/a.all);
  let st = '';
  if(agreeTop.length) st += `<div class="sub-h">✔ על מה יש הסכמה רחבה</div>${agreeTop.map(x=>stRow(x,x.agree,'var(--l5)','מסכימים')).join('')}`;
  if(low.length) st += `<div class="sub-h">✖ איפה ההסכמה נמוכה</div>${low.map(x=>stRow(x,x.agree,'var(--pink)','מסכימים')).join('')}`;
  if(rev.length) st += `<div class="sub-h">⚠ חסמים שעולים מהסולם</div>${rev.map(x=>stRow(x,x.agree,'var(--pink)','רואים קושי')).join('')}`;
  if(split.length) st += `<div class="sub-h">⇄ איפה הדעות חלוקות</div>${split.map(x=>stRow(x,x.dis,'var(--l3)','לא מסכימים')).join('')}`;
  if(gaps.length) st += `<div class="sub-h">? איפה חסר מידע</div>${gaps.map(x=>stRow(x,pct(x.dk,x.all),'var(--l3)','אין מספיק מידע')).join('')}`;
  if(st) h += `<h3>מה הצוות חושב ויודע</h3><div class="ibox">${st}</div>`;

  // בחירה: שלוש התשובות המובילות בכל שאלה
  const ch = [];
  qs.filter(x=>x.q.type==='single'||x.q.type==='multi').forEach(x=>{
    const vals = DATA.ans[x.q.id]||[]; if(!vals.length) return;
    const cnt = {};
    vals.forEach(v=>[].concat(v).forEach(o=>{ o=String(o); if(/^אחר: /.test(o)) o=x.q.options.find(isOther)||'אחר'; cnt[o]=(cnt[o]||0)+1; }));
    const ord = Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,3);
    ch.push(`<div class="cc"><p class="ct">${esc(title(x.q))} <span class="qn">· ש' ${x.no}</span></p>${ord.map((o,i)=>{ const p=pct(cnt[o],vals.length);
      return `<div class="o${i?'':' first'}" title="${esc(o)}: ${cnt[o]} (${p}%)"><div class="ol"><span>${esc(o)}</span><b>${p}%</b></div>${bar(p, i?'var(--khaki)':'var(--bar)')}</div>`; }).join('')}</div>`);
  });
  if(ch.length) h += `<h3>מה בלט בשאלות הבחירה <span class="qm" style="font-weight:400">· שלוש התשובות המובילות</span></h3><div class="cgrid">${ch.join('')}</div>`;

  const txt = qs.filter(x=>x.q.type==='text').reduce((s,x)=>s+(DATA.ans[x.q.id]||[]).filter(v=>String(v).trim()).length,0);
  if(txt) h += `<h3>תשובות פתוחות</h3><button class="chip" onclick="document.querySelector('.quotes').scrollIntoView({behavior:'smooth',block:'center'})"><b>${txt}</b> אנשי צוות כתבו גם בשאלה הפתוחה · לקריאה ↓</button>`;

  return `<div class="ins">${h}<p class="foot">התובנות מחושבות אוטומטית מהתשובות שבדף ומתעדכנות עם כל תשובה חדשה. "מסכימים" = 4–5 בסולם, בלי מי שענה "${esc(DK_TEXT)}".</p></div>`;
}

function renderSchools(){
  const sch = DATA ? DATA.schools||{} : {};
  const filled = Object.keys(sch).sort((a,b)=>sch[b]-sch[a] || a.localeCompare(b,'he'));
  const missing = SCHOOLS.filter(s=>!isOther(s) && !sch[s]);
  document.querySelector('#schoolsBox summary').textContent = `בתי הספר שמילאו (${filled.length})`;
  document.getElementById('schools').innerHTML =
    (filled.length ? `<div class="sl">${filled.map(s=>`<span>${esc(s)} <b>${sch[s]}</b></span>`).join('')}</div>` : '<p class="empty">עוד אף בית ספר.</p>') +
    `<p class="qm" style="margin:16px 0 6px">עוד לא מילאו (${missing.length}):</p>
     <div class="sl miss">${missing.map(s=>`<span>${esc(s)}</span>`).join('')}</div>
     <div class="btns"><button class="btn" onclick="copyMissing()">העתקת רשימת מי שעוד לא מילא</button></div>`;
}
function copyMissing(){
  const sch = DATA ? DATA.schools||{} : {};
  const missing = SCHOOLS.filter(s=>!isOther(s) && !sch[s]);
  copy(missing.join('\n'), 'הרשימה הועתקה');
}

// ייצוא מלא (שורה לכל ממלא/ת) — רק עם קוד צוות הופה
async function exportCSV(){
  const secret = GS_SECRET;
  if(!secret){ toast('צריך קוד צוות לייצוא'); return; }
  toast('מכין את הקובץ…');
  try{
    const r = await jsonp({action:'storeAll', secret});
    if(!r.ok){ if(r.error==='unauthorized'){ staffCodeReset(); toast('קוד הצוות לא נכון'); return; } throw new Error(r.error); }
    const st = r.store||{};
    const resp = Object.keys(st).filter(k=>k.indexOf('intake_'+RESP_PREFIX)===0 && st[k] && st[k].a).map(k=>st[k])
      .sort((a,b)=>String(b.ts).localeCompare(String(a.ts)));
    if(!resp.length){ toast('עוד אין תשובות לייצוא'); return; }
    const cs = [], seen = {};
    QS.sections.forEach(s=>s.questions.forEach(q=>{ if(!seen[q.id]){ seen[q.id]=1; cs.push({id:q.id, q:q.text}); } }));
    resp.forEach(x=>Object.keys(x.a).forEach(id=>{ if(!seen[id]){ seen[id]=1; cs.push({id, q:'שאלה שנמחקה ('+id+')'}); } }));
    const cell = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    const rows = [['תאריך','בית ספר','תפקיד'].concat(cs.map(c=>c.q)).map(cell).join(',')];
    resp.forEach(x=>rows.push([fmt(x.ts), x.school, x.role].concat(cs.map(c=>{ const v=x.a[c.id]; return Array.isArray(v)?v.join(' | '):v; })).map(cell).join(',')));
    const blob = new Blob(['﻿'+rows.join('\r\n')], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'שאלון-מכינות-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ toast('הייצוא לא הצליח. נסו שוב.'); }
}
